name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 阶段 1：最小可运行验证。
# 目的：先确认真实管线能跑通，再逐步加步骤定位失败点。
# 之前一次性写满 12 步，失败时既没日志也没 annotation（5 秒内结束），
# 无法定位——这种"黑盒失败"只能靠二分。

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打印环境
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          echo "sha: $GITHUB_SHA"
          uname -a
          nproc
          ls -la

      - name: 编译工具链
        run: |
          cmake --version | head -1
          g++ --version | head -1
          (ffmpeg -version | head -1) || echo "ffmpeg 缺失"
