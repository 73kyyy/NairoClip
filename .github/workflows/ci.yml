name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 全量测试由 CI 承担，本地不再跑（本地是 aarch64 手机环境，一次约 9 分钟
# 且容易过热；CI 是 x64 且免费不限量）。
#
# 关键设计：CI 环境必须与开发环境**覆盖同一份代码**。
# 本地有 ONNX Runtime，若 CI 没有，AI 推理用例会走降级路径，
# 「本地绿 + CI 绿」就不代表同一件事。因此这里显式安装 ORT 并断言其生效。

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # 全量测试在 x64 上通常 3-6 分钟；30 分钟足够，超时说明卡死。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "== CPU =="; nproc
          echo "== 编译器 =="; g++ --version | head -1
          echo "== CMake =="; cmake --version | head -1

      - name: 安装 FFmpeg 开发库
        # 关键：CI 需要的是 **开发库**（-dev），不是 ffmpeg CLI。
        # 只装 CLI 时 pkg-config 找不到 libavcodec，CMake 会降级到 Mock 读取器，
        # 45 个 FFmpeg 用例根本不编进去 —— 表现为「CI 全绿但用例数少了 45」。
        # 这是 ca. 2026-10 一次真实 CI 失败的原因，靠「用例数下限」检查抓到。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
          echo "== CLI =="; ffmpeg -version | head -1
          echo "== pkg-config =="; pkg-config --modversion libavcodec

      - name: 缓存 ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ort
          key: ort-linux-x64-1.22.0

      - name: 下载 ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          mkdir -p ort
          tar -xzf ort.tgz -C ort --strip-components=1
          test -f ort/include/onnxruntime_cxx_api.h && echo "ORT 头文件就绪"

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNAIROCLIP_ORT_ROOT="$GITHUB_WORKSPACE/ort"

      - name: 确认 FFmpeg 与 ORT 均已启用
        # 两者都会**静默降级**：FFmpeg 缺失 → Mock 读取器；ORT 缺失 → AI 降级。
        # 若 CI 上有一条降级，它覆盖的代码就与本地不同，绿也不代表同一件事。
        run: |
          fail=0
          if grep -q 'NAIROCLIP_HAS_FFMPEG=1' \
               build/core/CMakeFiles/nairoclip_core.dir/flags.make; then
            echo "FFmpeg 已启用"
          else
            echo "ERROR: FFmpeg 未启用，将使用 Mock 读取器"; fail=1
          fi
          if grep -q 'NAIROCLIP_HAS_ONNX_RUNTIME=1' \
               build/core/CMakeFiles/nairoclip_core.dir/flags.make; then
            echo "ONNX Runtime 已启用"
          else
            echo "ERROR: ONNX Runtime 未启用"; fail=1
          fi
          exit $fail

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: 确认测试素材
        # 素材由 nairoclip_tests 的 POST_BUILD 步骤生成（幂等）。
        # 缺失时 FFmpeg 用例会大批失败，看起来像代码坏了——提前检查。
        run: |
          ls /tmp/media_gen/ || true
          test -f /tmp/media_gen/test_av.mp4

      - name: 诊断：二分定位（原生 Release + glibc 堆调试）
        # 全量固定死在 Capi.WatermarkRealExportEndToEnd，但「只跑 Capi 靶」
        # 是绿的 —— 说明要么是前面用例污染，要么是该用例在**全量上下文**
        # 里才有差异（例如素材/文件状态、内存布局）。
        # 这一组对照实验把三种可能分开：
        #   A. 该用例单独跑 → 崩 = 自身问题
        #   B. 从中间开始跑（跳过前一半）→ 崩 = 污染源在后半段
        #   C. 只跑前半段 → 崩 = 污染源在前半段
        continue-on-error: true
        run: |
          export MALLOC_PERTURB_=165 MALLOC_CHECK_=3
          run() {
            label="$1"; shift
            echo "=== $label ==="
            env "$@" stdbuf -oL -eL ./build/tests/nairoclip_tests \
              > /tmp/diag.txt 2>&1
            rc=$?
            echo "exit=$rc"
            grep -E '^\[ RUN  \]' /tmp/diag.txt | tail -1
            tail -2 /tmp/diag.txt
            echo "::error title=DIAG_${label}::exit=$rc last=$(grep -E '^\[ RUN  \]' /tmp/diag.txt | tail -1)"
          }
          set +e
          echo "=== 先跑 Capi 靶 ==="
          stdbuf -oL -eL ./build/tests/nairoclip_capi_only_tests 2>&1 | tail -8 || true
          # ---- 二分设计 ----
          # 崩溃用例 Capi.WatermarkRealExportEndToEnd 在 test_capi.cpp 里，
          # 该文件从注册索引 203 开始；该用例在文件内约第 60 个
          # → 全量里约在索引 263。
          #
          # 注意：NC_TEST_SKIP=N 会跳过前 N 个用例，从第 N 个跑到末尾。
          # 所以 SKIP 必须落在 [0, 263) 区间才有意义 —— 用 1100 会直接
          # 跳过崩溃用例本身，跑出来的绿是假阴性（上一轮就是这么错的）。
          # 崩溃用例在索引 267 附近（test_capi.cpp 从 203 起，文件内约第 64 个）
          run "MAX_200" NC_TEST_MAX=200
          run "MAX_266" NC_TEST_MAX=266
          run "SKIP_50" NC_TEST_SKIP=50
          # 只跑崩溃用例本身（SKIP=267 MAX=268）。
          # 它能区分两种完全不同的原因：
          #   崩 → 该用例自成一体地触发问题（与前面用例无关）
          #   绿 → 必须叠加前面某个用例留下的状态（则继续二分 SKIP）
          run "ONLY_267" NC_TEST_SKIP=267 NC_TEST_MAX=268
          # 索引 203..266 的 Capi 段整体（不含崩溃用例）：确认这段是干净的
          run "CAPISEQ" NC_TEST_SKIP=203 NC_TEST_MAX=267
          # 只跑崩溃用例，再按阶段切开：
          #   ONLY_267_EXPORT → 只导出（不碰解码/检测）
          #   ONLY_267_DETECT → 导出 + 解码 + 检测
          # 两者一比就知道写坏堆的是「导出」还是「解码/检测」。
          # 注意 run() 用 env 传参，NC_WM_STAGE 需经 env 显式传入。
          run "ONLY_267_EXPORT" NC_TEST_SKIP=267 NC_TEST_MAX=268 NC_WM_STAGE=export
          run "ONLY_267_DETECT" NC_TEST_SKIP=267 NC_TEST_MAX=268 NC_WM_STAGE=detect
          # MAX=N 只跑前 N 个：若 MAX_266 通过而全量崩，说明崩溃需要
          # 「索引 266 之后的用例」参与，或需要更长的运行上下文。
          # SKIP=50 仍包含崩溃用例：崩 → 前 50 个里没有必要的触发条件。

      - name: 运行全量测试
        # 不加 set -o pipefail：测试失败时也要继续跑到「对账」步骤，
        # 把失败数打出来；否则只剩一个红叉，看不到原因。
        # 真正的判定在下一步。
        #
        # stdbuf -oL：行缓冲。CI 上曾出现 malloc 崩溃，但因 stdout 是管道
        # （全缓冲），崩溃时最后的 [ RUN ] 行还留在缓冲区里没输出，
        # 只能靠 x264 的日志反推位置。行缓冲能让崩溃点清晰可见。
        #
        # FFREPORT/AV_LOG：把 FFmpeg 自身日志降到 warning，
        # 否则 x264 的统计会淹没测试输出（CI 日志里 80% 是这类噪音）。
        run: |
          # Actions 的 run 默认是 bash -e：stdbuf 一返回 134 脚本就退出，
          # 下面所有诊断都不会执行（上一轮 annotation 只剩 "Process completed
          # with exit code 134"，就是这个原因）。必须先关掉 errexit。
          set +e
          # NC_TEST_CHECK_HEAP=1：每个用例后做一次堆一致性检查，把
          # "malloc(): invalid size" 这类延迟暴露的破坏钉到真凶用例上。
          # 详见 tests/test_framework.h 里 HeapProbe 的注释。
          # MALLOC_PERTURB_：free 时用该字节填充、malloc 时用其反码填充，
          #   让「读了已释放内存」立刻表现为异常值而不是侥幸的旧数据。
          # MALLOC_CHECK_=3：glibc 在每次 malloc/free 时复核 chunk header，
          #   发现不一致直接 abort 并打印，比等到下一次 malloc 才报更早。
          # 这三个环境变量都不改变分配器实现（仍是 glibc），
          # 所以能复现 ASAN/valgrind（自带的分配器）看不到的问题。
          MALLOC_PERTURB_=165 MALLOC_CHECK_=3 NC_TEST_CHECK_HEAP=1 \
            stdbuf -oL -eL ./build/tests/nairoclip_tests \
            > /tmp/test_output.txt 2>&1
          rc=$?
          echo "exit_code=$rc (137=SIGKILL 134=SIGABRT 139=SIGSEGV)"
          echo "output_bytes=$(stat -c%s /tmp/test_output.txt)"
          echo "---------------- 末尾 40 行 ----------------"
          tail -40 /tmp/test_output.txt
          echo "---------------- 崩溃点定位 ----------------"
          grep -E '^\[ RUN  \]' /tmp/test_output.txt | tail -3
          echo "---------------- 汇总行 ----------------"
          grep -E '^=====' /tmp/test_output.txt || echo "无汇总行"
          echo "---------------- 行数 / 前 30 行 ----------------"
          wc -l /tmp/test_output.txt
          head -30 /tmp/test_output.txt
          echo "---------------- abort/assert 关键字 ----------------"
          grep -n -E 'assert|Assertion|terminate|bad_alloc|invalid size|corrupt|malloc|free\(\)' \
            /tmp/test_output.txt | head -20 || echo "无"
          # 走 annotation 通道：public 仓库的日志/artifact 需要认证，
          # 但 check-run annotation 可匿名读取，是唯一能带出细节的出口。
          echo "::error title=TEST_EXIT::exit=$rc bytes=$(stat -c%s /tmp/test_output.txt)"
          LAST=$(grep -E '^\[ RUN  \]' /tmp/test_output.txt | tail -1)
          SUM=$(grep -E '^=====' /tmp/test_output.txt | tail -1)
          echo "::error title=LAST_RUN::${LAST:-none}"
          echo "::error title=SUMMARY::${SUM:-none}"
          TAIL=$(tail -12 /tmp/test_output.txt | tr '\n' '~' | cut -c1-1500)
          echo "::error title=TAIL::${TAIL:-none}"
          exit $rc

      - name: 对账用例总数
        # 踩过的坑：新测试文件没编进主套件，全量仍全绿。
        # 用例数只增不减，设下限可以抓住「漏编」。
        run: |
          SUMMARY=$(grep -E '^=====.*cases' /tmp/test_output.txt || true)
          if [ -z "$SUMMARY" ]; then
            echo "ERROR: 没有汇总行，测试可能崩溃"
            exit 1
          fi
          CASES=$(echo "$SUMMARY" | sed -E 's/^===== ([0-9]+) cases.*/\1/')
          FAILED=$(echo "$SUMMARY" | sed -E 's/.*\| ([0-9]+) failed.*/\1/')
          echo "用例数=$CASES 失败数=$FAILED"
          if [ "$CASES" -lt 1443 ]; then
            echo "ERROR: 用例数 $CASES 低于下限 1443，可能有测试文件未编入"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: $FAILED 个用例失败"
            exit 1
          fi
          echo "全部通过"

      - name: 上传测试输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test_output.txt
          retention-days: 7

  # ---------------------------------------------------------------
  # ASAN 诊断 job
  #
  # 为什么单独一个 job：本地开发容器（aarch64）里 ASAN 初始化失败
  # （sanitizer_allocator_primary64 地址空间冲突），拿不到栈。
  # x64 runner 上可用，是定位「malloc(): invalid size」这类堆破坏
  # 唯一可靠的手段 —— 只有它能指出「谁写坏了哪块内存」。
  #
  # 不设 required：它是诊断通道，失败不阻塞主流程。
  # ---------------------------------------------------------------
  asan-diagnose:
    name: ASAN 诊断
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 FFmpeg 开发库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev pkg-config

      - name: 缓存 ONNX Runtime
        # ⚠️ 关键：诊断 job 必须和主 job **覆盖同一份代码**。
        # 之前 ASAN / valgrind 都没装 ORT，AI 相关路径走的是降级 stub ——
        # 于是它们「1444 用例 0 报错」并不能说明主 job 也干净。
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ort
          key: ort-linux-x64-1.22.0

      - name: 下载 ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          mkdir -p ort
          tar -xzf ort.tgz -C ort --strip-components=1

      - name: Configure (ASAN)
        # 与主 job 同样的 Release + ORT，只额外挂 sanitizer：
        # 只有构建类型/依赖一致，"ASAN 没报" 才能推出 "主 job 也干净"。
        run: |
          cmake -S . -B build_asan \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAIROCLIP_ORT_ROOT="$GITHUB_WORKSPACE/ort" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"

      - name: Build (ASAN)
        run: cmake --build build_asan -j$(nproc)

      - name: 运行测试 (ASAN)
        run: |
          # 不用 stdbuf：它靠 LD_PRELOAD 注入 libstdbuf，会排在 ASAN runtime
          # 之前，ASAN 报 "runtime does not come first in initial library list"
          # 直接 abort —— 上一轮 exit=134 且 0 条 [ RUN ] 就是这个。
          # 改用 ASAN 自己的 symbolizer + 关闭 link-order 校验。
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ort/lib:$LD_LIBRARY_PATH"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:symbolize=1:print_stacktrace=1:verify_asan_link_order=0:log_path=/tmp/asan_log
          set +e
          # Release + ASAN 下全量约 10-15 分钟；给足时间。
          # 不用 NC_TEST_MAX 截断 —— 崩溃点之前可能有多个用例轮番污染，
          # 截断会漏掉真正写坏堆的那一个。
          script -q -e -c "./build_asan/tests/nairoclip_tests" /dev/null > /tmp/asan_output.txt 2>&1
          rc=$?
          echo "exit_code=$rc"
          echo "---------------- ASAN 报告 ----------------"
          grep -n -A40 -E 'ERROR: AddressSanitizer|SUMMARY: AddressSanitizer' /tmp/asan_output.txt | head -80
          echo "---------------- 崩溃点 ----------------"
          grep -E '^\[ RUN  \]' /tmp/asan_output.txt | tail -3
          echo "---------------- 行数 ----------------"
          wc -l /tmp/asan_output.txt
          echo "---------------- 前 40 行（含静态初始化阶段）----------------"
          head -40 /tmp/asan_output.txt
          echo "---------------- 后 40 行 ----------------"
          tail -40 /tmp/asan_output.txt
          echo "::error title=ASAN_EXIT::exit=$rc"
          LAST=$(grep -E '^\[ RUN  \]' /tmp/asan_output.txt | tail -1)
          echo "::error title=ASAN_LAST_RUN::${LAST:-none}"
          ERR=$(grep -m1 -E 'ERROR: AddressSanitizer' /tmp/asan_output.txt)
          echo "::error title=ASAN_ERROR::${ERR:-none}"
          # 一行数：用来判断是「main 之前就崩」还是「跑到某用例才崩」
          echo "::error title=ASAN_RUNCOUNT::$(grep -c -E '^\[ RUN  \]' /tmp/asan_output.txt) run / $(grep -c -E '^\[  OK  \]' /tmp/asan_output.txt) ok"
          ATAIL=$(tail -12 /tmp/asan_output.txt | tr '\n' '~' | cut -c1-1500)
          echo "::error title=ASAN_TAIL::${ATAIL:-none}"
          echo "---------------- asan_log 文件 ----------------"
          ls -la /tmp/asan_log* 2>/dev/null || echo "无 asan_log"
          cat /tmp/asan_log* 2>/dev/null | head -60
          if [ -f /tmp/asan_log.* ]; then
            echo "::error title=ASAN_LOGFILE::$(head -6 /tmp/asan_log.* | tr '\n' '~' | cut -c1-1200)"
          fi
          exit 0

  # ---------------------------------------------------------------
  # valgrind memcheck 诊断 job
  #
  # 为什么还要这个：ASAN 用自己的分配器，看不到 glibc chunk header 被
  # 写坏（实测 ASAN 全量 1444 用例 0 报错，原生构建仍崩）。堆探针也只能
  # 在用例外结束后检查，抓不到「在用例内部写坏仍存活的块」。
  # valgrind 逐条指令检查每一次写，能给出「Invalid write of size N」
  # 和确切栈帧 —— 这是唯一能指出真凶行的手段。
  # ---------------------------------------------------------------
  valgrind-memcheck:
    name: valgrind 诊断
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 FFmpeg 开发库 + valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev pkg-config valgrind

      - name: 缓存 ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ort
          key: ort-linux-x64-1.22.0

      - name: 下载 ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          mkdir -p ort
          tar -xzf ort.tgz -C ort --strip-components=1

      - name: Configure (Debug)
        # 与主 job 同一份代码（含 ORT），只是 -O0 便于 valgrind 给出准确行号
        run: |
          cmake -S . -B build_vg -DCMAKE_BUILD_TYPE=Release \
            -DNAIROCLIP_ORT_ROOT="$GITHUB_WORKSPACE/ort" \
            -DCMAKE_CXX_FLAGS="-g -O0" -DCMAKE_C_FLAGS="-g -O0"

      - name: Build
        run: cmake --build build_vg -j$(nproc)

      - name: valgrind 跑到 Capi.WatermarkRealExportEndToEnd
        run: |
          set +e
          # 限制阈值：只跑到崩溃点附近，valgrind 下全量太慢。
          # 索引由上一次 CI 的 LAST_RUN 给出（死在该用例）。
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ort/lib:$LD_LIBRARY_PATH"
          valgrind --tool=memcheck --error-exitcode=99 \
            --track-origins=yes --num-callers=25 \
            --log-file=/tmp/vg.txt \
            ./build_vg/tests/nairoclip_tests > /tmp/vg_stdout.txt 2>&1
          rc=$?
          echo "valgrind exit=$rc"
          echo "---------------- Invalid write/read 摘要 ----------------"
          grep -n -E 'Invalid (write|read) of size|Address 0x|at 0x' /tmp/vg.txt | head -40
          echo "---------------- 首个错误块 ----------------"
          awk '/Invalid (write|read)/{p=1} p{print; n++} n>45{exit}' /tmp/vg.txt
          FIRST=$(grep -m1 -A1 -E 'Invalid (write|read) of size' /tmp/vg.txt | tr '\n' '~' | cut -c1-300)
          echo "::error title=VG_RC::exit=$rc"
          echo "::error title=VG_FIRST::${FIRST:-none}"
          LAST=$(grep -E '^\[ RUN  \]' /tmp/vg_stdout.txt | tail -1)
          echo "::error title=VG_LAST_RUN::${LAST:-none}"
          # 堆对象被判越界的调用栈（前 3 个）
          STK=$(grep -A12 -m1 -E 'Invalid write of size' /tmp/vg.txt | tr '\n' '~' | cut -c1-1400)
          echo "::error title=VG_STACK::${STK:-none}"
          exit 0

  # ---------------------------------------------------------------
  # 未初始化变量 / UB 诊断
  #
  # 为什么：ONLY_267 崩，而 ONLY_267_EXPORT / ONLY_267_DETECT（执行路径
  # 与它完全相同，只是多了一次 getenv）都过。同样的代码、同样的输入，
  # 只因栈/堆布局微变就换结果 —— 典型的未定义行为（读未初始化内存、
  # 或依赖布局的越界）。ASAN/valgrind 都看不到，因为它们会重排布局。
  #
  # -ftrivial-auto-var-init=pattern 把未初始化的自动变量填成
  # 0xAA..AA（而不是碰巧为 0），读完立刻进入未定义路径，行为稳定可现。
  # -fsanitize=undefined 抓整数溢出/空指针/对齐等 UB。
  # ---------------------------------------------------------------
  ub-diagnose:
    name: UB 诊断
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 FFmpeg 开发库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev pkg-config

      - name: 缓存 ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ort
          key: ort-linux-x64-1.22.0

      - name: 下载 ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          mkdir -p ort
          tar -xzf ort.tgz -C ort --strip-components=1

      - name: Configure (Release + UBSan + auto-var-init)
        run: |
          cmake -S . -B build_ub \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAIROCLIP_ORT_ROOT="$GITHUB_WORKSPACE/ort" \
            -DCMAKE_CXX_FLAGS="-g -fsanitize=undefined -ftrivial-auto-var-init=pattern" \
            -DCMAKE_C_FLAGS="-g -fsanitize=undefined -ftrivial-auto-var-init=pattern" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build
        run: cmake --build build_ub -j$(nproc)

      - name: 只跑崩溃用例（UB 检测）
        run: |
          set +e
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ort/lib:$LD_LIBRARY_PATH"
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=0
          ./build_ub/tests/nairoclip_tests > /tmp/ub_out.txt 2>&1
          rc=$?
          echo "exit=$rc"
          echo "---------------- UBSan 报告（去重后的位置）----------------"
          # 按 "文件:行:列" 去重，只留首次出现处 + 计数，避免刷屏
          grep -oE '/[^ ]+\.(cpp|h):[0-9]+:[0-9]+: runtime error: .*' /tmp/ub_out.txt \
            | sort | uniq -c | sort -rn | head -30
          echo "---------------- 首个报告的前 45 行 ----------------"
          grep -n -B2 -A45 -m1 'runtime error' /tmp/ub_out.txt | head -50
          echo "---------------- 崩溃点 ----------------"
          grep -E '^\[ RUN  \]' /tmp/ub_out.txt | tail -2
          FIRST=$(grep -m1 'runtime error' /tmp/ub_out.txt | tr '~' ' ' | cut -c1-400)
          echo "::error title=UB_RC::exit=$rc"
          echo "::error title=UB_FIRST::${FIRST:-none}"
          echo "::error title=UB_LAST_RUN::$(grep -E '^\[ RUN  \]' /tmp/ub_out.txt | tail -1)"
          # 失败用例名单：auto-var-init=pattern 把未初始化内存填 0xAA 后
          # 露出来的用例，最可能就是依赖「默认恰为 0」的那批。
          # 框架输出的是 "    [FAIL] 文件:行  信息"，带上下文才知道属哪个用例
          grep -E '^\[ RUN  \]|\[FAIL\]' /tmp/ub_out.txt \
            | grep -B1 '\[FAIL\]' | grep -v '^--$' | tr '\n' '~' | cut -c1-1200 \
            > /tmp/ub_failed.txt
          echo "::error title=UB_FAILED::$(cat /tmp/ub_failed.txt | sed 's/^~//')"
          # check 失败的详细信息（ASSERT 行）
          DETAIL=$(grep -E 'CHECK|FAILED|assert' /tmp/ub_out.txt | grep -v '^\[ RUN' | tail -12 | tr '\n' '~' | cut -c1-1200)
          echo "::error title=UB_DETAIL::${DETAIL:-none}"
          SUM=$(grep -E '^=====' /tmp/ub_out.txt | tail -1)
          echo "::error title=UB_SUMMARY::${SUM:-none}"
          exit 0
