name: Fetch External Assets (relay)

# =============================================================================
# 外部资产中继（下载 → 发布为 Release 资产）
# =============================================================================
# 用途：把「开发沙箱直连不稳定」的大文件（如 Android NDK）经 GitHub
#       基础设施下载后，发布到本仓库 Release，供开发环境稳定拉取。
# 触发：手动（workflow_dispatch）；参数：url / name / tag。
# 说明：开发基础设施，不参与 CI 构建。

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Asset URL to fetch'
        required: true
        default: 'https://github.com/Lonemachinist/android-ndk/releases/download/r27d/android-ndk-r27d-linux.zip'
      name:
        description: 'Output file name'
        required: true
        default: 'android-ndk-r27d-linux.zip'
      tag:
        description: 'Release tag to publish under'
        required: true
        default: 'assets-relay'

permissions:
  contents: write

jobs:
  fetch:
    name: Download and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "URL   = ${{ github.event.inputs.url }}"
          echo "NAME  = ${{ github.event.inputs.name }}"
          echo "TAG   = ${{ github.event.inputs.tag }}"
          echo "Disk  :"; df -h / ; echo "CPU:"; nproc

      - name: Download asset (curl with retry)
        run: |
          set -uo pipefail
          URL="${{ github.event.inputs.url }}"
          NAME="${{ github.event.inputs.name }}"
          ok=0
          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"
            if curl -fL --retry 3 --retry-delay 3 --retry-all-errors \
                 --connect-timeout 30 --max-time 3000 \
                 -o "$NAME" "$URL"; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "download failed after retries"; exit 1; fi
          ls -lh "$NAME"
          sha256sum "$NAME" | tee SHA256SUMS.txt

      - name: Verify size (sanity)
        run: |
          set -euo pipefail
          NAME="${{ github.event.inputs.name }}"
          SIZE=$(stat -c %s "$NAME")
          echo "size bytes: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then echo "file too small — likely an error page"; exit 1; fi
          # ZIP 完整性（若为 zip）
          case "$NAME" in
            *.zip) unzip -t "$NAME" >/dev/null && echo "zip OK" || { echo "zip corrupt"; exit 1; } ;;
          esac

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ github.event.inputs.tag }}"
          NAME="${{ github.event.inputs.name }}"
          echo "Publishing $NAME to release $TAG ..."
          # 发布 Release（幂等：已存在则复用）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "External assets relay" \
              --notes "Assets relayed via GitHub infrastructure for development sandbox."
          else
            echo "release $TAG already exists"
          fi
          # 上传资产（--clobber 覆盖同名）
          if gh release upload "$TAG" "$NAME" SHA256SUMS.txt --clobber; then
            echo "upload OK"
          else
            echo "gh release upload failed (exit $?)"
            # 备选：用 API 直传（部分权限配置下 gh 的 release 端点被限制）
            echo "--- fallback: upload via API ---"
            ASSET_URL="https://uploads.github.com/repos/${{ github.repository }}/releases"
            # 取 release id
            REL_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
            if [ -n "$REL_ID" ]; then
              for f in "$NAME" SHA256SUMS.txt; do
                curl -s -X POST \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary "@$f" \
                  "$ASSET_URL/$REL_ID/assets?name=$f" \
                  -o /dev/null -w "  upload $f: %{http_code}\n"
              done
            else
              echo "无法获取 release id"
              exit 1
            fi
          fi
          echo "=== Published ==="
          gh release view "$TAG" || true
