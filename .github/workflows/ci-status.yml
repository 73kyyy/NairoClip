name: CI Status

# =============================================================================
# 把 Actions 的结论写回 `ci-status` 分支
# =============================================================================
# 为什么需要：
#   开发容器（aarch64 手机环境）按 docs/DEV_ENVIRONMENT.md 规定不跑脚本，
#   同时容器里没有 PAT / 没有 gh，REST API 一律 401 —— 本地读不到运行结果。
#
#   唯一稳定的读取通道：让 runner 自己把结论写进 git。
#   开发容器只要 `git fetch origin ci-status` 就能看到真实结论，
#   不用再靠猜、也不用让用户手动截图。
#
# 产物（只有两个文件，放在分支根目录）：
#   RUNS.md      人读：各工作流最近一次结论 + 失败工作/步骤 + 失败日志尾部
#   latest.json  机读：同上，结构化
#
# 注意：`ci-status` 是**产物分支**，不是源码分支。
#   每次运行都用单个提交覆盖它——不保留历史，避免仓库膨胀。
#   这是刻意的，也只对这一条分支 force push。
# =============================================================================

on:
  workflow_dispatch:
  workflow_run:
    # 覆盖所有会产生「值得看」的结论的工作流
    workflows: [ 'CI', 'Gen Assets', 'Android APK', 'Report' ]
    types: [ completed ]

permissions:
  contents: write   # 需要往 ci-status 分支写
  actions: read     # 需要读 runs / jobs / logs

# 同一时刻只允许一个；后到的覆盖先到的（结论总是越新越有用）
concurrency:
  group: ci-status
  cancel-in-progress: true

jobs:
  publish:
    name: 汇总并回写
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout（默认分支，只要脚本与 tools/）
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 时间戳
        run: echo "STATUS_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: 生成状态文件
        # 拿不到数据必须失败：一个「静默绿」的汇报通道比没有通道更糟。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/ci_status_publish.py --out docs/ci-status

      # 把 Android APK 运行的依赖诊断 artifact 取下来，一起提交到 ci-status。
      #
      # 动机：开发容器读不到 Actions 日志（无 PAT/gh），而失败日志在网页上
      # 也只保留尾部。artifact 是唯一能拿到**配置阶段完整输出**的通道。
      # 这里只在「最近一次 Android APK 运行」存在时尝试；失败不阻断整体汇报。
      - name: 取 Android 依赖诊断
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p docs/ci-status
          RUN_ID=$(gh api "/repos/$REPO/actions/workflows/android-apk.yml/runs?per_page=1" \
                     --jq '.workflow_runs[0].id' 2>/dev/null || true)
          if [ -z "${RUN_ID:-}" ]; then
            echo "（取不到 Android APK 的 run id，跳过）"
            exit 0
          fi
          echo "Android APK run id=$RUN_ID"
          # 顺带取 CI 的 LUT 专项证据（与 Android 诊断同一个思路）
          CI_RUN=$(gh api "/repos/$REPO/actions/workflows/ci.yml/runs?per_page=1" \
                     --jq '.workflow_runs[0].id' 2>/dev/null || true)
          if [ -n "${CI_RUN:-}" ]; then
            if gh run download "$CI_RUN" -n lut-test-evidence -D /tmp/lut 2>/dev/null; then
              cp /tmp/lut/summary.txt docs/ci-status/lut-summary.txt 2>/dev/null || true
              cp /tmp/lut/ok.txt docs/ci-status/lut-ok.txt 2>/dev/null || true
              echo "已取到 LUT 证据：$(cat docs/ci-status/lut-summary.txt 2>/dev/null | tr '\n' ' ')"
            else
              echo "（该 CI 运行没有 lut-test-evidence artifact）"
            fi

            # 主 job 的完整测试输出：崩溃现场的唯一一手证据。
            # 此前只上传到 artifact，ci-status 从不取 —— 于是只能看
            # RUNS.md 里被截断的日志尾巴，无法定位。
            if gh run download "$CI_RUN" -n test-output -D /tmp/tout 2>/dev/null; then
              SRC=/tmp/tout/test_output.txt
              OUT=docs/ci-status/test-output.txt
              # 原文可能几十万字节，直接提交会撑大产物分支。
              # 只保留可定位的部分：首 30 行、最后 3 个 RUN、末尾 120 行、
              # 以及 abort/assert/汇总 等关键行。
              {
                echo "===== 原文行数: $(wc -l < "$SRC") ====="
                echo
                echo "===== 首 30 行 ====="
                head -30 "$SRC"
                echo
                echo "===== 最后 3 个 RUN ====="
                grep -E '^\[ RUN  \]' "$SRC" | tail -3
                echo
                echo "===== 关键行（abort/assert/malloc/汇总/FAIL）====="
                grep -nE 'abort|Assertion|malloc\(\)|corrupted|^=====|\[FAIL\]' "$SRC" | tail -40
                echo
                echo "===== 末尾 120 行 ====="
                tail -120 "$SRC"
              } > "$OUT" 2>&1
              echo "已取到 test-output（原文 $(wc -l < "$SRC") 行，裁剪后 $(wc -l < "$OUT") 行）"
            else
              echo "（该 CI 运行没有 test-output artifact）"
            fi
          fi

          if gh run download "$RUN_ID" -n android-deps-diagnostic -D /tmp/deps 2>/dev/null; then
            cp /tmp/deps/deps.txt docs/ci-status/android-deps.txt 2>/dev/null || true
            cp /tmp/deps/depsdiag_builtin.txt docs/ci-status/android-builtin-deps.txt 2>/dev/null || true
            cp /tmp/deps/tasks.log docs/ci-status/android-tasks.log 2>/dev/null || true
            cp /tmp/deps/printdeps.log docs/ci-status/android-printdeps.log 2>/dev/null || true
            echo "已取到诊断 artifact："
            ls -l docs/ci-status/ || true
          else
            echo "（该运行没有 android-deps-diagnostic artifact）"
          fi

          # valgrind 证据：堆破坏唯一能给出"真凶行号"的来源。
          # 该 artifact 之前不存在（job 以 exit 0 结束且不上传），
          # 所以堆破坏一直无法定位。
          if [ -n "${CI_RUN:-}" ]; then
            if gh run download "$CI_RUN" -n valgrind-evidence -D /tmp/vg 2>/dev/null; then
              cp /tmp/vg/summary.txt docs/ci-status/valgrind-summary.txt 2>/dev/null || true
              # stdout 尾部：VG_RC=1 且 0 errors 时，判定"崩溃 vs 中断"
              # 只能靠它（有无汇总行、最后 RUN 行、是否被信号杀）。
              cp /tmp/vg/vg_stdout.txt docs/ci-status/valgrind-stdout.txt 2>/dev/null || true
              echo "已取到 valgrind 证据"
            else
              echo "（该 CI 运行没有 valgrind-evidence artifact）"
            fi
          fi

          # 自定义任务注册状态（syncMobileUi / printDeps）。
          # 根因修复后这两者应当出现；若仍缺失说明还有别的问题。
          if gh run download "$RUN_ID" -n android-task-check -D /tmp/tc 2>/dev/null; then
            cp /tmp/tc/tasks.log docs/ci-status/android-tasks.log 2>/dev/null || true
            echo "已取到 task check"
          else
            echo "（该运行没有 android-task-check artifact）"
          fi

      - name: 写到 Job Summary（网页上直接可读）
        if: always()
        run: |
          set -uo pipefail
          if [ -f docs/ci-status/RUNS.md ]; then
            cat docs/ci-status/RUNS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**状态文件未生成，请查看上一步日志。**' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交到 ci-status 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f docs/ci-status/RUNS.md ] || [ ! -f docs/ci-status/latest.json ]; then
            echo "❌ 缺少产物，拒绝提交空状态"
            exit 1
          fi

          tmp="$(mktemp -d)"
          cp docs/ci-status/RUNS.md docs/ci-status/latest.json "$tmp"/
          # 诊断文件可选（取到才带）
          for f in android-deps.txt android-builtin-deps.txt android-tasks.log android-printdeps.log valgrind-summary.txt valgrind-stdout.txt test-output.txt lut-summary.txt lut-ok.txt; do
            [ -f "docs/ci-status/$f" ] && cp "docs/ci-status/$f" "$tmp"/ || true
          done
          cd "$tmp"

          git init -q -b ci-status
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RUNS.md latest.json
          [ -f android-deps.txt ] && git add android-deps.txt || true
          [ -f lut-summary.txt ] && git add lut-summary.txt || true
          [ -f lut-ok.txt ] && git add lut-ok.txt || true
          [ -f android-printdeps.log ] && git add android-printdeps.log || true
          [ -f android-builtin-deps.txt ] && git add android-builtin-deps.txt || true
          [ -f android-tasks.log ] && git add android-tasks.log || true
          [ -f valgrind-summary.txt ] && git add valgrind-summary.txt || true
          [ -f valgrind-stdout.txt ] && git add valgrind-stdout.txt || true
          [ -f test-output.txt ] && git add test-output.txt || true
          git commit -q -m "chore(ci-status): ${STATUS_TS}"

          # ci-status 是产物分支：单提交覆盖，不留历史
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            HEAD:ci-status
          echo "✅ 已回写 ci-status：$(git rev-parse --short HEAD)"
