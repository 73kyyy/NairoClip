name: Android APK

# 出可安装 APK：
#   1) NDK 交叉编译 core -> 3 个 ABI 的 libnairoclip_core.a
#   2) libnc_jni.so 链接该静态库（JNI 直调 C ABI，不走 HTTP）
#   3) Gradle 打包 APK 并发布到 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'android/**'
      - 'mobile/native/android/**'
      - 'mobile/static/**'
      - 'ffmpeg-build/**'   # 构建脚本/版本变了必须重跑，否则改了也不生效
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 自带 Android SDK，且已预装 build-tools / platform。
      # 不用 setup-android@v3：其 sdkmanager 装 'tools' 包会失败。
      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" 2>/dev/null | head -10 || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" 2>/dev/null || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" 2>/dev/null || true

      - name: Setup Android NDK r27d
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        # 说明：这里**不加** with: 参数。
        #
        # 曾怀疑 build cache 导致
        #   AAPT: resource style/Theme.AppCompat.NoActionBar not found
        # 但 setup-gradle 的缓存只影响 Gradle User Home（依赖 + wrapper），
        # 项目自己的 build/ 目录在工作区里，每次 checkout 都是干净的，
        # 不会跨运行复用。所以「陈旧资源产物」这个假设不成立 ——
        # 真正的修复在下面 assemble 步骤（--rerun-tasks）与
        # android/gradle.properties（org.gradle.caching=false）。

      # 出包前剔除仅用于开发的测试与素材（只影响本次 CI 工作区，仓库内容不变）。
      # 目的：① 产物不携带任何测试资产；② 缩小打包上下文与构建时间。
      # 注意：这些目录在仓库中保留，供后续开发/回归使用；
      #       任何 CI 之外的本地构建都不执行本步骤。
      - name: Prune dev-only test assets (workflow workspace only)
        run: |
          set -euo pipefail
          echo "剔除前："
          du -sh tests design/tools mobile/tools 2>/dev/null || true
          rm -rf tests
          rm -rf design/tools
          rm -rf mobile/tools
          rm -rf build_test build_noffmpeg build_pic build_release
          echo "剔除后（应全部不存在）："
          for d in tests design/tools mobile/tools; do
            if [ -e "$d" ]; then echo "❌ 仍存在: $d"; exit 1; else echo "✅ 已剔除: $d"; fi
          done

      # ---------------------------------------------------------------------
      # 构建 FFmpeg 共享库（LGPL 动态链接）
      # ---------------------------------------------------------------------
      # 这是「打开被关掉的那个」：此前 core 构建传了
      #   -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
      # 导致 NAIROCLIP_HAS_FFMPEG 永远未定义，APK 里编进去的是
      # MockMediaReader —— 装到手机上能打开、但导入真实视频直接失败。
      #
      # 现在按 ABI 编出 libav*.so，拷进 jniLibs，由 Gradle 打进 APK。
      # 缓存：FFmpeg 源码下载 + 编译约 15-25 分钟，按 VERSION 文件做 key。
      - name: Cache FFmpeg sources
        uses: actions/cache@v4
        with:
          path: ffmpeg-build/src
          key: ffmpeg-src-${{ hashFiles('ffmpeg-build/VERSION') }}

      - name: Build FFmpeg shared libs (LGPL, 3 ABIs)
        run: |
          set -euo pipefail
          export ANDROID_NDK="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_API=24
          chmod +x ffmpeg-build/build-android.sh
          ./ffmpeg-build/build-android.sh
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            DEST="android/app/src/main/jniLibs/$ABI"
            mkdir -p "$DEST"
            cp ffmpeg-build/out/$ABI/lib/libav*.so "$DEST/"
            ls -lh "$DEST"
          done

      - name: Verify FFmpeg is dynamically linked (LGPL requirement)
        run: |
          set -euo pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            LIB="android/app/src/main/jniLibs/$ABI/libavcodec.so"
            [ -f "$LIB" ] || { echo "❌ 缺少 $LIB"; exit 1; }
            "$READELF" -h "$LIB" | grep -q 'DYN (Shared object file)' \
              || { echo "❌ $LIB 不是共享库"; exit 1; }
            echo "✅ $ABI libavcodec.so 是共享库"
          done

      - name: Build core for each ABI
        run: |
          set -euo pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a)   API=24 ;;
              armeabi-v7a) API=21 ;;
              x86_64)      API=21 ;;
            esac
            cmake -S . -B "build-core-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="android-${API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DNAIROCLIP_BUILD_TESTS=OFF \
              -DNAIROCLIP_ORT_ROOT=OFF \
              -DNAIROCLIP_FFMPEG_ROOT="$(pwd)/ffmpeg-build/out/$ABI"
            cmake --build "build-core-$ABI" --parallel 4 --target nairoclip_core
            DEST="android/app/src/main/cpp/prebuilt/$ABI"
            mkdir -p "$DEST"
            find "build-core-$ABI" -name 'libnairoclip_core.a' -exec cp {} "$DEST/" \;
            ls -lh "$DEST/"
          done

      - name: Assert FFmpeg actually compiled in
        run: |
          set -euo pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          LIB="android/app/src/main/cpp/prebuilt/arm64-v8a/libnairoclip_core.a"
          # 有符号 = FFmpeg 路径真的编进去了；没有 = 还在用 Mock
          if "$NM" "$LIB" 2>/dev/null | grep -q 'avcodec_send_packet'; then
            echo "✅ libnairoclip_core.a 含 FFmpeg 符号"
          else
            echo "❌ 未找到 FFmpeg 符号 —— NAIROCLIP_HAS_FFMPEG 未生效"
            exit 1
          fi

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "wx.appId=${{ secrets.WX_APP_ID }}"
            echo "qq.appId=${{ secrets.QQ_APP_ID }}"
            echo "auth.backend=${{ secrets.AUTH_BACKEND }}"
          } > android/local.properties

      # 生成签名 keystore（发布用；密码可由 secrets 覆盖）
      - name: Generate signing keystore
        working-directory: android/app
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore nairoclip-release.jks \
            -alias "${KEYSTORE_ALIAS:-nairoclip}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${KEYSTORE_PASSWORD:-nairoclip}" \
            -keypass "${KEY_PASSWORD:-nairoclip}" \
            -dname "CN=NairoClip, OU=Dev, O=NairoClip, L=NA, S=NA, C=CN"
          ls -lh nairoclip-release.jks
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 仓库未提交 gradle wrapper：用 gradle/actions 提供的 gradle 生成后构建
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      # 校验 build.gradle.kts 的 Kotlin 词法完整性。
      #
      # 真实根因（2026-10-30 定位）：
      #   Kotlin 块注释**可以嵌套**。注释正文里出现 "/*" 会再开一层，
      #   于是从那条注释起一直吞到文件末尾也闭不上。
      #   mobile/pages/*.html 这类路径写法正好踩中：
      #     第 87 行 "/* 把 mobile/ ..." 开注释
      #     第 91 行 "pages/*.html"          → 嵌套 +1
      #     第 96 行 "mobile/pages/*.html"   → 嵌套 +1
      #   结果第 99 行 syncMobileUi、142 行 dependencies{}、
      #   159 行 printDeps **全部被当注释**，从不执行。
      #   于是 appcompat 没进 classpath → AAPT 找不到 Theme.AppCompat。
      #
      # 这不是"结构被改坏"，也不是缓存/依赖问题：是注释吞代码。
      # 本步骤用词法扫描复现判断，防止再次引入。
      - name: Verify build script lexical integrity
        run: |
          set +e
          python3 tools/check_kotlin_block_comments.py android/app/build.gradle.kts
          rc=$?
          echo "lexical check exit=$rc"
          exit $rc

      # 列出本步骤之前/之后的自定义任务是否存在（轻量确认，不重复 printDeps）
      - name: Confirm custom tasks are registered
        working-directory: android
        run: |
          set +e
          mkdir -p /tmp/taskcheck
          ./gradlew :app:tasks --all --no-daemon > /tmp/taskcheck/tasks.log 2>&1
          echo "tasks exit=$?"
          for t in syncMobileUi printDeps; do
            if grep -qE "^$t\b" /tmp/taskcheck/tasks.log; then
              echo "  OK  $t 已注册"
            else
              echo "  MISSING  $t 未注册"
            fi
          done
          exit 0

      - name: Upload task check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-task-check
          path: /tmp/taskcheck/
          retention-days: 7
          if-no-files-found: warn

      # 显式打印依赖解析结果。做成独立步骤的原因：
      # 之前把诊断放在 assemble 内部用 logger 输出，结果被日志尾部截断，
      # 连着两轮都看不到任何内容，等于没做诊断。
      - name: Print resolved release dependencies
        working-directory: android
        run: |
          # GitHub Actions 的 bash 默认带 -e。`set -u` 只加选项、**不会关掉它** —— 
          # 之前这里写 `set -uo pipefail` 并注释「不设 set -e」，
          # 但 -e 从头就开着：gradlew 一失败，脚本当场退出，
          # rc=$? 之后的日志回显、artifact 产出、exit 0 全部执行不到。
          # 表现是这一步 59 秒后 exit 1、日志里只有脚本回显（无任何输出），
          # 而 assembleRelease 根本没机会跑 —— 真实错误被永久遮住。
          # 必须显式 +e。
          set +e
          set -uo pipefail
          chmod +x gradlew

          # 任务注册状态由上一步 Confirm custom tasks 负责，这里不再重复。

          # 主力证据：Gradle 内置的 dependencies 任务。
          # 它不依赖我写的任何注册代码，一定存在；
          # 能直接回答"appcompat 是否在 releaseRuntimeClasspath 里"。
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
            --no-daemon > /tmp/builtin_deps.log 2>&1
          echo "builtin dependencies exit=$?"
          {
            echo "===== appcompat 相关 ====="
            grep -nE 'appcompat|core-ktx|webkit' /tmp/builtin_deps.log || echo "（未出现 appcompat/core-ktx/webkit）"
            echo
            echo "===== 顶层依赖（前 60 行）====="
            sed -n '1,60p' /tmp/builtin_deps.log
            echo
            echo "===== 末尾 30 行 ====="
            tail -30 /tmp/builtin_deps.log
          } > /tmp/depsdiag_builtin.txt 2>&1
          cat /tmp/depsdiag_builtin.txt

          ./gradlew :app:printDeps --no-daemon > /tmp/printdeps.log 2>&1
          rc=$?
          echo "printDeps exit=$rc"
          echo "===== DEPS 行 ====="
          grep 'DEPS|' /tmp/printdeps.log || echo "（无 DEPS 输出）"
          echo "===== 末尾 40 行（含可能的报错）====="
          tail -40 /tmp/printdeps.log
          {
            echo "## release 依赖解析（exit=$rc）"
            echo ""
            echo '### DEPS 行'
            echo '```'
            grep 'DEPS|' /tmp/printdeps.log || echo "（无 DEPS 输出）"
            echo '```'
            echo ""
            echo '### 末尾 40 行'
            echo '```'
            tail -40 /tmp/printdeps.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 保底：把关键结论放进 artifact。
          # 日志会被截断、Job Summary 需要登录查看，
          # 而 artifact 只要 run 完成就能下载 —— 这是最可靠的一手证据。
          mkdir -p /tmp/depsdiag
          cp /tmp/printdeps.log /tmp/depsdiag/ 2>/dev/null || true
          grep 'DEPS|' /tmp/printdeps.log > /tmp/depsdiag/deps.txt 2>/dev/null || true
          # Gradle 内置 dependencies 的输出：不受自定义任务注册影响，是最硬证据
          cp /tmp/depsdiag_builtin.txt /tmp/depsdiag/ 2>/dev/null || true

          # 本步骤只负责产出信息，**不阻断**后续构建：
          # 之前它自己失败，导致 assemble 根本没机会跑，
          # 于是连 AAPT 的真实错误都拿不到。
          exit 0

      - name: Upload dependency diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-deps-diagnostic
          path: /tmp/depsdiag/
          retention-days: 3
          if-no-files-found: warn

      - name: Assemble release APK
        working-directory: android
        run: |
          # 同上游 printDeps：Actions 的 bash 自带 -e，
          # 只用 `set -uo pipefail` 关不掉。必须显式 +e，
          # 否则 assembleRelease 失败时 rc=${PIPESTATUS[0]} 之后
          # 的日志收集与 exit $rc 都不会执行（曾经就是这样，
          # 导致只能看到「Process completed with exit code 1」，
          # 拿不到任何 AAPT/Gradle 原文）。
          set +e
          set -uo pipefail
          chmod +x gradlew
          # --no-build-cache：不读 build cache。
          # --rerun-tasks：强制所有 task 真正执行，不复用 up-to-date 判定。
          # 两者一起，确保 resource merge / link 一定重新跑一遍 ——
          # 这是排除「复用了不含 appcompat 资源的旧产物」的唯一确定方式。
          #
          # 2>&1 | tee：把配置阶段的 [deps] 诊断留在文件里。
          # 失败时 GitHub 只保留失败步骤的日志尾部，配置阶段的输出容易丢。
          # --console=plain：关掉富终端控制符，错误行才能被 grep 抓到。
          # 之前日志只有 3.9KB —— worker 进程的输出没进 tee，
          # 加上 --console=plain 与显式重定向后才有完整原文。
          # -Dkotlin.compiler.execution.strategy=in-process：
          # 让 Kotlin 编译器在 Gradle 进程内执行，而不是派发到 worker。
          # worker 模式下编译错误不落到 /tmp/gradle.log（实测日志仅 3.2KB，
          # 只有栈帧没有 `e:` 原文），连续几轮无法定位真实原因。
          ./gradlew :app:assembleRelease --stacktrace --no-daemon \
            --console=plain --no-build-cache --rerun-tasks \
            -Dkotlin.compiler.execution.strategy=in-process \
            2>&1 | tee /tmp/gradle.log
          GRADLE_RC=${PIPESTATUS[0]}
          # 失败时把真正的错误行回显到 **job 日志**（不是 step summary）。
          # ci-status 抓的是 job 日志，step summary 抓不到 ——
          # 前几轮加了 summary 但 RUNS.md 里始终没有，就是这个原因。
          if [ "$GRADLE_RC" -ne 0 ]; then
            echo "=========== GRADLE 错误行（job 日志可见）==========="
            grep -nE '(^e: |error:|错误:|error;|Unresolved reference|Execution failed for task|What went wrong|Caused by:)' \
              /tmp/gradle.log | head -60 || true
            echo "=========== 首个 e: 前后 20 行 ==========="
            FIRST=$(grep -nE '^e: ' /tmp/gradle.log | head -1 | cut -d: -f1)
            if [ -n "${FIRST:-}" ]; then
              ST=$(( FIRST > 20 ? FIRST - 20 : 1 ))
              sed -n "${ST},$(( FIRST + 20 ))p" /tmp/gradle.log
            else
              echo "（无 e: 行；末尾 150 行）"
              tail -150 /tmp/gradle.log
            fi
            echo "==============================================="
          fi
          rc=$GRADLE_RC
          {
            echo "## Gradle 依赖诊断"
            echo ""
            echo '```'
            grep -E '^\[deps\]' /tmp/gradle.log | head -60 || echo "（无 [deps] 输出）"
            echo '```'
            echo ""
            echo "## 编译错误（若无则该段为空）"
            echo ""
            echo '```'
            # 只抓真正的错误行，避免被几千行栈帧淹没。
            # 之前这里只输出 [deps]，失败时看不到任何 AAPT/Kotlin/clang 原文，
            # 连着几轮只能看到「Process completed with exit code 1」。
            grep -nE '(^e: |error:|错误:|error;|Unresolved reference|What went wrong|Caused by:|FAILURE:)' \
              /tmp/gradle.log | head -120 || echo "（未匹配到错误行）"
            echo '```'
            echo ""
            echo "## 上下文（首个 error 前后各 15 行）"
            echo ""
            echo '```'
            first=$(grep -nE '(^e: |error:|错误:)' /tmp/gradle.log | head -1 | cut -d: -f1)
            if [ -n "${first:-}" ]; then
              start=$(( first > 15 ? first - 15 : 1 ))
              sed -n "${start},$(( first + 15 ))p" /tmp/gradle.log
            else
              echo "（未找到 error 行；输出日志尾部 120 行）"
              tail -120 /tmp/gradle.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # 上传完整 gradle 日志（artifact 不需要 admin 权限）。
      # 网页日志只保留失败步骤尾部，`e:` / `error:` 原文常被截断，
      # 上一轮 APK 失败就是因为拿不到原文而无法定位。
      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7
          if-no-files-found: warn

      - name: Show APK
        run: find android -name '*.apk' -exec ls -lh {} \;

      # 产物自检：确认 APK 内不含测试/开发资产
      - name: Verify APK has no test assets
        run: |
          set -euo pipefail
          APK=$(find android -name '*.apk' | head -1)
          echo "检查: $APK"
          LIST=$(unzip -l "$APK")
          if echo "$LIST" | grep -qiE 'test|fixture|media_gen|tools/w'; then
            echo "❌ APK 含测试资产："
            echo "$LIST" | grep -iE 'test|fixture|media_gen|tools/w' | head -20
            exit 1
          fi
          echo "✅ APK 不含测试资产"

      # 产物自检：确认打进去的是**页面版**（live engine），不是静态快照版
      #
      #   APK 里必须：
      #     assets/pages/*.html        页面版（走 engine.js → NCEngine）
      #     assets/assets/engine.js    实时引擎适配层
      #     assets/assets/engine_static.js  离线兜底（保留但会因为检测到
      #                                     NCEngine 而不接管）
      #   APK 里必须没有：
      #     assets/static/nairoclip-*.html  6 个单文件静态版
      #       （内联构建时快照，装进去 UI 就是只读的）
      - name: Verify APK uses live-engine UI
        run: |
          set -euo pipefail
          APK=$(find android -name '*.apk' | head -1)
          echo "检查: $APK"
          unzip -l "$APK" | awk '{print $4}' > /tmp/apk_files.txt

          echo "--- 1) 必须存在的页面版 ---"
          miss=0
          for f in \
            "assets/pages/01-home.html" \
            "assets/pages/10-editor.html" \
            "assets/pages/05-legal.html" \
            "assets/assets/engine.js" \
            "assets/assets/editor.js" \
            "assets/assets/l3-panel.js"
          do
            if grep -qxF "$f" /tmp/apk_files.txt; then
              echo "  ✅ $f"
            else
              echo "  ❌ 缺失 $f"
              miss=1
            fi
          done
          if [ "$miss" -ne 0 ]; then
            echo "❌ APK 缺少页面版资源，UI 无法连实时引擎"
            exit 1
          fi

          echo "--- 2) 不得存在的静态快照版 ---"
          if grep -E '^assets/static/nairoclip-.*\.html$' /tmp/apk_files.txt; then
            echo "❌ APK 打进了单文件静态版（只读快照），会覆盖实时引擎 UI"
            echo "   修：build.gradle.kts 的 syncMobileUi 里 exclude(\"**/nairoclip-*.html\")"
            exit 1
          fi
          echo "  ✅ 未打入任何 nairoclip-*.html 静态版"

          echo "--- 3) 入口指向页面版 ---"
          if grep -q 'assets/pages/01-home.html' \
               android/app/src/main/java/com/nairoclip/app/MainActivity.kt; then
            echo "  ✅ MainActivity 加载 assets/pages/01-home.html"
          else
            echo "❌ MainActivity 入口不是页面版"
            grep -n 'loadUrl' android/app/src/main/java/com/nairoclip/app/MainActivity.kt
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nairoclip-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="apk-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "NairoClip APK" --notes "Latest installable APK from main."
          fi
          for f in android/app/build/outputs/apk/release/*.apk; do
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG"
