org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 关闭 Gradle build cache。
#
# 起因：assembleRelease 报
#   AAPT: error: resource style/Theme.AppCompat.NoActionBar not found
# 而 appcompat 确实写在 dependencies 里。
#
# 关掉 build cache 是为了排除「复用了不含 appcompat 资源的旧产物」这条路径，
# 让每次构建都真正重跑资源合并 —— 这是唯一能确定「问题到底在依赖解析
# 还是在缓存」的办法。确认修复后可再打开。
org.gradle.caching=false
