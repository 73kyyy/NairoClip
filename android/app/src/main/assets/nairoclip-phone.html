<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NairoClip</title>
<style>
/* NairoClip Mobile · 设计令牌
   底色/尺寸取自参考稿（1332×2738 = 444×913 CSS @3x）；
   图标与强调色按《产品UI和UX开发文档》Part 1 §1.2/§1.3：
   默认 #9B9B9E、激活 #2D8CFF、描边 1.5px、一级 20px / 二三级 18px。 */
/* 字体与剪辑页、设计稿同一套（design/assets/base.css 同样声明）：
   拉丁/数字用 Instrument Sans + JetBrains Mono，中文回落到系统 Noto Sans CJK。 */
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Bold.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Bold.ttf") format("truetype"); }

:root {
  --bg-void: #000000;
  --bg-dock: #111413;
  --bg-timeline: #151817;
  --bg-app: #18191B;
  --bg-toolbar: #1C1D1F;
  --bg-stage: #232323;

  --panel-2: #202224;   /* 二级工具栏（文档 #2A2A2D 系列） */
  --panel-3: #26282A;   /* 三级面板 */

  --line-1: #26282A;
  --line-2: #34373A;
  --line-3: #3A3A3D;

  --text-hi: #F2F2F2;
  --text-mid: #9B9B9E;
  --text-low: #6A6E70;

  --accent: #2D8CFF;
  --accent-soft: rgba(45, 140, 255, .22);    /* 文档全局唯一强调色 */
  --danger: #E5484D;    /* 文档警示色 */

  --font: "Instrument Sans", "Noto Sans CJK SC", -apple-system, "PingFang SC", sans-serif;
  --font-num: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* NairoClip Mobile · 首页 / 我的（设置）共用样式
   配色沿用 tokens.css：深色、无彩色强调、图标线性 1.5px。
   布局单位用 clamp/vw，与剪辑页保持一致的自适应策略。 */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg-app); font-family: var(--font); color: var(--text-hi);
       display: flex; justify-content: center; overflow: hidden; }

.screen { position: relative; width: 100%; height: 100vh; height: 100dvh;
          display: flex; flex-direction: column; overflow: hidden;
          padding-bottom: env(safe-area-inset-bottom, 0px); }
.i { width: 20px; height: 20px; display: block; }

/* ---------- 顶栏 ---------- */
.hd { flex: none; height: clamp(44px, 5.4vh, 56px); display: flex;
      align-items: center; padding: 0 14px; gap: 8px; }
.hd h1 { margin: 0; font-size: clamp(17px, 4.6vw, 20px); font-weight: 700; letter-spacing: -.3px; }
.hd .sp { flex: 1; }
.hd-btn { width: 34px; height: 34px; border: 0; background: transparent;
          color: #C8CDCB; display: grid; place-items: center; padding: 0; }
.hd-btn .i { width: 20px; height: 20px; }

/* ---------- 滚动区 ---------- */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
          -webkit-overflow-scrolling: touch; padding: 0 14px 12px; }
.scroll::-webkit-scrollbar { width: 0; }

/* ---------- 开始创作卡 ---------- */
.create { width: 100%; border: 1px dashed #3A3E40; border-radius: 12px;
          background: linear-gradient(180deg, #202325, #1B1E20);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 8px; padding: clamp(20px, 4.6vh, 34px) 12px; color: #EDF0EE; }
.create .plus { width: 38px; height: 38px; border-radius: 50%;
                border: 1px solid #4A4F52; display: grid; place-items: center; }
.create .plus .i { width: 20px; height: 20px; }
.create b { font-size: 15px; font-weight: 600; }
.create span { font-size: 11px; color: var(--text-low); }

/* ---------- 四宫格快捷入口 ---------- */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.q { border: 0; background: transparent; display: flex; flex-direction: column;
     align-items: center; gap: 7px; padding: 10px 4px; color: #D4D9D7; }
.q .box { width: 42px; height: 42px; border-radius: 11px; background: #24282A;
          display: grid; place-items: center; }
.q .box .i { width: 21px; height: 21px; }
.q span { font-size: 11px; }

/* ---------- 区块标题 ---------- */
.sec { display: flex; align-items: center; margin: 18px 2px 9px; }
.sec h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: #E8EBE9; }
.sec .count { color: var(--text-low); font-weight: 500; }
.sec .sp { flex: 1; }
.sec button { border: 0; background: transparent; color: var(--text-mid);
              font-family: var(--font); font-size: 12px; padding: 4px 2px; }

/* ---------- 草稿网格 ---------- */
.drafts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { position: relative; border: 0; background: transparent; padding: 0;
        display: flex; flex-direction: column; gap: 6px; text-align: left; }
.card .thumb { position: relative; width: 100%; aspect-ratio: 9 / 14; border-radius: 9px;
               overflow: hidden; background: linear-gradient(160deg, #2A2F32, #1C2022); }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .dur { position: absolute; right: 5px; bottom: 5px; padding: 2px 5px; border-radius: 3px;
             background: rgba(0,0,0,.66); font: 600 9.5px/1.4 var(--font-num); color: #F0F2F0; }
.card .title { font-size: 12px; color: #E6E9E7; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
.card .meta { font-size: 10px; color: #6E7472; }
.card .check { position: absolute; left: 6px; top: 6px; width: 18px; height: 18px;
               border-radius: 50%; border: 1.5px solid #FFFFFF; background: rgba(0,0,0,.4);
               display: none; place-items: center; }
.managing .card .check { display: grid; }
.card.picked .check { background: #FFFFFF; }
.card.picked .check::after { content: ""; width: 8px; height: 4px; border-left: 1.6px solid #111;
                             border-bottom: 1.6px solid #111; transform: rotate(-45deg) translateY(-1px); }

/* ---------- 空态 ---------- */
.empty { display: flex; flex-direction: column; align-items: center; gap: 9px;
         padding: 40px 10px; color: #5A605E; }
.empty .i { width: 30px; height: 30px; opacity: .6; }
.empty p { margin: 0; font-size: 12px; }
.empty small { font-size: 10.5px; color: #4B504E; }

/* ---------- 底部 Tab ---------- */
.tabs { flex: none; height: clamp(50px, 6.4vh, 62px); display: grid;
        grid-template-columns: repeat(4, 1fr); background: #101312;
        border-top: 1px solid #1E2221; }
.tab { border: 0; background: transparent; display: flex; flex-direction: column;
       align-items: center; justify-content: center; gap: 4px;
       color: #686E6C; font-family: var(--font); font-size: 10px; padding: 0; }
.tab .i { width: 21px; height: 21px; }
.tab.on { color: #FFFFFF; }

/* ---------- 我的：用户卡 ---------- */
.user { display: flex; align-items: center; gap: 12px; padding: 14px 2px 6px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; flex: none;
          background: linear-gradient(150deg, #3A4043, #23282A);
          display: grid; place-items: center; color: #C9CFCC; font-size: 19px; font-weight: 700;
          border: 1px solid #3A3F42; }
.user .info { min-width: 0; }
.user .name { font-size: 15px; font-weight: 600; }
.user .id { font-size: 10.5px; color: #6E7472; margin-top: 4px; font-family: var(--font-num); }
.bind { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px;
        font-size: 10.5px; color: #C9CDCB; border: 1px solid #3A3F42;
        border-radius: 10px; padding: 3px 8px; background: transparent; }

/* ---------- 会员卡（银描边，无金色，按文档） ---------- */
.vip { width: 100%; margin-top: 12px; border-radius: 11px; padding: 13px 14px;
       background: #1E2224; border: 1px solid #4A4F52;
       display: flex; align-items: center; gap: 10px; }
.vip .vip-ico { flex: none; width: 19px; height: 19px; color: #C9CFCC; }
.vip .txt { text-align: left; flex: 1 1 auto; min-width: 0; }
.vip b { display: block; font-size: 13.5px; color: #F2F4F2; }
.vip small { display: block; margin-top: 4px; font-size: 10.5px; color: #8B918F; }
.vip .go { margin-left: auto; font-size: 11.5px; color: #E8EBE9; white-space: nowrap; }

/* ---------- 列表分组 ---------- */
.group { margin-top: 14px; background: #1A1D1F; border: 1px solid #262A2C;
         border-radius: 11px; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 10px;
       padding: 14px 13px; border: 0; background: transparent; color: #E7EAE8;
       font-family: var(--font); font-size: 13px; text-align: left; }
.row + .row { border-top: 1px solid #232728; }
.row .i { width: 18px; height: 18px; color: #9BA19E; flex: none; }
.row .val { margin-left: auto; font-size: 11.5px; color: #7C8280; font-family: var(--font-num); }
.row .chev { width: 14px; height: 14px; color: #565C5A; margin-left: 4px; }
.row.danger { color: var(--danger); }

/* 手风琴 */
.acc-body { display: none; padding: 0 13px 13px; }
.group.open .acc-body { display: block; }
.group.open .row .chev { transform: rotate(90deg); }
.acc-body .line { display: flex; align-items: center; font-size: 11.5px; color: #8B918F;
                  padding: 6px 0; }
.acc-body .line .val { margin-left: auto; font-family: var(--font-num); }

/* <button class="line"> 需要显式抹掉浏览器原生按钮外观，
   否则在展开区会渲染成白底黑框（Safari/WebKit 默认） */
button.line {
  width: 100%;
  border: 0;
  background: transparent;
  font-family: var(--font);
  font-size: 11.5px;
  color: #8B918F;
  text-align: left;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
button.line:active { color: #C4CAC8; }
button.line + button.line { border-top: 1px solid #22262a; }

/* 下拉选择（设置页通用/外观） */
.sel {
  margin-left: auto;
  max-width: 58%;
  height: 26px;
  padding: 0 22px 0 8px;
  border: 1px solid #2C3133;
  border-radius: 7px;
  background-color: #1A1B1E;
  /* 自绘箭头：避免各平台原生 select 外观差异 */
  background-image: linear-gradient(45deg, transparent 50%, #8B918F 50%),
                    linear-gradient(135deg, #8B918F 50%, transparent 50%);
  background-position: right 12px center, right 8px center;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  -webkit-appearance: none;
  appearance: none;
  color: #C9CFCC;
  font-family: var(--font);
  font-size: 11.5px;
  text-align: right;
  cursor: pointer;
}
.sel:focus { outline: 1px solid #3D4A46; border-color: #3D4A46; }

/* 危险操作行（退出登录 / 清除数据） */
button.line.danger,
button.line.danger .val { color: #E5484D; }
button.line.danger:active { color: #FF6B6F; }

/* 说明性小字行（不是可点项） */
.acc-body .line.note-line {
  display: block;
  color: #5F6563;
  font-size: 10.5px;
  line-height: 1.65;
  padding-top: 2px;
}

/* 开关 */
.sw {
  margin-left: auto;
  flex: none;
  width: 38px; height: 22px;
  padding: 0;
  border: 0; border-radius: 11px;
  background: #2C3133;
  position: relative;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background .16s ease;
}
.sw::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #8B918F;
  transition: transform .16s ease, background .16s ease;
}
.sw[aria-pressed="true"] { background: #3A4144; }
.sw[aria-pressed="true"]::after { transform: translateX(16px); background: #E6EAE8; }
.bar { height: 4px; border-radius: 2px; background: #2C3133; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: #C9CFCC; }

/* ---------- 退出登录 ---------- */
.logout { width: 100%; margin: 18px 0 6px; padding: 13px; border-radius: 11px;
          border: 1px solid #3A2626; background: transparent; color: var(--danger);
          font-family: var(--font); font-size: 13px; }
.copy { text-align: center; color: #4E5452; font-size: 10px; padding: 10px 0 18px; }

/* ---------- 小屏兜底 ---------- */
@media (max-width: 360px) {
  .scroll { padding: 0 10px 10px; }
  .drafts { gap: 8px; }
  .card .title { font-size: 11px; }
  .row { padding: 12px 11px; font-size: 12.5px; }
  .q .box { width: 38px; height: 38px; }
}

/* hidden 必须彻底隐藏，避免空态与网格同时出现 */
.drafts[hidden], .empty[hidden] { display: none !important; }

/* NairoClip Mobile · 登录页组
   ---------------------------------------------------------------------------
   布局参照 CapCut 登录页：顶栏（返回 / 说明）→ 居中 Logo → 全宽药丸按钮列表
   → 协议说明。点按钮跳转到各自的登录页（手机号 / 微信 / QQ / Apple）。
   配色沿用应用暗色语言（底 #0B0B0C，实心白为唯一强调），不跟参考走浅色。
   ------------------------------------------------------------------------- */

/* ---------- 顶栏 ---------- */
.auth-hd {
  flex: none;
  height: clamp(46px, 5.6vh, 58px);
  padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.auth-back {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; background: transparent;
  color: #D6DADC;
  padding: 0;
  cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.auth-back .i { width: 21px; height: 21px; }
.auth-back:active { color: #FFFFFF; }

.auth-help {
  padding: 6px 8px;
  border: 0; background: transparent;
  color: #8D9296;
  font-family: var(--font);
  font-size: 13.5px;
  cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.auth-help:active { color: #D6DADC; }

.auth-title {
  flex: 1 1 auto;
  text-align: center;
  padding-right: 36px;   /* 与左侧返回键等宽，标题真正居中 */
  font-size: 15px;
  font-weight: 600;
  color: #EDEFF1;
}

/* ---------- 品牌区 ---------- */
.auth-brand {
  padding: clamp(30px, 9vh, 78px) 0 clamp(26px, 7vh, 62px);
  text-align: center;
}
.auth-logo {
  width: 84px; height: 84px;
  margin: 0 auto 12px;
  display: grid; place-items: center;
}
/* 字标本身透明、无底板，直接浮在页面底色上 */
.auth-logo img { width: 100%; height: 100%; display: block; object-fit: contain; }

.auth-name {
  margin: 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -.6px;
  color: #F4F5F6;
}

/* ---------- 方式列表（药丸按钮） ---------- */
.auth-list {
  padding: 0 22px;
  display: flex; flex-direction: column; gap: 11px;
}

.auth-btn {
  position: relative;
  width: 100%;
  height: 50px;
  padding: 0 18px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #3A3A40;
  border-radius: 999px;
  background: transparent;
  color: #E9EBEC;
  font-family: var(--font);
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  -webkit-appearance: none; appearance: none;
  transition: background .15s ease, border-color .15s ease;
}
.auth-btn:active { background: #17181A; border-color: #4A4A52; }

/* 图标绝对定位在最左，文字始终居中——与参考稿一致 */
.auth-btn .ab-ico {
  position: absolute;
  left: 18px; top: 50%;
  transform: translateY(-50%);
  width: 22px; height: 22px;
  display: grid; place-items: center;
  color: #DDE0E2;
}
.auth-btn .ab-ico svg { width: 100%; height: 100%; display: block; }

/* 品牌色（填充型图标吃 currentColor） */
.ab-ico.brand-wechat { color: #07C160; }
.ab-ico.brand-qq { color: #12B7F5; }
.ab-ico.brand-apple { color: #F2F2F3; }

.auth-btn .ab-txt { line-height: 1; }

/* 主按钮：实心白（对应参考里的黑色主按钮，暗色主题反相处理） */
.auth-btn.primary {
  background: #F2F2F3;
  border-color: #F2F2F3;
  color: #0E0E10;
  font-weight: 600;
}
.auth-btn.primary:active { background: #DCDEE0; }
.auth-btn.primary .ab-ico { color: #101012; }

/* ---------- 协议 ---------- */
.auth-agree {
  margin: 20px 30px 0;
  font-size: 11.5px;
  line-height: 1.75;
  text-align: center;
  color: #86898D;
}
.auth-agree a {
  color: #4FC3D9;             /* 参考稿用青色链接，这里保留但压低饱和 */
  text-decoration: none;
}
.auth-agree a:active { color: #7FD9EA; }

/* 未勾选协议就点授权时，就地高亮提示（避免把人送去授权后才被拒） */
.auth-agree.flash {
  animation: agreeFlash .9s ease;
  border-radius: 8px;
}
@keyframes agreeFlash {
  0%, 100% { color: #86898D; background: transparent; }
  30%      { color: #FFD08A; background: rgba(255, 176, 32, .12); }
}

/* ---------- 次入口 ---------- */
.auth-later {
  display: block;
  width: calc(100% - 44px);
  margin: clamp(18px, 5vh, 40px) 22px 0;
  height: 42px;
  border: 0; background: transparent;
  color: #7C8185;
  font-family: var(--font);
  font-size: 12.5px;
  cursor: pointer;
}
.auth-later:active { color: #C6CACC; }

/* ===========================================================================
   子页面（手机号 / 微信 / QQ / Apple）
   =========================================================================== */

.form-lead {
  margin: 14px 22px 20px;
  font-size: 12px;
  line-height: 1.6;
  color: #7C8185;
}

.form-body { padding: 0 22px clamp(24px, 5vh, 40px); }

.lab { display: block; margin: 0 0 7px; font-size: 11.5px; color: #8A8F93; }

.field {
  display: flex; align-items: center; gap: 8px;
  height: 47px;
  padding: 0 13px;
  margin-bottom: 3px;
  background: #161618;
  border: 1px solid #2A2A2D;
  border-radius: 11px;
  transition: border-color .16s ease;
}
.field:focus-within { border-color: #414148; }
.field.bad { border-color: #E5484D; }

.field .prefix {
  flex: none; font-size: 14px; color: #A8ADB1;
  padding-right: 9px; border-right: 1px solid #2A2A2D;
}
.field input {
  flex: 1 1 auto; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  color: #F2F2F3; font-size: 15px; font-family: var(--font);
  letter-spacing: .3px;
}
.field input::placeholder { color: #5D6266; }

.field .clear {
  flex: none; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: #2A2A2D; color: #9AA0A4;
  cursor: pointer;
}
.field .clear[hidden] { display: none; }
.field .clear .i { width: 12px; height: 12px; }

.field .send {
  flex: none; height: 30px; padding: 0 11px;
  border: 0; border-radius: 7px;
  background: #F2F2F3; color: #101012;
  font-size: 12px; font-weight: 600; font-family: var(--font);
  cursor: pointer; white-space: nowrap;
}
.field .send:disabled { background: #26262A; color: #5D6266; cursor: default; }

.err { margin: 5px 0 10px; font-size: 11px; color: #E5484D; }
.err[hidden] { display: none; }

.primary {
  width: 100%; height: 47px;
  margin-top: 14px;
  border: 0; border-radius: 11px;
  background: #F2F2F3; color: #0E0E10;
  font-size: 15px; font-weight: 600; font-family: var(--font);
  cursor: pointer;
}
.primary:disabled { background: #26262A; color: #5D6266; cursor: default; }

.agree {
  display: flex; align-items: flex-start; gap: 8px;
  margin: 15px 1px 0;
  font-size: 11px; line-height: 1.6; color: #7C8185;
  cursor: pointer;
}
.agree input {
  flex: none; width: 15px; height: 15px; margin: 1px 0 0;
  accent-color: #F2F2F3; cursor: pointer;
}
.agree a { color: #6FCBDB; text-decoration: none; }

/* 第三方子页的图标主视觉 */
.third-hero {
  text-align: center;
  padding: clamp(34px, 10vh, 86px) 0 clamp(22px, 6vh, 50px);
}
.third-ico {
  width: 62px; height: 62px;
  margin: 0 auto 16px;
  display: grid; place-items: center;
  border: 1px solid #2E2E33;
  border-radius: 17px;
  background: #161618;
}
.third-ico svg { width: 30px; height: 30px; display: block; }
.third-ico.brand-wechat { color: #07C160; }
.third-ico.brand-qq { color: #12B7F5; }
.third-ico.brand-apple { color: #F2F2F3; }

.third-hero h2 {
  margin: 0 0 6px;
  font-size: 18px; font-weight: 600; color: #F2F3F4;
}
.third-sub { margin: 0; font-size: 11.5px; color: #7C8185; }

.pane-note {
  margin: 0 0 14px;
  font-size: 11px;
  line-height: 1.7;
  color: #7C8185;
}

  .auth-list { padding: 0 16px; }
  .auth-btn { height: 46px; font-size: 13.5px; }
  .auth-btn .ab-ico { left: 15px; width: 20px; height: 20px; }
  .auth-name { font-size: 24px; }
  .auth-logo { width: 54px; height: 54px; }
  .form-body { padding: 0 16px 24px; }
}

<body data-page="phone">

<div class="screen" id="screen">

  <header class="auth-hd">
    <button class="auth-back" id="btn-back" aria-label="返回">
      <svg class="i"><use href="#i-chevron"/></svg>
    </button>
    <span class="auth-title">手机号登录</span>
  </header>

  <div class="scroll" id="scroll">
    <p class="form-lead">未注册的手机号验证后将自动创建账号</p>

    <div class="form-body">
      <label class="lab" for="phone">手机号</label>
      <div class="field" id="field-phone">
        <span class="prefix">+86</span>
        <input id="phone" type="tel" inputmode="numeric" maxlength="11"
               placeholder="请输入手机号" autocomplete="tel">
        <button class="clear" id="btn-clear" hidden aria-label="清空">
          <svg class="i"><use href="#i-close"/></svg>
        </button>
      </div>
      <p class="err" id="err-phone" hidden></p>

      <label class="lab" for="code">验证码</label>
      <div class="field" id="field-code">
        <input id="code" type="text" inputmode="numeric" maxlength="6"
               placeholder="6 位验证码" autocomplete="one-time-code">
        <button class="send" id="btn-send" disabled>获取验证码</button>
      </div>
      <p class="err" id="err-code" hidden></p>

      <button class="primary" id="btn-submit" disabled>登录</button>

      <label class="agree">
        <input type="checkbox" id="agree">
        <span>我已阅读并同意<a data-doc="terms">《用户协议》</a>及<a data-doc="privacy">《隐私政策》</a></span>
      </label>
    </div>
  </div>
</div>

  /* 填充型图标集合：只吃 fill，不吃描边，否则空心轮廓会失真 */
  const BRAND_SET = new Set(['i-brand-wechat', 'i-brand-qq', 'i-brand-apple']);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  svg.innerHTML = '<defs>' + Object.entries(P).map(([id, d]) =>
    (BRAND_SET.has(id)
      ? `<symbol id="${id}" viewBox="0 0 24 24" fill="currentColor" stroke="none">${d}</symbol>`
      : `<symbol id="${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +

<script>
/* NairoClip Mobile · 登录页组
   ---------------------------------------------------------------------------
   页面结构：
     03-auth.html     方式列表（手机号 / 微信 / QQ / Apple）→ 点哪个跳哪个
     03a-phone.html   手机号 + 短信验证码
     03b/03c/03d      微信 / QQ / Apple 授权页
   平台：Apple 仅 iOS。列表页在非 iOS 上移除该按钮；03d 页在非 iOS 上直接拒绝。
   登录仍非使用前提：「稍后再说」随时可跳过。
   ------------------------------------------------------------------------- */
'use strict';

const $ = (id) => document.getElementById(id);
const qp = new URLSearchParams(location.search);

const LS_USER = 'nairoclip.user';
const LS_AGREED = 'nairoclip.agreedDocs';

/* 沙箱无短信网关：本地体验模式显式标注，不伪装真实发送 */
const SMS_MODE = 'local';

/* 当前页身份：由 body 上的 data-page 决定（auth / phone / wechat / qq / apple） */
const PAGE = document.body.dataset.page || 'auth';

/* ---------- 平台探测 ----------
   原生层注入 window.NC_PLATFORM（'ios'/'android'/…）为权威；
   纯浏览器评审宿主回落 UA + 多点触控（iPadOS 13+ 伪装成 macOS）。 */
function detectPlatform() {
  const injected = (window.NC_PLATFORM || '').toString().toLowerCase();
  if (injected) return injected;

  const ua = (navigator.userAgent || '').toLowerCase();
  const touch = navigator.maxTouchPoints || 0;
  if (/iphone|ipod/.test(ua)) return 'ios';
  if (/ipad/.test(ua) || (/macintosh/.test(ua) && touch > 1)) return 'ios';
  if (/android/.test(ua)) return 'android';
  if (/macintosh|mac os x/.test(ua)) return 'macos';
  if (/windows/.test(ua)) return 'windows';
  return 'web';
}

const PLATFORM = detectPlatform();
const IS_IOS = PLATFORM === 'ios';

/* ---------- 工具 ---------- */
function toast(msg) {
  let el = $('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText =
      'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);' +
      'padding:9px 15px;border-radius:9px;background:rgba(28,28,31,.96);' +
      'border:1px solid #33333A;color:#EDEFF1;font-size:12.5px;z-index:999;' +
      'max-width:78vw;text-align:center;line-height:1.5;pointer-events:none;' +
      'transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2300);
}

const withApi = (name) => `${name}${qp.get('api') ? '?api=' + encodeURIComponent(qp.get('api')) : ''}`;

const goHome = () => { location.href = withApi('01-home.html'); };
const goList = () => { location.href = withApi('03-auth.html'); };

/* ---------- 登录态收尾 ---------- */
function persistLogin(nickname, extra) {
  const user = Object.assign({
    loggedIn: true,
    nickname,
    uid: 'NC' + Date.now().toString(36).toUpperCase().slice(-8),
    tier: 0,
    since: new Date().toISOString().slice(0, 10)
  }, extra || {});
  try {
    localStorage.setItem(LS_USER, JSON.stringify(user));
    localStorage.setItem(LS_AGREED, '1');
  } catch (e) {
    toast('本地存储不可用，登录态无法保存');
  }
  return user;
}

/* 协议是否已同意。
   列表页（PAGE==='auth'）的协议是纯说明文字、没有勾选框（与参考稿一致），
   点「使用微信登录」这类按钮本身即视为已确认——因此列表页恒为 true。
   手机号页有显式勾选框，必须真的勾上。 */
function agreed() {
  if (PAGE === 'auth') return true;
  const a = $('agree');
  return !!(a && a.checked);
}


/* ===========================================================================
   原生授权桥
   ---------------------------------------------------------------------------
   第三方登录**不经过中间的「授权确认页」**：点按钮即调起对应 App，
   授权在对方 App 内完成，回到本应用时由原生层回调结果。

   约定（平台层需实现其一）：
     · Android：window.NCAndroid.authorize(provider)   // @JavascriptInterface
     · iOS    ：window.webkit.messageHandlers.ncAuth.postMessage({provider})
   两者都不存在时（Web 评审宿主），如实提示「无原生层」，不伪造授权流程。
   =========================================================================== */
const PROVIDER_NAME = { wechat: '微信', qq: 'QQ', apple: 'Apple' };

function hasNativeAuth() {
  if (window.NCAndroid && typeof window.NCAndroid.authorize === 'function') return 'android';
  const wk = window.webkit;
  if (wk && wk.messageHandlers && wk.messageHandlers.ncAuth) return 'ios';
  return null;
}

/* 调起第三方授权。返回 true 表示已交给原生层（结果走回调）。 */
function launchAuthorize(provider) {
  const bridge = hasNativeAuth();
  if (!bridge) {
    toast(`${PROVIDER_NAME[provider] || '第三方'}授权需要 App 内的原生登录 SDK，当前为 Web 评审宿主`);
    return false;
  }
  try {
    if (bridge === 'android') {
      window.NCAndroid.authorize(provider);
    } else {
      window.webkit.messageHandlers.ncAuth.postMessage({ provider });
    }
    return true;
  } catch (e) {
    toast('调起授权失败：' + (e && e.message ? e.message : '未知错误'));
    return false;
  }
}

/* 原生层授权完成后调用它落登录态。
   用法（平台层）：
     Android: webView.evaluateJavascript("NC_AUTH_DONE('wechat', {...})", null)
     iOS    : evaluateJavaScript("NC_AUTH_DONE('wechat', {...})")
   失败时传 ok=false，只显示原因，不写登录态。 */
window.NC_AUTH_DONE = function (provider, payload) {
  const p = payload || {};
  if (p.ok === false || p.error) {
    toast((PROVIDER_NAME[provider] || '授权') + '失败：' + (p.error || '用户取消或授权被拒'));
    return;
  }
  const name = p.nickname || p.name ||
               ({ wechat: '微信用户', qq: 'QQ 用户', apple: 'Apple 用户' }[provider] || '用户');
  persistLogin(name, { method: provider, uid: p.uid, avatar: p.avatar });
  toast('已登录');
  setTimeout(goHome, 420);
};

/* ---------- 列表页 ---------- */
if (PAGE === 'auth') {
  if (!IS_IOS) {
    const apple = $('btn-apple');
    if (apple) apple.remove();      // 移除而非隐藏：DOM 里不存在就无法被重新显示
  }

  document.querySelectorAll('.auth-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.m;
      if (m === 'apple' && !IS_IOS) {
        toast('Apple 登录仅在 iOS 设备可用');
        return;
      }

      // 手机号没有第三方 App 可拉，走应用内表单页
      if (m === 'phone') {
        location.href = withApi('03a-phone.html');
        return;
      }

      // 微信 / QQ / Apple：直接调起对应 App 授权，不插中间页
      if (agreed()) {
        // 调起外部 App 后本页会切到后台；给出「正在唤醒」反馈，
        // 万一切后台失败（如未安装该 App），用户也能看出是点了没反应。
        const label = btn.querySelector('.ab-txt');
        const original = label ? label.textContent : '';
        if (label) label.textContent = `正在唤醒${PROVIDER_NAME[m]}…`;
        btn.disabled = true;
        const launched = launchAuthorize(m);
        setTimeout(() => {
          if (label) label.textContent = original;
          btn.disabled = false;
        }, launched ? 2600 : 600);
        return;
      }
    });
  });

  if ($('btn-back')) $('btn-back').addEventListener('click', goHome);
  if ($('btn-help')) $('btn-help').addEventListener('click', () => toast('登录说明：待接入正式文案'));
  if ($('btn-later')) {
    $('btn-later').addEventListener('click', () => {
      try { localStorage.setItem(LS_USER, JSON.stringify({ loggedIn: false })); } catch (e) {}
      goHome();
    });
  }
}

/* ---------- 子页通用：返回 ---------- */
if ($('btn-back') && PAGE !== 'auth') {
  $('btn-back').addEventListener('click', goList);
}

/* ---------- 手机号页 ---------- */
if (PAGE === 'phone') {
  const S = { phone: '', code: '', sending: false, countdown: 0, timer: null, demoCode: '' };

  const isPhone = (v) => /^1[3-9]\d{9}$/.test(v);
  const isCode = (v) => /^\d{6}$/.test(v);

  function setErr(which, msg) {
    const el = $('err-' + which);
    const fld = $('field-' + which);
    if (!el || !fld) return;
    if (msg) { el.textContent = msg; el.hidden = false; fld.classList.add('bad'); }
    else { el.hidden = true; fld.classList.remove('bad'); }
  }

  function refreshSubmit() {
    const btn = $('btn-submit');
    if (btn) btn.disabled = !(isPhone(S.phone) && isCode(S.code) && agreed());
  }

  function refreshSend() {
    const btn = $('btn-send');
    if (!btn) return;
    if (S.countdown > 0) { btn.disabled = true; btn.textContent = `${S.countdown}s`; return; }
    btn.disabled = !isPhone(S.phone) || S.sending;
    btn.textContent = S.sending ? '发送中…' : '获取验证码';
  }

  $('phone').addEventListener('input', (e) => {
    const raw = e.target.value.replace(/\D/g, '').slice(0, 11);
    e.target.value = raw;
    S.phone = raw;
    $('btn-clear').hidden = raw.length === 0;
    setErr('phone', raw.length === 11 && !isPhone(raw) ? '请填写有效的 11 位手机号' : '');
    refreshSend();
    refreshSubmit();
  });

  $('btn-clear').addEventListener('click', () => {
    $('phone').value = '';
    S.phone = '';
    $('btn-clear').hidden = true;
    setErr('phone', '');
    refreshSend();
    refreshSubmit();
    $('phone').focus();
  });

  $('code').addEventListener('input', (e) => {
    const raw = e.target.value.replace(/\D/g, '').slice(0, 6);
    e.target.value = raw;
    S.code = raw;
    setErr('code', raw && !isCode(raw) ? '验证码为 6 位数字' : '');
    refreshSubmit();
  });

  $('agree').addEventListener('change', refreshSubmit);

  $('btn-send').addEventListener('click', () => {
    if (!isPhone(S.phone) || S.countdown > 0 || S.sending) return;
    S.sending = true;
    refreshSend();
    setTimeout(() => {
      S.sending = false;
      if (SMS_MODE === 'local') {
        S.demoCode = String(Math.floor(100000 + Math.random() * 900000));
        toast(`本地体验模式：验证码 ${S.demoCode}（未真实发送短信）`);
        $('code').focus();
      }
      S.countdown = 60;
      refreshSend();
      S.timer = setInterval(() => {
        S.countdown -= 1;
        if (S.countdown <= 0) { clearInterval(S.timer); S.timer = null; }
        refreshSend();
      }, 1000);
    }, 420);
  });

  $('btn-submit').addEventListener('click', () => {
    if (!isPhone(S.phone)) { setErr('phone', '请填写有效手机号'); return; }
    if (!isCode(S.code)) { setErr('code', '请填写 6 位验证码'); return; }
    if (!agreed()) { toast('请先阅读并同意用户协议与隐私政策'); return; }
    if (SMS_MODE === 'local' && S.demoCode && S.code !== S.demoCode) {
      setErr('code', '验证码不正确（见上方提示）');
      return;
    }
    const masked = S.phone.slice(0, 3) + '****' + S.phone.slice(7);
    persistLogin(`创作者 ${S.phone.slice(-4)}`, { phone: masked, method: 'phone' });
    toast('已登录');
    setTimeout(goHome, 460);
  });

  refreshSend();
  refreshSubmit();
}

/* ---------- 协议文档 ---------- */
document.querySelectorAll('[data-doc]').forEach((a) => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    toast(a.dataset.doc === 'terms' ? '用户协议：待接入正式文本' : '隐私政策：待接入正式文本');
  });
});

/* ---------- 已有登录态：列表页直接回首页 ---------- */
if (PAGE === 'auth') {
  try {
    const raw = localStorage.getItem(LS_USER);
    if (raw) {
      const u = JSON.parse(raw);
      if (u && u.loggedIn) setTimeout(goHome, 320);
    }
  } catch (e) { /* 忽略损坏数据 */ }
}

</script>
</body>
</html>
