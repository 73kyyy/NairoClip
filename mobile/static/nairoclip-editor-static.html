<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NairoClip · 剪辑页（静态版）</title>
<style>
/* NairoClip Mobile · 设计令牌
   底色/尺寸取自参考稿（1332×2738 = 444×913 CSS @3x）；
   图标与强调色按《产品UI和UX开发文档》Part 1 §1.2/§1.3：
   默认 #9B9B9E、激活 #2D8CFF、描边 1.5px、一级 20px / 二三级 18px。 */
/* 字体与剪辑页、设计稿同一套（design/assets/base.css 同样声明）：
   拉丁/数字用 Instrument Sans + JetBrains Mono，中文回落到系统 Noto Sans CJK。 */
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Bold.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Bold.ttf") format("truetype"); }

:root {
  --bg-void: #000000;
  --bg-dock: #111413;
  --bg-timeline: #151817;
  --bg-app: #18191B;
  --bg-toolbar: #1C1D1F;
  --bg-stage: #232323;

  --panel-2: #202224;   /* 二级工具栏（文档 #2A2A2D 系列） */
  --panel-3: #26282A;   /* 三级面板 */

  --line-1: #26282A;
  --line-2: #34373A;
  --line-3: #3A3A3D;

  --text-hi: #F2F2F2;
  --text-mid: #9B9B9E;
  --text-low: #6A6E70;

  --accent: #2D8CFF;
  --accent-soft: rgba(45, 140, 255, .22);    /* 文档全局唯一强调色 */
  --danger: #E5484D;    /* 文档警示色 */

  --font: "Instrument Sans", "Noto Sans CJK SC", -apple-system, "PingFang SC", sans-serif;
  --font-num: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* NairoClip Mobile · 剪辑页
   参考稿几何（截图为 444×913 @3x）：顶栏 35 · 预览 282×501 · 圆工具 32
   刻度 21.4px/s · 轨道 48 · 工具栏 90
   工具栏规则：一级与二级共用同一行，点一级后在该行横向展开二级（首项为返回） */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
body { background: #0B0B0C; font-family: var(--font); color: var(--text-hi);
       display: flex; justify-content: center; align-items: stretch;
       overflow: hidden; overscroll-behavior: none; }
body { -webkit-text-size-adjust: 100%; }
.i { width: 20px; height: 20px; display: block; }

.app { position: relative; width: 100%; max-width: 100%; height: 100vh; height: 100dvh;
       background: var(--bg-stage); display: flex; flex-direction: column;
       overflow: hidden; flex: 1 1 auto; --phx: 50%;
       /* iOS/Android 安全区：底部 Home 条不遮挡工具栏 */
       padding-bottom: env(safe-area-inset-bottom, 0px);
       --u: clamp(2.6px, 0.62vh, 3.1px);
       --bar-h: clamp(84px, 10.6vh, 100px);
       --tl-h: clamp(210px, 29.5vh, 320px);
       --tp-h: clamp(42px, 5.2vh, 52px);
       --top-h: clamp(32px, 3.9vh, 44px);
       --row-h: clamp(42px, 5.6vh, 58px); }

/* ① 顶栏 35 */
.topbar { height: var(--top-h); flex: none; display: flex; align-items: center;
          padding: 0 11px 0 15px; background: var(--bg-app); }
.brand {
  font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #F2F2F2;
  /* 由 span 改为 button 后必须抹掉原生按钮外观，否则是白底黑字方块 */
  border: 0; background: transparent; padding: 0;
  font-family: var(--font);
  cursor: pointer;
  -webkit-appearance: none; appearance: none;
  max-width: 46vw;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: left;
}
.brand:active { color: #FFFFFF; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.tb { width: 30px; height: 30px; border: 0; background: transparent; color: #E8EBE9;
      display: grid; place-items: center; padding: 0; }
.tb .i { width: 19px; height: 19px; }
.export { height: 27px; padding: 0 14px; border-radius: 14px;
          background: transparent; border: 1px solid #FFFFFF; color: #FFFFFF;
          font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: .2px; }

/* ② 预览台：按可用高度等比，永远 9:16 满幅 */
.stage { position: relative; flex: 1 1 auto; min-height: 0; max-height: 40vh;
         background: var(--bg-stage);
         display: flex; align-items: center; justify-content: center; overflow: hidden; }
.canvas { position: relative; height: 100%; width: auto;
          max-width: 100%; max-height: 100%;
          aspect-ratio: var(--ratio-w, 9) / var(--ratio-h, 16);
          background: #000; overflow: hidden; flex: none; }
/* 约束冲突时（宽度先到上限）让高度自动回落，保持比例不变形 */
@supports (contain: size) {
  .canvas { contain: layout paint; }
}
.canvas-still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                background: #000; display: block; visibility: hidden; }
.canvas-empty { position: absolute; inset: 0; display: grid; place-items: center;
                color: #4A4F4E; font-size: 12px; }
.canvas-empty[hidden] { display: none; }

/* ③ 圆工具行 38 + 进度带 4 */
.toolbar { flex: none; background: var(--bg-stage); }
.circles { height: clamp(34px, 4.4vh, 44px); display: flex; align-items: center;
           gap: clamp(6px, 1.8vw, 10px); padding: 0 5px;
           overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.circles::-webkit-scrollbar { display: none; }
.c-sep { width: 1px; height: 16px; background: var(--line-1); margin: 0 2px; flex: none; }
.cbtn { flex: none; width: clamp(28px, 7.4vw, 36px); height: clamp(28px, 7.4vw, 36px);
        border-radius: 50%;
        border: 1px solid var(--line-1); background: var(--bg-toolbar); color: var(--text-mid);
        display: grid; place-items: center; padding: 0; }
.cbtn .i { width: 16px; height: 16px; }
.cbtn.on { color: var(--text-hi); border-color: #4A4E51; }
.cbtn[disabled] { opacity: .35; }
.c-ai { font-size: 10px; font-weight: 700; letter-spacing: .3px; color: #EDF1F4; }
.strip { height: 4px; background: #1A1C1C; }
.strip-done { height: 100%; width: 0; background: #FFFFFF; transition: width .08s linear; }

/* ④ 时间轴区：刻度尺 + 轨道，播放头贯穿 */
.timeline { flex: 1 1 auto; height: var(--tl-h); min-height: var(--tl-h);
            background: var(--bg-dock); position: relative; overflow: hidden; }
.timeline::after { content: ""; position: absolute; left: var(--phx);
                   top: 0; bottom: 0; width: 2px; background: #FFFFFF;
                   transform: translateX(-50%); z-index: 39; pointer-events: none; }
.ruler { position: relative; height: 26px; overflow: hidden; }
.ruler-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ruler-label { position: absolute; top: 5px; font: 500 10.5px/1 var(--font-num);
               color: var(--text-mid); transform: translateX(-50%); white-space: nowrap; }

/* 播放头：白色 2px，贯穿刻度尺与所有轨道，固定在屏幕中心 */
.playhead { position: absolute; top: 0; bottom: -8px; left: var(--phx); width: 2px;
            background: #FFFFFF; transform: translateX(-50%); z-index: 40; pointer-events: none; }
.ph-read { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
           font: 600 9px/1 var(--font-num); color: #14171A; background: #FFFFFF;
           padding: 2px 4px; border-radius: 2px; white-space: nowrap; }
.playhead-line { position: absolute; top: 26px; bottom: 0; left: var(--phx); width: 2px;
                 background: #FFFFFF; transform: translateX(-50%); z-index: 40; pointer-events: none; }

.tracks { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.empty-hint { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; }
.eh-text { font-size: 10.5px; color: #565B5A; letter-spacing: .3px; }

/* 轨道行：素材之外完全透明（无串场底色） */
.trow { position: relative; height: var(--row-h); margin-bottom: 4px; background: transparent;
        border: 0; }
.tbody { position: absolute; inset: 0; }
.clip { position: absolute; top: 4px; bottom: 4px; border-radius: 2px; overflow: hidden;
        background: #1B1F20; }
/* 只有素材本身有白色描边高光 */
.clip::after { content: ""; position: absolute; inset: 0; border-radius: 3px;
               border: 1px solid rgba(255,255,255,.22); pointer-events: none; }
.clip.selected::after { border-color: #FFFFFF; border-width: 1.5px; }
.clip-fill { position: absolute; inset: 0; background-repeat: repeat-x; background-position: left center; }
.clip-name { position: absolute; left: 5px; top: 3px; font-size: 8px; color: #EDF1EE;
             text-shadow: 0 1px 2px #000; white-space: nowrap; }
.wave { position: absolute; inset: 5px 0; display: flex; align-items: center; gap: 1px; overflow: hidden; }
.wave i { display: block; width: 1px; background: #9AA6A2; flex: none; }

/* 关键帧 ♦ 标记 */
.kf { position: absolute; width: 8px; height: 8px; background: #FFFFFF;
      transform: translate(-50%, -50%) rotate(45deg); border-radius: 1px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.55); z-index: 6; }

/* 悬浮轨道控件列：只覆盖在有素材的轨道上，随轨道数量生成 */
.floating-heads { position: absolute; left: 0; top: 0; width: 44px; z-index: 30;
                  display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.fh { height: var(--row-h); display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; pointer-events: none; }
.fh .row { pointer-events: auto; }
.fh .row { display: flex; gap: 3px; align-items: center; }
.fh button { width: 16px; height: 16px; border: 0; background: none; box-shadow: none;
             color: #D2D8D5; display: grid; place-items: center; padding: 0;
             -webkit-appearance: none; appearance: none; }
.fh button .i { width: 11px; height: 11px; }
.fh button.off { color: #4B5150; }
.fh .fname { font-size: 8px; color: #6E7472; max-width: 42px; overflow: hidden;
             white-space: nowrap; text-overflow: ellipsis; }

/* ⑤ 悬浮播放控制 40 */
.transport { flex: none; height: var(--tp-h); background: var(--bg-dock);
             display: flex; align-items: center; justify-content: center; gap: 46px; }
.tp { width: 33px; height: 33px; border: 0; background: transparent; color: #FFFFFF;
      display: grid; place-items: center; padding: 0; }
#btn-split .i { width: 20px; height: 20px; }
.tp-del { color: #EA6A45; }
.start-badge { position: absolute; left: 4px; top: 3px; z-index: 46;
               width: 30px; height: 19px; border-radius: 5px; border: 1px solid #C8792F;
               background: #5E361A; display: grid; place-items: center; padding: 0; }
.start-badge .sb-tri { width: 0; height: 0; border-left: 7px solid #FFFFFF;
                       border-top: 5px solid transparent; border-bottom: 5px solid transparent;
                       margin-left: 1px; }
.start-badge::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px;
                       width: 1.5px; background: #FFFFFF; }
.tp .i { width: 19px; height: 19px; }
.tp-main .i { width: 23px; height: 23px; }

/* ⑥ 工具栏：一级/二级同一行 90 */
.bar { flex: none; height: var(--bar-h); background: var(--bg-dock); overflow: hidden;
       border-top: 0; box-shadow: none; }
.bar-track { height: 100%; display: flex; align-items: stretch;
             transition: transform .26s var(--ease); will-change: transform; }
.page { flex: none; width: 100%; display: flex; align-items: stretch;
        overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.page::-webkit-scrollbar { display: none; }
.l1-item { flex: 1 1 0; min-width: 56px; max-width: 96px; border: 0; background: transparent;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 9px; color: var(--text-mid); padding: 0; }
.l1-item .i { width: 23px; height: 23px; }
.l1-item span { font-size: 10px; letter-spacing: .1px; }
.l1-item.on { color: #FFFFFF; }

.l2-item { flex: none; min-width: 58px; border: 0; background: transparent;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; color: #CDD2CF; padding: 0 8px; }
.l2-item .i { width: 22px; height: 22px; }
.l2-item span { font-size: 10px; white-space: nowrap; }
.l2-item.danger { color: #D9564B; }
.l2-item[disabled] { opacity: .38; }
.l2-back { flex: none; width: 62px; border: 0; background: transparent; color: #FFFFFF;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; padding: 0; }
.l2-back .i { width: 22px; height: 22px; }
.l2-back span { font-size: 10px; }
.l2-scroll { flex: 1 1 auto; display: flex; align-items: stretch;
             overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.l2-scroll::-webkit-scrollbar { display: none; }

/* 素材面板 */
.sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.6);
              display: flex; align-items: flex-end; z-index: 100; }
.sheet-mask[hidden] { display: none; }
.sheet { width: 100%; background: #1E2023; border-radius: 14px 14px 0 0;
         padding: 12px 12px 20px; max-height: 62%; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; justify-content: space-between;
              font-size: 13px; font-weight: 600; padding: 2px 4px 10px; }
.sheet-close { border: 0; background: #2A2D30; color: #D8DAD7; width: 26px; height: 26px;
               border-radius: 50%; display: grid; place-items: center; }
.sheet-close .i { width: 14px; height: 14px; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.sheet-item { display: flex; align-items: center; gap: 10px; background: #25282B;
              border: 1px solid #303437; border-radius: 9px; padding: 9px 11px;
              color: #EDEFEC; font-family: var(--font); font-size: 12px; text-align: left; }
.sheet-item small { color: #7B817F; font-size: 10px; font-family: var(--font-num); }

/* ---- 图层列表：一行一轨，右侧显示 / 静音 / 锁定 开关 ---- */
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  background: #25282B;
  border-radius: 9px;
}
.layer-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.layer-main b { font-size: 12.5px; font-weight: 600; color: #E4E7E5;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-main small { font-size: 10px; color: #7B817F; font-family: var(--font-num); }
.layer-acts { flex: none; display: flex; gap: 4px; }
.layer-acts button {
  width: 30px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid #34383A; border-radius: 7px;
  background: transparent; color: #9BA19E;
  cursor: pointer; padding: 0;
  -webkit-appearance: none; appearance: none;
}
.layer-acts button .i { width: 15px; height: 15px; }
.layer-acts button[aria-pressed="true"] { background: #3A2F2F; border-color: #5A3A3A; color: #E8A0A0; }
.layer-acts button:active { background: #2E3235; }

/* 音频轨附加行（音量 / 重命名） */
.layer-extra { display: flex; gap: 8px; margin-top: 7px; padding-top: 7px;
               border-top: 1px solid #33383A; }
.layer-extra .lx {
  flex: 1 1 0; height: 28px;
  border: 1px solid #34383A; border-radius: 7px;
  background: transparent; color: #9BA19E;
  font-family: var(--font); font-size: 11px;
  cursor: pointer; padding: 0;
  -webkit-appearance: none; appearance: none;
}
.layer-extra .lx:active { background: #2E3235; color: #D6DAD8; }

.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
         background: rgba(28,31,33,.97); border: 1px solid #35393C; color: #E9EBE8;
         font-size: 11px; padding: 9px 14px; border-radius: 8px; z-index: 120;
         max-width: 330px; text-align: center; line-height: 1.55; }

/* 有素材时隐藏空态文字 */
.app.has-clips .empty-hint { display: none; }


/* ---------- 自适应：不同尺寸 / 横屏 / 平板 ---------- */
@media (max-height: 700px) {
  .app { --tl-h: clamp(150px, 24vh, 210px); --bar-h: clamp(70px, 10vh, 84px); }
  .l1-item .i { width: 20px; height: 20px; }
  .l1-item span { font-size: 9px; }
}
@media (max-height: 560px) {
  .app { --top-h: 30px; --tl-h: 150px; --bar-h: 66px; --tp-h: 38px; }
  .circles { height: 30px; }
  .cbtn { width: 26px; height: 26px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .app { flex-direction: row; flex-wrap: wrap; }
  .topbar { order: 0; flex: 1 1 100%; }
  .stage { order: 1; flex: 1 1 46%; }
  .toolbar { order: 2; flex: 1 1 46%; align-self: flex-start; }
  .timeline { order: 3; flex: 1 1 100%; }
  .transport { order: 4; flex: 1 1 100%; }
  .bar { order: 5; flex: 1 1 100%; }
}
/* ---------- 平板 / 折叠屏（>=700px）----------
   不做左右分栏（那要改 HTML 结构），改为：
   · 取消「760px 居中」的窄条限制 —— 那是手机版拉伸，浪费两侧空间
   · 舞台按可用高度尽量放大，画布保持 9:16 不被压扁
   · 时间轴高度封顶，避免大屏上轨道被拉得过长、一屏看不到整条序列
   依据：design/spec/01-design-direction.md §4「舞台永远可见」与「时间轴固定底部」。 */
@media (min-width: 700px) and (min-height: 700px) {
  .app { width: 100%; max-width: none; margin: 0;
         --tl-h: clamp(220px, 30vh, 360px);
         --bar-h: clamp(88px, 10vh, 108px); }
  .stage    { max-height: none; }
  .canvas   { max-height: 100%; height: 100%; }
  .timeline { max-height: 46vh; }
}

/* ---------- 轨道图标：默认收起，展开按轨道数量成组 ---------- */
.heads-toggle { position: absolute; left: 2px; top: 4px; z-index: 48;
                width: 22px; height: 20px; border: 0; background: transparent;
                color: #B9BFBC; display: flex; align-items: center; justify-content: center;
                gap: 2px; padding: 0; }
.heads-toggle .rail { width: 1.5px; height: 12px; background: #6E7472; display: block; }
.heads-toggle .i { width: 12px; height: 12px; transition: transform .18s var(--ease); }
.app.heads-open .heads-toggle .i { transform: rotate(180deg); }
.floating-heads { display: none; }
.app.heads-open .floating-heads { display: flex; }

/* 固定区永不收缩 */
.topbar, .toolbar, .timeline, .transport, .bar { flex: 0 0 auto; min-height: 0; }
.stage { flex: 1 1 auto; min-height: 0; }
.circles, .transport, .bar-track, .page { min-height: 0; }
.cbtn, .tp { flex: 0 0 auto; }

@media (max-height: 900px) { .stage { max-height: 38vh; } }
@media (max-height: 760px) { .stage { max-height: 34vh; } .app { --tl-h: clamp(190px, 30vh, 260px); } }

/* ---------- 片段裁剪把手（选中时两端出现带箭头的胶囊） ---------- */
.trim-handle {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 16px; height: 30px; border-radius: 8px;
  background: #FFFFFF; display: grid; place-items: center;
  z-index: 8; cursor: ew-resize; touch-action: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
}
.trim-handle svg { width: 8px; height: 16px; display: block; }
.trim-l { left: 2px; }
.trim-r { right: 2px; }
.clip.selected { overflow: visible; }

/* ---------- 吸附辅助线 ---------- */
.snap-line {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: rgba(255,255,255,.85); display: none; z-index: 45;
  pointer-events: none;
}
.snap-line::before {
  content: ""; position: absolute; top: 0; left: -2px;
  border-left: 2.5px solid transparent; border-right: 2.5px solid transparent;
  border-top: 5px solid rgba(255,255,255,.85);
}

/* 拖动中禁止页面滚动，避免与时间轴平移冲突 */
.clip, .trim-handle { touch-action: none; }

/* ---------- 超窄屏兜底（320–360px）：缩小字与图标，但不隐藏功能 ---------- */
@media (max-width: 360px) {
  /* 小屏（360×640 一类）：时间轴是次要信息，舞台才是判断画面的地方。
     把 tl-h 从 29vh 压到 22vh、工具栏压到 9.4vh，舞台可多出 ~50px。
     实测：画布从 122×217 → 约 168×298，预览可用性显著提升。 */
  .app { --bar-h: clamp(66px, 9.4vh, 80px); --tl-h: clamp(140px, 22vh, 200px);

/* =============================================================================
   三级面板（参考稿结构：拖拽条 + 关闭/标题/应用 + 分段控件 + 参数行）
   参数行：图标 · 标签 · 滑轨 · 数值胶囊
   ============================================================================= */
.l3-mask { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .35); }
.l3-mask[hidden] { display: none; }

.l3 { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
      /* 面板高度上限：底部起算，保证上方仍留 2 行轨道 + 刻度尺。
         2 行 = 2×(46+4)=100px；刻度尺 26；播放条 46；顶栏 36；
         再留 16 的呼吸位 → 共约 224px。 */
      height: min(37vh, calc(100dvh - 320px));
      max-height: calc(100dvh - 320px);
      display: flex; flex-direction: column;
      background: var(--bg-timeline); border-radius: 16px 16px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -12px 32px rgba(0, 0, 0, .55);
      transform: translateY(100%); transition: transform .26s var(--ease); }
.l3[hidden] { display: none; }
.l3.open { transform: translateY(0); }

/* 拖拽条 */
.l3-grip { flex: none; width: 36px; height: 4px; border-radius: 2px;
           background: rgba(255, 255, 255, .30); margin: 8px auto 2px; }

/* 头部：X · 标题 · 应用 */
.l3-head { flex: none; height: 44px; display: flex; align-items: center;
           padding: 0 6px 0 4px; }
.l3-x { width: 40px; height: 40px; border: 0; background: transparent;
        color: #FFFFFF; display: grid; place-items: center; padding: 0; }
.l3-x .i { width: 19px; height: 19px; stroke-width: 1.9; }
.l3-title { flex: 1; text-align: center; font-size: 13.5px; font-weight: 700;
            color: #FFFFFF; letter-spacing: .1px; }
.l3-reset { flex: none; width: 40px; height: 40px; padding: 0; border: 0;
             background: transparent; color: var(--text-mid);
             display: grid; place-items: center; }
.l3-reset .i { width: 17px; height: 17px; stroke-width: 1.7; }
.l3-reset:active { color: #FFFFFF; }

/* 分段控件 */
.l3-seg { flex: none; display: flex; gap: 0; margin: 2px 12px 10px;
          background: rgba(255, 255, 255, .05); border-radius: 10px; padding: 3px; }
.l3-seg[hidden] { display: none; }
.l3-seg button { flex: 1; height: 32px; border: 0; border-radius: 8px;
                 background: transparent; color: var(--text-mid);
                 font-family: var(--font); font-size: 12.5px; font-weight: 600; }
.l3-seg button.on { background: rgba(255, 255, 255, .12); color: #FFFFFF; }

/* 头部动作按钮（反转 / 重置 / 移除） */
.l3-actions { flex: none; display: flex; gap: 8px; margin: 0 12px 10px; }
.l3-actions[hidden] { display: none; }
.l3-actions button { flex: 1; height: 30px; border: 1px solid var(--line-2);
                     border-radius: 9px; background: transparent; color: var(--text-mid);
                     font-family: var(--font); font-size: 11.5px; }
.l3-actions button.danger { color: #E5484D; border-color: rgba(229, 72, 77, .38); }

/* 内容区 */
.l3-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
           padding: 0 12px 16px; }
.l3-body::-webkit-scrollbar { width: 0; }

/* 参数行：图标 · 标签 · 滑轨 · 数值 */
.prow { display: flex; align-items: center; gap: 8px; height: 42px; }
.prow > .i { flex: none; width: 15px; height: 15px; stroke-width: 1.5;
             color: var(--text-low); }
.prow .plabel { flex: none; width: 46px; font-size: 11px; color: var(--text-mid);
                white-space: nowrap; }
.prow .pwrap { flex: 1; min-width: 0; display: flex; align-items: center; height: 20px;
               position: relative; }
.prow .ptrack { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px;
                background: rgba(255, 255, 255, .10); }
.prow .pfill { position: absolute; left: 0; height: 3px; border-radius: 2px;
               background: #FFFFFF; }
.prow .pknob { position: absolute; width: 13px; height: 13px; border-radius: 50%;
               background: #FFFFFF; transform: translateX(-50%);
               box-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
.prow input[type=range] { position: absolute; inset: 0; width: 100%; height: 20px;
                          margin: 0; opacity: 0; cursor: pointer; }
.prow .pval { flex: none; min-width: 52px; height: 22px; padding: 0 6px;
              border: 1px solid var(--line-2); border-radius: 6px;
              background: transparent; color: var(--text-hi);
              font: 600 10.5px/22px var(--font-num); text-align: center;
              white-space: nowrap; }
.prow .pval2 { margin-left: 4px; min-width: 40px; }

/* 曲线编辑器 */
.cwrap { position: relative; width: 100%; height: 200px; margin-top: 4px;
         border-radius: 10px; background: #0E0E0E; overflow: hidden; }
.cwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.caxis { display: flex; justify-content: space-between; margin: 5px 2px 0;
         font: 500 9.5px/1 var(--font-num); color: var(--text-low); }
.chint { margin: 9px 2px 0; font-size: 10px; color: var(--text-low); line-height: 1.6; }

/* 曲线预设胶囊 */
.cpresets { display: flex; gap: 7px; overflow-x: auto; margin: 2px 0 10px;
            padding-bottom: 2px; scrollbar-width: none; }
.cpresets::-webkit-scrollbar { display: none; }
.cpresets button { flex: none; height: 28px; padding: 0 11px; border-radius: 14px;
                   border: 1px solid var(--line-2); background: transparent;
                   color: var(--text-mid); font-family: var(--font); font-size: 11px; }
.cpresets button.on { background: rgba(255, 255, 255, .13); color: #FFFFFF;
                      border-color: transparent; }

/* 抠像：色板行 */
.swatch { display: flex; align-items: center; gap: 9px; height: 42px; }
.swatch .dot { width: 22px; height: 22px; border-radius: 6px; border: 1px solid #FFFFFF33; }
.swatch .sname { flex: 1; font-size: 11.5px; color: var(--text-mid); }

@media (max-width: 360px) {
  .prow .plabel { width: 40px; font-size: 10.5px; }
  .prow .pval { min-width: 46px; font-size: 10px; }
  .cwrap { height: 168px; }
}

/* ---------- 三级面板：小标题 / 开关 / 迷你分段 / 色板 / 宫格 ---------- */
.l3-sub { margin: 14px 2px 6px; font-size: 13px; font-weight: 700;
          color: var(--text-hi); letter-spacing: -.1px; }
.l3-body > .l3-sub:first-child { margin-top: 4px; }

/* 单行占满（开关/分段/色板用） */
.prow .plabel.wide { width: auto; flex: 0 1 auto; font-size: 12px; color: var(--text-hi); }
.prow .grow { flex: 1; }

/* 开关 */
.prow .sw { width: 38px; height: 22px; border: 0; border-radius: 11px; padding: 0;
            background: rgba(255, 255, 255, .14); position: relative;
            transition: background .16s var(--ease); }
.prow .sw i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
              border-radius: 50%; background: #FFFFFF; transition: transform .16s var(--ease); }
.prow .sw.on { background: #FFFFFF; }
.prow .sw.on i { transform: translateX(16px); background: #16171C; }

/* 迷你分段 */
.segmini { display: flex; background: rgba(255, 255, 255, .06); border-radius: 8px; padding: 2px; }
.segmini button { height: 24px; padding: 0 9px; border: 0; border-radius: 6px;
                  background: transparent; color: var(--text-mid);
                  font-family: var(--font); font-size: 10.5px; }
.segmini button.on { background: rgba(255, 255, 255, .16); color: #FFFFFF; font-weight: 600; }

/* 色板 */
.swatches { display: flex; gap: 6px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid transparent;
                   padding: 0; }
.swatches button.on { border-color: #FFFFFF; box-shadow: 0 0 0 1.5px rgba(255,255,255,.25); }

/* 数值框 */
.prow .num { width: 72px; height: 26px; border: 1px solid var(--line-2); border-radius: 6px;
             background: transparent; color: var(--text-hi); text-align: center;
             font: 600 11px var(--font-num); }

/* 动作按钮 */
.prow .act { width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--line-2);
             background: transparent; color: var(--text-hi);
             font-family: var(--font); font-size: 12px;
             display: flex; align-items: center; justify-content: center; gap: 7px; }
.prow .act .i { width: 15px; height: 15px; stroke-width: 1.5; }

/* 宫格 */
.l3grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 4px; }
.l3grid.ratio { grid-template-columns: repeat(5, 1fr); }
.l3grid .cell { border: 1px solid var(--line-1); border-radius: 10px; padding: 0;
                background: transparent; display: flex; flex-direction: column;
                overflow: hidden; }
.l3grid .cell .thumb { display: block; width: 100%; aspect-ratio: 1 / 1;
                       background: linear-gradient(150deg, #2A2D2E, #1A1C1D); }
.l3grid .cell .cap { display: block; padding: 5px 2px 6px; text-align: center;
                     font-size: 10px; color: var(--text-mid);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l3grid .cell.on { border-color: #FFFFFF; }
.l3grid .cell.on .cap { color: #FFFFFF; font-weight: 600; }

/* 宫格选中后的返回行 */
.l3-backrow { margin: 2px 0 6px; padding: 4px 2px; border: 0; background: transparent;
              color: var(--text-mid); font-family: var(--font); font-size: 12px; }

  .l3grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }

<script>
/* 单文件离线版数据层：与 Engine 同接口，只读构建时内联的 NC_STATIC 快照。
   不发任何网络请求（docs/UI_INTEGRATION.md §7：Web/WASM 不支持 C ABI）。
   真机运行走 engine.js → window.NCEngine（JNI / C interop 直调）。 */
(function () {
  const D = window.NC_STATIC || { state: {}, frames: {}, thumbs: {}, wave: [] };
  const clampIdx = (list, i) => list[Math.max(0, Math.min(list.length - 1, i))];
  const frameKeys = Object.keys(D.frames).map(Number).sort((a, b) => a - b);

  window.Engine = {
    base: 'static',
    apiBase() { return 'static'; },
    state: D.state,
    online: true,
    lastError: '',

    async boot() { return true; },
    async refresh() { return this.state; },

    /* 与真实接口同形的“编辑”：静态版不修改工程，如实告知 */
    async edit(payload) {
      const op = payload && payload.op;
      if (op === 'frame_fit' || op === 'canvas' || op === 'track_flag') {
        return { ok: true, code: 0, message: '' };
      }
      throw new Error('单文件离线版只读展示，不写入工程；编辑请用原生客户端');
    },

    /* 取与时间最接近的真实渲染帧 */
    frameUrl(timeUs) {
      if (!frameKeys.length) return '';
      const t = Math.max(0, Math.round(timeUs));
      let best = frameKeys[0];
      for (const k of frameKeys) {
        if (Math.abs(k - t) < Math.abs(best - t)) best = k;
      }
      return D.frames[best];
    },
    thumbUrl(assetId) {
      return D.thumbs[assetId] || D.thumbs[Object.keys(D.thumbs)[0]] || '';
    },
    async waveform() {
      return { buckets: D.wave || [] };
    }
  };
})();

    /* ===== 特效 ===== */

    fxperson: { title: '人物特效', mode: 'grid', gridKind: 'effect', grid: EFFECTS.人物, then: 'fxparam' },
    fxatmo:   { title: '氛围特效', mode: 'grid', gridKind: 'effect', grid: EFFECTS.氛围, then: 'fxparam' },

    },

    /* ===== 转场 ===== */
    transpreset: { title: '转场', mode: 'grid', gridKind: 'transition', grid: TRANSITIONS, then: 'transparam' },

    adj: {

    ratio: {

    },

    },

    bgcolor: { title: '背景颜色', mode: 'single', groups: [['bgcolor', 'opacity']] },
    bgblur:  { title: '背景模糊', mode: 'single', groups: [['blur']] },
    bgstyle: {
      title: '画布样式', mode: 'grid', gridKind: 'style',
      grid: [
        { id: 1, name: '无' }, { id: 2, name: '纸纹' }, { id: 3, name: '布纹' },
        { id: 4, name: '磨砂' }, { id: 5, name: '网格' }, { id: 6, name: '渐变' }
      ]
    },

    /* ===== 蒙版 ===== */
    maskshape: {
      title: '蒙版', mode: 'grid', gridKind: 'mask', grid: MASKS, then: 'maskparam'
    },
    chroma: {
      title: '色度键', mode: 'single',
      groups: [['chromakey', 'chromain', 'chromaout', 'spill', 'chromaq', 'chromaon']],
      note: '按颜色抠除背景，用于绿幕 / 蓝幕素材'
    },
    maskparam: {
      title: '蒙版参数', mode: 'single',
      groups: [['posx', 'posy', 'maskw', 'maskh', 'maskrot', 'radius', 'feather', 'invert']],
      hidden: true
    },
    maskfeather: {
      title: '蒙版羽化', mode: 'single', groups: [['feather', 'invert']]
    },

    /* ===== AI ===== */
    refclip: {
      title: '参考仿剪', mode: 'single',
      groups: [['originality']],
      note: '仅分析节奏/转场/字幕样式/调色/构图，不复刻画面内容'
    },
    depth: {
      title: '深度图', mode: 'single',
      groups: [['depthmode', 'depthamt']],
      note: '单目深度估计为本地推理，需下载模型'
    }
  };

  window.L3_SPEC = {
    controls: C,
    spec: SPEC,
    adjustBase: ADJUST_BASE,
    curvePresets: CURVE_PRESETS,
    filters: FILTERS,
    effects: EFFECTS,
    masks: MASKS,
    transitions: TRANSITIONS,
    ratios: RATIOS
  };
})();

</script>
<script>
/* =============================================================================
   NairoClip Mobile · 三级面板渲染器
   -----------------------------------------------------------------------------
   规格数据在 l3-spec.js（纯数据）；本文件只负责把规格画成界面并写回引擎。

   三种形态（对应参考稿）：
     single  单页 —— 功能名加粗当小标题，下面竖排控件
     dual    双页 —— 「常规」+「区间」（曲线），点应用一起提交
     grid    宫格 —— 先选预设，选中后进入参数页

   写入引擎的真实能力（其余如实标注「仅预览」）：
     keyframe         透明度/缩放/位移/旋转/音量
     speed            常规倍速
     speed_curve      速度曲线
     filter           滤镜风格 + 强度
     effect_add       特效（类型 + 强度）
     mask             蒙版形状 + 位置/尺寸/羽化/圆角/反转
     chroma           色度抠像
     denoise          降噪强度
     audio            增益 + 淡入淡出
     canvas           画布比例
   ============================================================================= */
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  /* 依赖宿主页面提供的小工具；缺失时用本地兜底 */
  const toast = (...a) => (window.toast ? window.toast(...a) : console.log(...a));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fmtTime = (t) => (window.fmt ? window.fmt(t) : `${t.toFixed(1)}s`);

  const SPEC = window.L3_SPEC;
  if (!SPEC) {
    console.warn('[l3] l3-spec.js 未加载');
    return;
  }
  const C = SPEC.controls;
  const P = SPEC.spec;

  /* ---------------- 状态 ---------------- */
  const ST = {
    open: false,
    key: null,
    spec: null,
    page: 0,
    values: {},      // 控件值
    curve: null,     // { points: [{t,v}], presetIdx }
    gridPick: null,  // 宫格选中的项
    dirty: false
  };

  /* 宿主提供：当前选中片段、编辑器状态、写入接口 */
  const host = () => window.L3_HOST || {};

  const EL = () => ({
    mask: $('l3-mask'), panel: $('l3'), title: $('l3-title'),
    close: $('l3-close'), reset: $('l3-reset'),
    seg: $('l3-seg'), actions: $('l3-actions'), body: $('l3-body')
  });

  /* ---------------- 默认值 ---------------- */
  function defaults(spec) {
    const out = {};
    const list = spec.dynamic === 'adjust'
      ? SPEC.adjustBase.map((x) => x.key)
      : (spec.groups || []).flat();
    list.forEach((k) => {
      const c = C[k] || (spec.dynamic === 'adjust' ? SPEC.adjustBase.find((x) => x.key === k) : null);
      if (c) out[k] = c.def;
    });
    return out;
  }

  /* ---------------- 打开 ---------------- */
  function open(key, opts) {
    const spec = P[key] || (window.L3_SPEC && window.L3_SPEC.spec && window.L3_SPEC.spec[key]);
    if (!spec) {
      /* 面板缺失是接线问题，必须暴露具体键名，方便直接补 */
      console.warn('[L3] 缺少面板定义:', key);
      return toast(`面板未定义：${key}`);
    }

    const h = host();
    const needClip = spec.mode !== 'grid';
    if (needClip && !h.selClip && !(opts && opts.allowNoClip)) {
      return toast('请先在时间轴上选中一个片段');
    }

    ST.key = key;
    ST.spec = spec;
    ST.page = 0;
    ST.values = defaults(spec);
    ST.gridPick = null;
    ST.dirty = false;
    ST.curve = spec.curve ? { points: [], presetIdx: 0 } : null;
    ST.open = true;

    const el = EL();
    el.title.textContent = spec.title;
    el.panel.hidden = false;
    el.mask.hidden = false;
    requestAnimationFrame(() => el.panel.classList.add('open'));

    renderSeg();
    renderActions();
    renderBody();
  }

  function close() {
    const el = EL();
    el.panel.classList.remove('open');
    ST.open = false;
    setTimeout(() => {
      if (!ST.open) { el.panel.hidden = true; el.mask.hidden = true; }
    }, 280);
  }

  /* ---------------- 分段 ---------------- */
  function renderSeg() {
    const el = EL();
    const names = ST.spec.pageNames;
    if (!names) { el.seg.hidden = true; el.seg.innerHTML = ''; return; }
    el.seg.hidden = false;
    el.seg.innerHTML = '';
    names.forEach((t, i) => {
      const b = document.createElement('button');
      b.textContent = t;
      if (i === ST.page) b.className = 'on';
      b.addEventListener('click', () => { ST.page = i; renderSeg(); renderBody(); });
      el.seg.appendChild(b);
    });
  }

  /* ---------------- 头部动作 ---------------- */
  function renderActions() {
    const el = EL();
    el.actions.innerHTML = '';
    const acts = [];
    if (ST.spec.mode !== 'grid') acts.push({ k: 'reset', t: '重置' });
    acts.forEach((a) => {
      const b = document.createElement('button');
      b.textContent = a.t;
      b.addEventListener('click', () => {
        ST.values = defaults(ST.spec);
        if (ST.curve) { ST.curve.points = []; ST.curve.presetIdx = 0; }
        ST.dirty = true;
        renderBody();
        markDirty();
        toast('已重置为默认值');
      });
      el.actions.appendChild(b);
    });
  }

  /* ---------------- 小标题（单页/宫格后的参数名） ---------------- */
  function titleBlock(text) {
    const d = document.createElement('div');
    d.className = 'l3-sub';
    d.textContent = text;
    return d;
  }

  /* ---------------- 控件工厂 ---------------- */
  function ctl(key) {
    const c = C[key] || SPEC.adjustBase.find((x) => x.key === key);
    if (!c) return null;

    if (c.kind === 'slider') return sliderRow(key, c);
    if (c.kind === 'switch') return switchRow(key, c);
    if (c.kind === 'seg') return segRow(key, c);
    if (c.kind === 'color') return colorRow(key, c);
    if (c.kind === 'number') return numberRow(key, c);
    if (c.kind === 'button') return buttonRow(key, c);
    return null;
  }

  function valText(c, v) {
    if (c.unit === '%') return `${Math.round(v * (c.scale || 1) * 100)}%`;
    if (c.unit === 'x') return `${Number(v).toFixed(2)}x`;
    if (c.unit === '°') return `${Math.round(v)}°`;
    if (c.unit === 'px') return `${Math.round(v)}px`;
    if (c.unit === 's') return `${Number(v).toFixed(1)}s`;
    if (c.unit === 'dB') return `${v > 0 ? '+' : ''}${Number(v).toFixed(1)}dB`;
    if (c.scale === 100) return `${Math.round(v * 100)}%`;
    return `${Number(v).toFixed(2)}`;
  }

  function sliderRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    const cur = ST.values[key] ?? c.def;
    row.innerHTML = `<svg class="i"><use href="#${c.icon || 'i-adjust'}"/></svg>
      <span class="plabel">${c.name}</span>
      <span class="pwrap">
        <span class="ptrack"></span><span class="pfill"></span><span class="pknob"></span>
        <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${cur}">
      </span>
      <span class="pval">${valText(c, cur)}</span>`;

    const input = row.querySelector('input');
    const fill = row.querySelector('.pfill');
    const knob = row.querySelector('.pknob');
    const out = row.querySelector('.pval');

    const paint = (v) => {
      const r = (v - c.min) / (c.max - c.min);
      const p = clamp(r, 0, 1) * 100;
      fill.style.width = `${p}%`;
      knob.style.left = `${p}%`;
      out.textContent = valText(c, v);
    };
    paint(cur);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      ST.values[key] = v;
      markDirty();
      paint(v);
    });
    return row;
  }

  function switchRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    const on = ST.values[key] ?? c.def;
    row.innerHTML = `<span class="plabel wide">${c.name}</span>
      <span class="grow"></span>
      <button class="sw${on ? ' on' : ''}"><i></i></button>`;
    const b = row.querySelector('.sw');
    b.addEventListener('click', () => {
      ST.values[key] = !ST.values[key];
      b.classList.toggle('on', ST.values[key]);
      markDirty();
    });
    return row;
  }

  function segRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    const cur = ST.values[key] ?? c.def;
    row.innerHTML = `<span class="plabel wide">${c.name}</span>
      <span class="grow"></span><span class="segmini"></span>`;
    const box = row.querySelector('.segmini');
    c.opts.forEach((t, i) => {
      const b = document.createElement('button');
      b.textContent = t;
      if (i === cur) b.className = 'on';
      b.addEventListener('click', () => {
        ST.values[key] = i;
        box.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === i));
        markDirty();
      });
      box.appendChild(b);
    });
    return row;
  }

  function colorRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    const cur = ST.values[key] ?? c.def;
    row.innerHTML = `<span class="plabel wide">${c.name}</span><span class="grow"></span><span class="swatches"></span>`;
    const box = row.querySelector('.swatches');
    c.opts.forEach((hex) => {
      const b = document.createElement('button');
      b.style.background = hex;
      if (hex === cur) b.className = 'on';
      b.addEventListener('click', () => {
        ST.values[key] = hex;
        box.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        markDirty();
      });
      box.appendChild(b);
    });
    return row;
  }

  function numberRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    const cur = ST.values[key] ?? c.def;
    row.innerHTML = `<span class="plabel wide">${c.name}</span>
      <span class="grow"></span>
      <input class="num" type="number" min="${c.min}" max="${c.max}" value="${cur}">`;
    const inp = row.querySelector('.num');
    inp.addEventListener('input', () => {
      ST.values[key] = clamp(parseFloat(inp.value) || c.def, c.min, c.max);
      markDirty();
    });
    return row;
  }

  /* ---------------- AI 动作：按面板映射到真实功能 ----------------
     面板 key → core::AiFeatureType（见 core/include/nairoclip/core/ai_task.h）
     以及该功能依赖的模型 ID（见 core/src/model_manager.cpp 的内置清单）。 */
  const AI_ACTION = {
    subtitle:  { feature: 10, model: 'whisper_zh',      needClip: false, label: '识别字幕' },
    lyrics:    { feature: 10, model: 'whisper_zh',      needClip: false, label: '识别歌词' },
    translate: { feature: 5,  model: 'translate_zh_en', needClip: true,  label: '字幕翻译' },
    tts:       { feature: 6,  model: 'tts_zh',          needClip: false, label: '文本转语音' },
    stem:      { feature: 4,  model: 'stem_sep',        needClip: true,  label: '人声分离' },
    depth:     { feature: 8,  model: null,              needClip: true,  label: '深度图' },
    record:    { feature: null, model: null,            needClip: false, label: '录音' }
  };

  /** 读取模型状态：2 = 已安装（3 损坏 / 4 可更新 也算不可直接用）。 */
  function modelStatus(modelId) {
    const br = window.NCEngine;
    if (!br || typeof br.models !== 'function') return -1;   // -1：拿不到
    try {
      const raw = br.models();
      const d = (raw && typeof raw === 'object') ? raw : JSON.parse(String(raw || '{}'));
      const list = d.models || [];
      const m = list.find((x) => x.id === modelId);
      return m ? Number(m.status) : -2;                       // -2：清单里没有
    } catch (e) {
      return -1;
    }
  }

  function startAiAction(key) {
    const act = AI_ACTION[key];
    if (!act) {
      toast('该处理尚未接入引擎');
      return;
    }

    const h = host();
    if (!window.NCEngine) {
      toast('无引擎桥，无法执行本地 AI 处理');
      return;
    }

    // 录音走系统权限，不是模型推理
    if (key === 'record') {
      toast('录音需在系统设置中授权麦克风（由平台层实现）');
      return;
    }

    // 依赖模型的功能：先查真实状态，没装就如实说，不假装能跑
    if (act.model) {
      const st = modelStatus(act.model);
      if (st === -1) {
        toast('读不到模型状态（引擎桥不可用）');
        return;
      }
      if (st === -2) {
        toast(`模型清单里没有 ${act.model}`);
        return;
      }
      if (st === 0) {
        toast(`「${act.label}」需要模型 ${act.model}，尚未下载`);
        return;
      }
      if (st === 1) {
        toast(`模型 ${act.model} 正在下载中`);
        return;
      }
      if (st === 3) {
        toast(`模型 ${act.model} 已损坏，需重新下载`);
        return;
      }
      // 2 = 已安装；4 = 可更新（可继续用）→ 往下走
    }

    const sel = h.selClip && h.selClip();
    if (act.needClip && !sel) {
      toast('请先在时间轴上选中一个片段');
      return;
    }

    // 开一个 AI 任务：core 负责状态机与进度，平台层执行真实推理
    // 声明：int32_t nc_ai_task_begin(editor, feature, target_id, char** out_error)
    // 面板参数不在此处传：任务开始后由平台层读取 UI 状态执行推理。
    const r = h.callNative
      ? h.callNative('nc_ai_task_begin', {
          feature: act.feature,
          target_id: sel && sel.clip ? sel.clip.id : 0
        })
      : null;

    if (r && r.ok) {
      toast(`已提交「${act.label}」，等待平台层推理`);
      if (h.reload) h.reload();
    } else {
      toast(`「${act.label}」提交失败：${(r && r.message) || '引擎未响应'}`);
    }
  }

  function buttonRow(key, c) {
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = `<button class="act"><svg class="i"><use href="#${c.icon || 'i-ai'}"/></svg>${c.name}</button>`;
    row.querySelector('.act').addEventListener('click', () => {
      startAiAction(ST.key);
    });
    return row;
  }

  /* 面板不再有「应用」：参数改动即时写入引擎。
     用 200ms 防抖合并连续拖动，避免每个像素都产生一条撤销记录。 */
  let commitTimer = 0;
  function markDirty() {
    ST.dirty = true;
    clearTimeout(commitTimer);
    commitTimer = setTimeout(() => { commit(); }, 200);
  }

  async function commit() {
    const h = host();
    if (typeof h.edit !== 'function') return;
    const sel = h.selClip && h.selClip();
    if (!sel) return;
    const v = ST.values;
    const track = sel.track.index;
    const clip = sel.clip.id;
    const us = typeof h.nowUs === 'function' ? h.nowUs() : 0;
    try {
      /* 关键帧通道 */
      for (const key of Object.keys(v)) {
        const c = C[key] || SPEC.adjustBase.find((x) => x.key === key);
        if (!c || c.prop === undefined) continue;
        await h.edit({ op: 'keyframe', track, clip, property: c.prop, time_us: us, value: v[key] });
        if (c.prop === 0) await h.edit({ op: 'opacity', track, clip, value: v[key] });
      }
      /* 变速 */
      if (ST.key === 'speed' && typeof v.speed === 'number') {
        await h.edit({ op: 'speed', track, clip,
                       num: Math.round(v.speed * 100), den: 100 });
      }
      /* 速度曲线：仅在「曲线」页配置了控制点时提交。
         times 用相对片段起点的秒数；speeds 为倍率。 */
      if (ST.curve && Array.isArray(ST.curve.points) && ST.curve.points.length >= 2) {
        const times = ST.curve.points.map((p) => p.t);
        const speeds = ST.curve.points.map((p) => p.v);
        await h.edit({ op: 'speed_curve', track, clip, times, speeds, easing: 0 });
      }
      /* 滤镜强度 */
      if (typeof v.filteramt === 'number') {
        await h.edit({ op: 'filter', track, clip,
                       style: (h.clipStyle && h.clipStyle()) || 0, intensity: v.filteramt });
      }
      /* 特效强度：type 必须用宫格里选中的那个特效，
         否则「雪花 / 下雨 / 老电影」等全部会被写成同一个（曾是 13=故障）。 */
      if (typeof v.fxamt === 'number') {
        const picked = ST.gridPick && ST.gridPick.id;
        if (!picked) {
          toast('请先在宫格中选择一个特效');
        } else {
          await h.edit({ op: 'effect_add', track, clip, type: picked, value: v.fxamt / 100 });
        }
      }
      /* 蒙版 */
      if (typeof v.feather === 'number' || typeof v.invert === 'boolean') {
        await h.edit({ op: 'mask', track, clip,
                       shape: (h.maskShape && h.maskShape()) || 4,
                       x: 0.5 + (v.posx || 0) / 20, y: 0.5 + (v.posy || 0) / 20,
                       rotation: v.maskrot || 0, width: v.maskw || 1, height: v.maskh || 1,
                       feather: v.feather ?? 0.02, radius: v.radius || 0,
                       invert: v.invert ? 1 : 0 });
      }
      /* 色度键：任一抠像参数变化即整体提交 */
      if (ST.key === 'chroma') {
        // segRow 存的是索引（0/1/2），直接当 quality 用
        const q = typeof v.chromaq === 'number' ? v.chromaq : 1;
        await h.edit({
          op: 'chroma', track, clip,
          key: v.chromakey || '#00FF00',
          inner: typeof v.chromain === 'number' ? v.chromain : 0.35,
          outer: typeof v.chromaout === 'number' ? v.chromaout : 0.55,
          spill: typeof v.spill === 'number' ? v.spill : 0.3,
          quality: q,
          enabled: v.chromaon === false ? 0 : 1
        });
      }
      /* 降噪 */
      if (ST.key === 'denoise') {
        await h.edit({ op: 'denoise', track, clip, strength: v.denoiselv ?? 0 });
      }
      /* 音频 */
      if (typeof v.fadein === 'number' || typeof v.fadeout === 'number' ||
          typeof v.gain === 'number') {
        await h.edit({ op: 'audio', track, clip, gain_db: v.gain || 0,
                       fade_in_us: Math.round((v.fadein || 0) * 1e6),
                       fade_out_us: Math.round((v.fadeout || 0) * 1e6) });
      }
    } catch (err) {
      toast(`写入失败：${err.message || err}`, 2600);
    }
  }

  /* ---------------- 曲线编辑器 ---------------- */
  function curvePreset(i) {
    switch (i) {
      case 1: return [{t:0,v:1},{t:.18,v:3.2},{t:.34,v:.6},{t:.52,v:2.6},{t:.7,v:.7},{t:.86,v:2.8},{t:1,v:1}];
      case 2: return [{t:0,v:1},{t:.32,v:1},{t:.5,v:.28},{t:.68,v:1},{t:1,v:1}];
      case 3: return [{t:0,v:1},{t:.36,v:.9},{t:.5,v:.12},{t:.64,v:.9},{t:1,v:1}];
      case 4: return [{t:0,v:1},{t:.16,v:3.4},{t:.32,v:.7},{t:.5,v:3.4},{t:.66,v:.7},{t:.84,v:3.4},{t:1,v:1}];
      case 5: return [{t:0,v:4.5},{t:.2,v:1.6},{t:.4,v:1},{t:1,v:1}];
      case 6: return [{t:0,v:1},{t:.6,v:1},{t:.8,v:1.6},{t:1,v:4.5}];
      default: return [{t:0,v:1},{t:1,v:1}];
    }
  }

  function drawCurve(cv, points, unit) {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = cv.clientWidth || 320;
    const h = cv.clientHeight || 200;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    const pad = 14;
    const X = (t) => pad + t * (w - pad * 2);
    /* 对数轴：0.1x–10x，1x 落在正中（线性轴会让 1x 贴底） */
    const LMIN = Math.log(0.1);
    const LR = Math.log(10) - LMIN;
    const Y = (v) => h - pad - (Math.log(clamp(v, 0.1, 10)) - LMIN) / LR * (h - pad * 2);

    g.strokeStyle = 'rgba(255,255,255,.06)';
    g.lineWidth = 1;
    [0.1, 1, 10].forEach((v) => {
      g.beginPath(); g.moveTo(pad, Y(v)); g.lineTo(w - pad, Y(v)); g.stroke();
    });
    g.strokeStyle = 'rgba(255,255,255,.14)';
    g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(pad, Y(1)); g.lineTo(w - pad, Y(1)); g.stroke();
    g.setLineDash([]);

    const pts = points.length >= 2 ? points : [{ t: 0, v: 1 }, { t: 1, v: 1 }];
    g.strokeStyle = '#FFFFFF';
    g.lineWidth = 1.6;
    g.lineJoin = 'round';
    g.beginPath();
    pts.forEach((pt, i) => {
      const x = X(pt.t); const y = Y(pt.v);
      if (i === 0) g.moveTo(x, y);
      else {
        const pv = pts[i - 1];
        const cx = (X(pv.t) + x) / 2;
        g.bezierCurveTo(cx, Y(pv.v), cx, y, x, y);
      }
    });
    g.stroke();

    pts.forEach((pt) => {
      g.beginPath();
      g.arc(X(pt.t), Y(pt.v), 3.6, 0, Math.PI * 2);
      g.fillStyle = '#F0A63E';
      g.fill();
    });
  }

  function curvePanel() {
    const box = document.createElement('div');
    const cfg = ST.spec.curve || {};

    if (cfg.presets) {
      const pre = document.createElement('div');
      pre.className = 'cpresets';
      cfg.presets.forEach((name, i) => {
        const b = document.createElement('button');
        b.textContent = name;
        if (ST.curve.presetIdx === i) b.className = 'on';
        b.addEventListener('click', () => {
          ST.curve.presetIdx = i;
          ST.curve.points = curvePreset(i);
          markDirty();
          pre.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === i));
          drawCurve(cv, ST.curve.points, cfg.unit);
        });
        pre.appendChild(b);
      });
      box.appendChild(pre);
    }

    const wrap = document.createElement('div');
    wrap.className = 'cwrap';
    const cv = document.createElement('canvas');
    wrap.appendChild(cv);
    box.appendChild(wrap);

    const h = host();
    const dur = (h.clipDur && h.clipDur()) || 8;
    const ax = document.createElement('div');
    ax.className = 'caxis';
    ax.innerHTML = `<span>0.0s</span><span>${(dur / 2).toFixed(1)}s</span><span>${dur.toFixed(1)}s</span>`;
    box.appendChild(ax);

    const hint = document.createElement('p');
    hint.className = 'chint';
    hint.textContent = cfg.presets
      ? '单击曲线加点；纵向为速度倍率（0.1x / 1x / 10x 对数刻度，虚线为原速）'
      : '单击曲线加点；纵向为该参数的取值范围，虚线为默认值';
    box.appendChild(hint);

    cv.addEventListener('click', (e) => {
      const r = cv.getBoundingClientRect();
      const t = clamp((e.clientX - r.left - 14) / (r.width - 28), 0, 1);
      const v = clamp(0.1 + (1 - (e.clientY - r.top - 14) / (r.height - 28)) * 9.9, 0.1, 10);
      ST.curve.points.push({ t, v });
      ST.curve.points.sort((a, b) => a.t - b.t);
      markDirty();
      drawCurve(cv, ST.curve.points, cfg.unit);
    });

    requestAnimationFrame(() => {
      if (!ST.curve.points.length) ST.curve.points = curvePreset(0);
      drawCurve(cv, ST.curve.points, cfg.unit);
    });
    return box;
  }

  /* ---------------- 宫格 ---------------- */
  function gridPanel() {
    const box = document.createElement('div');
    const wrap = document.createElement('div');
    wrap.className = 'l3grid' + (ST.spec.gridKind === 'ratio' ? ' ratio' : '');

    const kind = ST.spec.gridKind;
    /* 滤镜/特效/蒙版：向引擎要按预设真实渲染的缩略帧（NCEngine.presetFrame） */
    const canRender = (kind === 'filter' || kind === 'effect' || kind === 'mask');
    const base = (host().apiBase && host().apiBase()) || '';

    (ST.spec.grid || []).forEach((item) => {
      const b = document.createElement('button');
      b.className = 'cell';
      const label = item.name || item.id;
      b.innerHTML = `<span class="thumb"></span><span class="cap">${label}</span>`;

      /* 缩略图三级回退：
         1) 引擎在线 → NCEngine.presetFrame 取真实渲染帧（能反映当前片段）
         2) 引擎离线或失败 → static/preset/<slug>_sN.jpg（离线烘焙的实拍底图）
         3) 都没有 → 保留占位底色 */
      const th = b.querySelector('.thumb');
      const paint = (url) => {
        const img = new Image();
        img.alt = label;
        /* 不用 loading=lazy：格子常在滚动容器视口外，懒加载会让 onload 永不触发。
           也不用 onload 挂 DOM：data URL 批量解码时 onload 顺序不可靠，
           直接先插进 DOM 再 decode，失败才清空。 */
        th.style.background = 'none';
        th.innerHTML = '';
        th.appendChild(img);
        img.src = url;
        const drop = () => { th.innerHTML = ''; };
        if (img.decode) {
          img.decode().catch(drop);
        } else {
          img.onerror = drop;
        }
      };

      /* 底图分工（重要）：
         · 滤镜/调色 → 人像实拍（色调映射需要连续色阶，纯色块看不出差异）
         · 其他全部 → 黏土表情（结构变换/区域裁切需要清晰轮廓）
         每格的表情互不重复：由 NC_THUMB_MAP 的 <kind>_<id> 映射到唯一一张脸。 */
      const slug = item.slug || '';
      const isColorGrid = (kind === 'filter');
      const key = isColorGrid ? `${slug}_s1` : `${kind}_${item.id}`;
      const useStatic = () => {
        /* 音频等带显式 thumb 的条目直接用给定图 */
        if (item.thumb) {
          const b2 = window.NC_THUMB_IMG;
          if (b2 && b2[item.thumb]) { paint(b2[item.thumb]); return true; }
          if (window.NC_STATIC_BASE === 'data') return false;
          paint(`../static/${item.thumb}`);
          return true;
        }
        const bank = isColorGrid ? window.NC_PRESET_IMG : window.NC_THUMB_IMG;
        const id = isColorGrid ? key : (window.NC_THUMB_MAP || {})[key];
        if (bank && id && bank[id]) { paint(bank[id]); return true; }
        const base = window.NC_STATIC_BASE;
        if (base === 'data') return false;
        if (isColorGrid) paint(`${base || '../static'}/preset_sm/${key}.jpg`);
        else if (id) paint(`${base || '../static'}/${id}`);
        else return false;
        return true;
      };

      /* 宫格缩略帧：优先用平台桥 presetFrame（桥内临时套预设→渲染→还原）；
         无桥时退回内联静态图，不伪造画面。 */
      const br = window.NCEngine;
      const canBridge = !!(br && typeof br.presetFrame === 'function');
      if (!canBridge) {
        useStatic();
      } else if (canRender) {
        const t = (host().nowUs && host().nowUs()) || 1600000;
        let url = '';
        try {
          url = br.presetFrame(kind, item.id, t, 160) || '';
        } catch (e) {
          url = '';
        }
        if (url && url.slice(0, 5) === 'data:') {
          const img = new Image();
          img.alt = label;
          img.onload = () => {
            th.style.background = 'none';
            th.innerHTML = '';
            th.appendChild(img);
          };
          img.onerror = () => { useStatic(); };
          img.src = url;
        } else {
          useStatic();
        }
      } else {
        useStatic();
      }
      if (ST.gridPick && ST.gridPick.id === item.id) b.classList.add('on');
      b.addEventListener('click', () => {
        ST.gridPick = item;
        wrap.querySelectorAll('.cell').forEach((x) => x.classList.toggle('on', x === b));
        applyGrid(item);
      });
      wrap.appendChild(b);
    });
    box.appendChild(wrap);

    if (ST.spec.gridKind === 'audio' && !(ST.spec.grid || []).length) {
      const p = document.createElement('p');
      p.className = 'chint';
      p.textContent = '本机暂无音频素材，先从「＋」导入';
      box.appendChild(p);
    }
    return box;
  }

  /* 宫格点选即生效（无需「应用」） */
  async function applyGrid(item) {
    const h = host();
    if (typeof h.edit !== 'function') return;
    const sel = h.selClip && h.selClip();
    const track = sel ? sel.track.index : -1;
    const clip = sel ? sel.clip.id : 0;
    const g = item;
    const kind = ST.spec.gridKind;
    try {
      if (kind === 'ratio') {
        await h.edit({ op: 'canvas', width: g.w, height: g.h });
      } else if (kind === 'mask') {
        await h.edit({ op: 'mask', track, clip, shape: g.id, x: 0.5, y: 0.5,
                       rotation: 0, width: 1, height: 1, feather: 0.02, radius: 0, invert: 0 });
      } else if (kind === 'filter') {
        await h.edit({ op: 'filter', track, clip, style: g.id, intensity: 60 });
      } else if (kind === 'effect') {
        await h.edit({ op: 'effect_add', track, clip, type: g.id, value: 0.5 });
      } else if (kind === 'transition') {
        /* 转场发生在两个相邻片段之间：from = 当前片段，
           to = 同轨道上紧接着的下一个片段。找不到后继片段就无法建转场。 */
        const tr = (h.tracks && h.tracks()) ? h.tracks().find((t) => t.index === track) : null;
        const clips = (tr && tr.clips) ? tr.clips : [];
        const idx = clips.findIndex((c) => c.id === clip);
        const next = idx >= 0 ? clips[idx + 1] : null;
        if (!next) {
          toast('转场需要两个相邻片段：请在其后接一个片段');
          return;
        }
        const durUs = Math.round((g.dur || 0.5) * 1e6) || 500000;
        await h.edit({ op: 'transition', track, type: g.id,
                       duration_us: durUs, from: clip, to: next.id });
      } else {
        toast('该预设暂未接入引擎，仅预览');
        return;
      }
      if (typeof h.reload === 'function') await h.reload();
      toast('已应用');
    } catch (err) {
      toast(`写入失败：${err.message || err}`, 3000);
    }
  }

  /* ---------------- 主体路由 ---------------- */
  function renderBody() {
    const el = EL();
    el.body.innerHTML = '';

    if (ST.spec.mode === 'grid') {
      if (ST.gridPick && ST.spec.then) {
        // 选中预设后：上面回到宫格，下面展开参数
        const back = document.createElement('button');
        back.className = 'l3-backrow';
        back.textContent = `‹ ${ST.spec.title}`;
        back.addEventListener('click', () => { ST.gridPick = null; renderBody(); });
        el.body.appendChild(back);
        el.body.appendChild(titleBlock(ST.gridPick.name));
        const target = P[ST.spec.then];
        if (target) {
          (target.groups || []).flat().forEach((k) => {
            const r = ctl(k);
            if (r) el.body.appendChild(r);
          });
        }
        return;
      }
      el.body.appendChild(gridPanel());
      return;
    }

    // 双页：第 2 页是曲线
    if (ST.spec.mode === 'dual' && ST.page === 1) {
      el.body.appendChild(curvePanel());
      return;
    }

    // 单页 / 双页第 1 页：功能名加粗 + 竖排控件
    const keys = ST.spec.dynamic === 'adjust'
      ? SPEC.adjustBase.map((x) => x.key)
      : (ST.spec.groups || []).flat();

    if (!keys.length) {
      const p = document.createElement('p');
      p.className = 'chint';
      p.textContent = '此功能暂无调节参数';
      el.body.appendChild(p);
    } else {
      /* 头部已显示功能名：单页/双页首屏不再重复小标题；仅 hidden 面板需要 */
      keys.forEach((k) => {
        const r = ctl(k);
        if (r) el.body.appendChild(r);
      });
    }

    if (ST.spec.note) {
      const n = document.createElement('p');
      n.className = 'chint';
      n.textContent = ST.spec.note;
      el.body.appendChild(n);
    }
  }

  /* ---------------- 绑定 ---------------- */
  function bind() {
    const el = EL();
    if (!el.panel) return;
    el.close.addEventListener('click', close);
    el.mask.addEventListener('click', close);
    if (el.reset) {
      el.reset.addEventListener('click', () => {
        ST.values = defaults(ST.spec);
        if (ST.curve) { ST.curve.points = []; ST.curve.presetIdx = 0; }
        renderBody();
        markDirty();
        toast('已重置为默认值');
      });
    }
  }

  window.L3OPEN = open;
  window.L3CLOSE = close;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();

</script>
<script>
/* =============================================================================
   NairoClip Mobile · 剪辑页交互
   -----------------------------------------------------------------------------
   数据全部来自真实引擎（Engine → C ABI）：
     NCEngine.state()          → 轨道 / 片段 / 素材 / 撤销栈（JNI 直调 nc_track_get 等）
     NCEngine.frameDataUrl()   → 真实解码帧（nc_preview_render）
     NCEngine.thumbDataUrl()   → 真实缩略图（nc_thumbnail_generate）
     NCEngine.call(op, args)   → 真实编辑（nc_split_clip / nc_remove_clip / ...）
     不使用任何 HTTP 接口（见 docs/UI_INTEGRATION.md §7）。
   -----------------------------------------------------------------------------
   本版规则（按需求）：
     · 播放头白色 2px，固定在屏幕水平中心，贯穿刻度尺到轨道底；滑动轨道/刻度移动时间
     · 刻度可双指缩放，标签随缩放级别自动改变间隔（无负数时间）
     · 轨道区不再有整条底色；只有素材本身带白色描边，选中加亮
     · 悬浮轨道控件（👁 🔊 🔒）随轨道数量生成，覆盖在有素材的轨道上
     · 一级工具栏点击 → 同一行向右横向推出二级（首项为返回）
     · 关键帧按钮在选中片段上打 ♦，并在片段内绘制
     · 不实现三级调节面板
   ========================================================================== */
'use strict';

const FPS = 30;

/* DPR 分级：按物理像素密度决定渲染倍率（剪映同样做法）
   1x/2x 屏请求较小尺寸，3x 屏请求更大尺寸，避免糊或浪费内存 */
const DPR = Math.min(4, Math.max(1, window.devicePixelRatio || 1));
const NEED = {
  frameW: DPR >= 3 ? 420 : DPR >= 2 ? 320 : 282,   // 预览帧请求宽度
  thumbW: DPR >= 3 ? 120 : DPR >= 2 ? 100 : 92      // 时间轴缩略图宽度
};

const S = {
  tracks: [],
  assets: [],
  subtitles: [],
  markers: [],
  project: null,
  selected: null,        // {trackId, clipId}
  keyframes: [],         // {trackId, clipId, t, property}
  time: 0,
  pxPerSec: 44,
  playing: false,
  level: 1,              // 1 = 一级工具栏；2 = 二级
  activeL1: null,
  markerMode: false,
  headsOpen: false
};

const $ = (id) => document.getElementById(id);
const E = {
  app: $('app'), stage: $('stage'), canvas: $('canvas'), still: $('still'),
circles: $('circles'), strip: $('strip-done'),
  ruler: $('ruler'), rulerCv: $('ruler-canvas'), tracks: $('tracks'),
  hint: $('empty-hint'), heads: $('floating-heads'), barTrack: $('bar-track'),
  play: $('btn-play'), prev: $('btn-prev'), next: $('btn-next'),
  undo: $('btn-undo'), redo: $('btn-redo'),
  brand: $('btn-rename'), phRead: $('ph-read'),
  sheet: $('sheet-mask'), sheetList: $('sheet-list'), sheetClose: $('sheet-close')
};

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const viewW = () => E.tracks.clientWidth || 444;
const center = () => viewW() / 2;
const t2x = (t) => center() + (t - S.time) * S.pxPerSec;
const x2t = (x) => Math.max(0, S.time + (x - center()) / S.pxPerSec);
const fmt = (t) => {
  const s = Math.max(0, t);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  // 缩放足够大时显示到 0.1s
  if (S.pxPerSec >= 60) return `${m}:${sec.toFixed(1).padStart(4, '0')}`;
  return `${m}:${String(Math.floor(sec)).padStart(2, '0')}`;
};
const seqEnd = () => S.tracks.reduce((m, tr) =>
  tr.clips.reduce((mm, c) => Math.max(mm, c.start + c.dur), m), 0);

function toast(text, ms = 2200) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  E.app.appendChild(d);
  setTimeout(() => d.remove(), ms);
}

/* ---------------- 引擎 → 视图模型 ---------------- */
const kindOf = (type) => (type === 1 ? 'audio' : type === 2 ? 'subtitle' : 'video');

function applyState(st) {
  if (!st) return;
  S.assets = (st.assets || []).map((a) => ({
    id: a.id, name: a.name, dur: a.duration_us / 1e6, kind: a.type
  }));
  S.tracks = (st.tracks || []).map((t) => ({
    id: t.id, index: t.index, type: t.type, kind: kindOf(t.type), name: t.name,
    hidden: t.hidden, locked: t.locked, muted: t.muted,
    gainDb: typeof t.gain_db === 'number' ? t.gain_db : 0,
    clips: (t.clips || []).map((c) => {
      const asset = (st.assets || []).find((a) => a.id === c.asset_id);
      return {
        id: c.id, index: c.index, assetId: c.asset_id,
        name: asset ? asset.name : `片段 ${c.id}`,
        start: c.start_us / 1e6, dur: c.duration_us / 1e6,
        enabled: c.enabled, opacity: c.opacity,
        filterStyle: c.filter_style, filterIntensity: c.filter_intensity
      };
    })
  }));
  S.subtitles = st.subtitles || [];
  S.markers = st.markers || [];
  S.project = st.project || {};
  if (S.selected) {
    const alive = S.tracks.some((t) => t.id === S.selected.trackId &&
      t.clips.some((c) => c.id === S.selected.clipId));
    if (!alive) S.selected = null;
  }
}

/* 工程快照：直接读平台注入的桥（同步，无网络） */
function fetchState() {
  if (!Engine.bridge) throw new Error('引擎未连接');
  const s = Engine.refresh();
  if (!s) throw new Error(Engine.lastError || '读取工程状态失败');
  return s;
}

/* 编辑：调桥，成功后刷新快照并重绘 */
function edit(payload) {
  if (!Engine.bridge) throw new Error('引擎未连接');
  const op = payload && payload.op;
  const args = Object.assign({}, payload);
  delete args.op;
  const r = engineCall(op, args);
  if (!r || !r.ok) throw new Error((r && r.message) || `操作失败（${(r && r.code) ?? '未知'}）`);
  applyState(fetchState());
  renderAll();
  return r;
}

/* 桥调用统一入口：桥同步返回 JSON 字符串 */
function engineCall(fn, args) {
  if (!Engine.bridge) return { ok: false, code: -1, message: '引擎未连接' };
  try {
    const raw = Engine.bridge.call(fn, JSON.stringify(args || {}));
    if (raw === null || raw === undefined) return { ok: false, code: -1, message: '桥无返回' };
    return typeof raw === 'object' ? raw : JSON.parse(String(raw));
  } catch (err) {
    return { ok: false, code: -1, message: `桥调用失败：${err.message}` };
  }
}

async function guardedEdit(payload, okText) {
  if (!Engine.online) return false;
  try {
    await edit(payload);
    if (okText) toast(okText);
    return true;
  } catch (err) {
    toast(`引擎拒绝：${err.message}`, 3000);
    return false;
  }
}

async function addKeyframe() {
  const sel = selClip();
  if (!sel) return toast('请先选中片段，再在播放头位置打关键帧');
  const local = S.time - sel.clip.start;
  if (local < 0 || local > sel.clip.dur) return toast('播放头不在该片段范围内');
  if (Engine.online) {
    const ok = await guardedEdit({
      op: 'keyframe', track: sel.track.index, clip: sel.clip.id,
      property: 0, time_us: Math.round(local * 1e6), value: 1
    }, `已在 ${fmt(S.time)} 打关键帧`);
    if (ok) S.keyframes.push({ trackId: sel.track.id, clipId: sel.clip.id, t: local, property: 0 });
    renderAll();
    return;
  }
  S.keyframes.push({ trackId: sel.track.id, clipId: sel.clip.id, t: local, property: 0 });
  renderAll();
  toast(`已在 ${fmt(S.time)} 打关键帧`);
}

let frameSeq = 0;
function syncPreview() {
  // 空态提示只在轨道背板显示；预览区没有画面时就是纯黑，不再叠字
  if (!Engine.online) {
    E.still.style.visibility = 'hidden';
    return;
  }
  const us = Math.round(S.time * 1e6);
  const token = ++frameSeq;
  const url = Engine.frameUrl(us, NEED.frameW);
  if (!url) { E.still.style.visibility = 'hidden'; return; }

  // 内嵌 dataURL：直接挂载，不依赖 onload（file:// 下可能不触发）
  if (url.slice(0, 5) === 'data:') {
    E.still.src = url;
    E.still.style.visibility = 'visible';
    return;
  }
  const img = new Image();
  img.onload = () => {
    if (token !== frameSeq) return;
    E.still.src = url;
    E.still.style.visibility = 'visible';
  };
  img.onerror = () => {
    if (token !== frameSeq) return;
    E.still.style.visibility = 'hidden';
  };
  img.src = url;
}

function drawRuler() {
  const dpr = window.devicePixelRatio || 1;
  const w = viewW();
  const h = 26;
  const cv = E.rulerCv;
  if (cv.width !== Math.round(w * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 主刻度间隔随缩放自适应（像素密度 56px 起步），绝不出现负数
  const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
  const major = steps.find((s2) => s2 * S.pxPerSec >= 56) || 600;
  const minor = major / 5;
  const t0 = Math.max(0, S.time - center() / S.pxPerSec);
  const t1 = S.time + center() / S.pxPerSec;

  for (let t = Math.ceil(t0 / minor) * minor; t <= t1; t += minor) {
    if (t < 0) continue;
    const x = Math.round(t2x(t)) + 0.5;
    if (x < 0 || x > w) continue;
    const isMajor = Math.abs(t / major - Math.round(t / major)) < 1e-6;
    ctx.strokeStyle = isMajor ? '#5A5F62' : '#33373A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, isMajor ? h - 9 : h - 5);
    ctx.lineTo(x, h);
    ctx.stroke();
  }

  E.ruler.querySelectorAll('.ruler-label').forEach((n) => n.remove());
  for (let t = Math.ceil(t0 / major) * major; t <= t1; t += major) {
    if (t < 0) continue;
    const x = t2x(t);
    if (x < 12 || x > w - 12) continue;
    const d = document.createElement('span');
    d.className = 'ruler-label';
    d.style.left = `${x}px`;
    d.textContent = fmt(t);
    E.ruler.appendChild(d);
  }
}

function renderTracks() {
  [...E.tracks.querySelectorAll('.trow')].forEach((n) => n.remove());
  const hasClips = S.tracks.some((t) => t.clips && t.clips.length > 0);
  E.app.classList.toggle('has-clips', hasClips);
  E.hint.hidden = hasClips;

  S.tracks.forEach((tr) => {
    const row = document.createElement('div');
    row.className = 'trow';

    tr.clips.forEach((c) => body.appendChild(buildClip(tr, c)));
    row.appendChild(body);
    E.tracks.appendChild(row);
  });

  renderHeads();

  updateStrip();
}
