<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NairoClip</title>
<style>
/* NairoClip Mobile · 设计令牌
   底色/尺寸取自参考稿（1332×2738 = 444×913 CSS @3x）；
   图标与强调色按《产品UI和UX开发文档》Part 1 §1.2/§1.3：
   默认 #9B9B9E、激活 #2D8CFF、描边 1.5px、一级 20px / 二三级 18px。 */
/* 字体与剪辑页、设计稿同一套（design/assets/base.css 同样声明）：
   拉丁/数字用 Instrument Sans + JetBrains Mono，中文回落到系统 Noto Sans CJK。 */
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Bold.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Bold.ttf") format("truetype"); }

:root {
  --bg-void: #000000;
  --bg-dock: #111413;
  --bg-timeline: #151817;
  --bg-app: #18191B;
  --bg-toolbar: #1C1D1F;
  --bg-stage: #232323;

  --panel-2: #202224;   /* 二级工具栏（文档 #2A2A2D 系列） */
  --panel-3: #26282A;   /* 三级面板 */

  --line-1: #26282A;
  --line-2: #34373A;
  --line-3: #3A3A3D;

  --text-hi: #F2F2F2;
  --text-mid: #9B9B9E;
  --text-low: #6A6E70;

  --accent: #2D8CFF;
  --accent-soft: rgba(45, 140, 255, .22);    /* 文档全局唯一强调色 */
  --danger: #E5484D;    /* 文档警示色 */

  --font: "Instrument Sans", "Noto Sans CJK SC", -apple-system, "PingFang SC", sans-serif;
  --font-num: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* NairoClip Mobile · 首页 / 我的（设置）共用样式
   配色沿用 tokens.css：深色、无彩色强调、图标线性 1.5px。
   布局单位用 clamp/vw，与剪辑页保持一致的自适应策略。 */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg-app); font-family: var(--font); color: var(--text-hi);
       display: flex; justify-content: center; overflow: hidden; }

.screen { position: relative; width: 100%; height: 100vh; height: 100dvh;
          display: flex; flex-direction: column; overflow: hidden;
          padding-bottom: env(safe-area-inset-bottom, 0px); }
.i { width: 20px; height: 20px; display: block; }

/* ---------- 顶栏 ---------- */
.hd { flex: none; height: clamp(44px, 5.4vh, 56px); display: flex;
      align-items: center; padding: 0 14px; gap: 8px; }
.hd h1 { margin: 0; font-size: clamp(17px, 4.6vw, 20px); font-weight: 700; letter-spacing: -.3px; }
.hd .sp { flex: 1; }
.hd-btn { width: 34px; height: 34px; border: 0; background: transparent;
          color: #C8CDCB; display: grid; place-items: center; padding: 0; }
.hd-btn .i { width: 20px; height: 20px; }

/* ---------- 滚动区 ---------- */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
          -webkit-overflow-scrolling: touch; padding: 0 14px 12px; }
.scroll::-webkit-scrollbar { width: 0; }

/* ---------- 开始创作卡 ---------- */
.create { width: 100%; border: 1px dashed #3A3E40; border-radius: 12px;
          background: linear-gradient(180deg, #202325, #1B1E20);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 8px; padding: clamp(20px, 4.6vh, 34px) 12px; color: #EDF0EE; }
.create .plus { width: 38px; height: 38px; border-radius: 50%;
                border: 1px solid #4A4F52; display: grid; place-items: center; }
.create .plus .i { width: 20px; height: 20px; }
.create b { font-size: 15px; font-weight: 600; }
.create span { font-size: 11px; color: var(--text-low); }

/* ---------- 四宫格快捷入口 ---------- */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.q { border: 0; background: transparent; display: flex; flex-direction: column;
     align-items: center; gap: 7px; padding: 10px 4px; color: #D4D9D7; }
.q .box { width: 42px; height: 42px; border-radius: 11px; background: #24282A;
          display: grid; place-items: center; }
.q .box .i { width: 21px; height: 21px; }
.q span { font-size: 11px; }

/* ---------- 区块标题 ---------- */
.sec { display: flex; align-items: center; margin: 18px 2px 9px; }
.sec h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: #E8EBE9; }
.sec .count { color: var(--text-low); font-weight: 500; }
.sec .sp { flex: 1; }
.sec button { border: 0; background: transparent; color: var(--text-mid);
              font-family: var(--font); font-size: 12px; padding: 4px 2px; }

/* ---------- 草稿网格 ---------- */
.drafts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { position: relative; border: 0; background: transparent; padding: 0;
        display: flex; flex-direction: column; gap: 6px; text-align: left; }
.card .thumb { position: relative; width: 100%; aspect-ratio: 9 / 14; border-radius: 9px;
               overflow: hidden; background: linear-gradient(160deg, #2A2F32, #1C2022); }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .dur { position: absolute; right: 5px; bottom: 5px; padding: 2px 5px; border-radius: 3px;
             background: rgba(0,0,0,.66); font: 600 9.5px/1.4 var(--font-num); color: #F0F2F0; }
.card .title { font-size: 12px; color: #E6E9E7; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
.card .meta { font-size: 10px; color: #6E7472; }
.card .check { position: absolute; left: 6px; top: 6px; width: 18px; height: 18px;
               border-radius: 50%; border: 1.5px solid #FFFFFF; background: rgba(0,0,0,.4);
               display: none; place-items: center; }
.managing .card .check { display: grid; }
.card.picked .check { background: #FFFFFF; }
.card.picked .check::after { content: ""; width: 8px; height: 4px; border-left: 1.6px solid #111;
                             border-bottom: 1.6px solid #111; transform: rotate(-45deg) translateY(-1px); }

/* ---------- 空态 ---------- */
.empty { display: flex; flex-direction: column; align-items: center; gap: 9px;
         padding: 40px 10px; color: #5A605E; }
.empty .i { width: 30px; height: 30px; opacity: .6; }
.empty p { margin: 0; font-size: 12px; }
.empty small { font-size: 10.5px; color: #4B504E; }

/* ---------- 底部 Tab ---------- */
.tabs { flex: none; height: clamp(50px, 6.4vh, 62px); display: grid;
        grid-template-columns: repeat(4, 1fr); background: #101312;
        border-top: 1px solid #1E2221; }
.tab { border: 0; background: transparent; display: flex; flex-direction: column;
       align-items: center; justify-content: center; gap: 4px;
       color: #686E6C; font-family: var(--font); font-size: 10px; padding: 0; }
.tab .i { width: 21px; height: 21px; }
.tab.on { color: #FFFFFF; }

/* ---------- 我的：用户卡 ---------- */
.user { display: flex; align-items: center; gap: 12px; padding: 14px 2px 6px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; flex: none;
          background: linear-gradient(150deg, #3A4043, #23282A);
          display: grid; place-items: center; color: #C9CFCC; font-size: 19px; font-weight: 700;
          border: 1px solid #3A3F42; }
.user .info { min-width: 0; }
.user .name { font-size: 15px; font-weight: 600; }
.user .id { font-size: 10.5px; color: #6E7472; margin-top: 4px; font-family: var(--font-num); }
.bind { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px;
        font-size: 10.5px; color: #C9CDCB; border: 1px solid #3A3F42;
        border-radius: 10px; padding: 3px 8px; background: transparent; }

/* ---------- 会员卡（银描边，无金色，按文档） ---------- */
.vip { width: 100%; margin-top: 12px; border-radius: 11px; padding: 13px 14px;
       background: #1E2224; border: 1px solid #4A4F52;
       display: flex; align-items: center; gap: 10px; }
.vip .vip-ico { flex: none; width: 19px; height: 19px; color: #C9CFCC; }
.vip .txt { text-align: left; flex: 1 1 auto; min-width: 0; }
.vip b { display: block; font-size: 13.5px; color: #F2F4F2; }
.vip small { display: block; margin-top: 4px; font-size: 10.5px; color: #8B918F; }
.vip .go { margin-left: auto; font-size: 11.5px; color: #E8EBE9; white-space: nowrap; }

/* ---------- 列表分组 ---------- */
.group { margin-top: 14px; background: #1A1D1F; border: 1px solid #262A2C;
         border-radius: 11px; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 10px;
       padding: 14px 13px; border: 0; background: transparent; color: #E7EAE8;
       font-family: var(--font); font-size: 13px; text-align: left; }
.row + .row { border-top: 1px solid #232728; }
.row .i { width: 18px; height: 18px; color: #9BA19E; flex: none; }
.row .val { margin-left: auto; font-size: 11.5px; color: #7C8280; font-family: var(--font-num); }
.row .chev { width: 14px; height: 14px; color: #565C5A; margin-left: 4px; }
.row.danger { color: var(--danger); }

/* 手风琴 */
.acc-body { display: none; padding: 0 13px 13px; }
.group.open .acc-body { display: block; }
.group.open .row .chev { transform: rotate(90deg); }
.acc-body .line { display: flex; align-items: center; font-size: 11.5px; color: #8B918F;
                  padding: 6px 0; }
.acc-body .line .val { margin-left: auto; font-family: var(--font-num); }

/* <button class="line"> 需要显式抹掉浏览器原生按钮外观，
   否则在展开区会渲染成白底黑框（Safari/WebKit 默认） */
button.line {
  width: 100%;
  border: 0;
  background: transparent;
  font-family: var(--font);
  font-size: 11.5px;
  color: #8B918F;
  text-align: left;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
button.line:active { color: #C4CAC8; }
button.line + button.line { border-top: 1px solid #22262a; }

/* 下拉选择（设置页通用/外观） */
.sel {
  margin-left: auto;
  max-width: 58%;
  height: 26px;
  padding: 0 22px 0 8px;
  border: 1px solid #2C3133;
  border-radius: 7px;
  background-color: #1A1B1E;
  /* 自绘箭头：避免各平台原生 select 外观差异 */
  background-image: linear-gradient(45deg, transparent 50%, #8B918F 50%),
                    linear-gradient(135deg, #8B918F 50%, transparent 50%);
  background-position: right 12px center, right 8px center;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  -webkit-appearance: none;
  appearance: none;
  color: #C9CFCC;
  font-family: var(--font);
  font-size: 11.5px;
  text-align: right;
  cursor: pointer;
}
.sel:focus { outline: 1px solid #3D4A46; border-color: #3D4A46; }

/* 危险操作行（退出登录 / 清除数据） */
button.line.danger,
button.line.danger .val { color: #E5484D; }
button.line.danger:active { color: #FF6B6F; }

/* 说明性小字行（不是可点项） */
.acc-body .line.note-line {
  display: block;
  color: #5F6563;
  font-size: 10.5px;
  line-height: 1.65;
  padding-top: 2px;
}

/* 开关 */
.sw {
  margin-left: auto;
  flex: none;
  width: 38px; height: 22px;
  padding: 0;
  border: 0; border-radius: 11px;
  background: #2C3133;
  position: relative;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background .16s ease;
}
.sw::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #8B918F;
  transition: transform .16s ease, background .16s ease;
}
.sw[aria-pressed="true"] { background: #3A4144; }
.sw[aria-pressed="true"]::after { transform: translateX(16px); background: #E6EAE8; }
.bar { height: 4px; border-radius: 2px; background: #2C3133; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: #C9CFCC; }

/* ---------- 退出登录 ---------- */
.logout { width: 100%; margin: 18px 0 6px; padding: 13px; border-radius: 11px;
          border: 1px solid #3A2626; background: transparent; color: var(--danger);
          font-family: var(--font); font-size: 13px; }
.copy { text-align: center; color: #4E5452; font-size: 10px; padding: 10px 0 18px; }

/* ---------- 小屏兜底 ---------- */
@media (max-width: 360px) {
  .scroll { padding: 0 10px 10px; }
  .drafts { gap: 8px; }
  .card .title { font-size: 11px; }
  .row { padding: 12px 11px; font-size: 12.5px; }
  .q .box { width: 38px; height: 38px; }
}

/* hidden 必须彻底隐藏，避免空态与网格同时出现 */
.drafts[hidden], .empty[hidden] { display: none !important; }

</style>
</head>

    <div class="group">
      <button class="row" data-open="help">

        <div class="line">常见问题<span class="val">›</span></div>
      </div>
    </div>

    <div class="group">
      <button class="row" data-open="about">
        <svg class="i"><use href="#i-info"/></svg>

    <button class="logout" id="btn-logout">退出登录</button>

  </div>

    /* --- 品牌图标（第三方登录）

       见下方 BRAND_SET。 */
    'i-brand-wechat': '<path fill-rule="evenodd" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/>',
    'i-brand-qq': '<path fill-rule="evenodd" d="M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.078-.132.132-.458-.301-.778-.483-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673"/>',
    'i-brand-apple': '<path fill-rule="evenodd" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>'
  };

  /* 填充型图标集合：只吃 fill，不吃描边，否则空心轮廓会失真 */
  const BRAND_SET = new Set(['i-brand-wechat', 'i-brand-qq', 'i-brand-apple']);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  svg.innerHTML = '<defs>' + Object.entries(P).map(([id, d]) =>
    (BRAND_SET.has(id)
      ? `<symbol id="${id}" viewBox="0 0 24 24" fill="currentColor" stroke="none">${d}</symbol>`
      : `<symbol id="${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
        `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</symbol>`)
  ).join('') + '</defs>';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(svg));
})();

</script>
<script>
/* NairoClip Mobile · 我的（设置）
   原则：权益、存储、引擎状态一律读真实值；读不到就显示“—”，不编造。 */
'use strict';

const M = {
  base: (new URLSearchParams(location.search).get('api')
         || window.NC_API_BASE || location.origin),
  state: null,
  models: null
};

const $ = (id) => document.getElementById(id);

function toast(text, ms = 1900) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  d.style.cssText = 'position:absolute;left:50%;bottom:90px;transform:translateX(-50%);'
    + 'background:rgba(28,31,33,.97);border:1px solid #35393C;color:#E9EBE8;'
    + 'font-size:11px;padding:9px 14px;border-radius:8px;z-index:120;max-width:78%;'
    + 'text-align:center;line-height:1.5';
  document.querySelector('.screen').appendChild(d);
  setTimeout(() => d.remove(), ms);
}

/* 读桥（同步，无网络）。桥不存在的环境如实失败。 */
function bridge() {
  const b = window.NCEngine;
  return (b && typeof b.call === 'function') ? b : null;
}
function readState() {
  const b = bridge();
  if (!b || typeof b.state !== 'function') throw new Error('无引擎桥');
  const raw = b.state();
  return (raw && typeof raw === 'object') ? raw : JSON.parse(String(raw || '{}'));
}

const mb = (bytes) => {
  if (!bytes && bytes !== 0) return '—';
  const m = bytes / (1024 * 1024);
  return m >= 1024 ? `${(m / 1024).toFixed(1)} GB` : `${m.toFixed(1)} MB`;
};

/* ---------- 读取真实状态 ---------- */
async function load() {
  // 静态快照（单文件）
  if (window.NC_STATIC_STATE) {
    M.state = window.NC_STATIC_STATE;
    applyState();
    applyStaticModels();
    return;
  }
  try {
    M.state = readState();
    applyState();
  } catch (err) {
    $('st-note').textContent = `未连接引擎：${err.message}`;
  }
  try {
    const b = bridge();
    if (!b || typeof b.models !== 'function') throw new Error('无模型接口');
    const raw = b.models();
    M.models = (raw && typeof raw === 'object') ? raw : JSON.parse(String(raw || '{}'));
    applyModels();
  } catch (err) { /* 模型接口不可用则保持“—” */ }
}

function applyState() {
  const p = (M.state && M.state.project) || {};
  // 权益：0 = Free，非 0 = Pro（引擎 nc_get_entitlement）
  const pro = !!p.entitlement;
  $('vip-state').textContent = pro ? '已开通 ›' : '未开通 ›';
  $('about-ai').textContent = p.ai_engine_available
    ? `${p.ai_engine_version || '就绪'}` : '不可用';
  // 版本号来自打包脚本注入的 window.NC_APP_VERSION；
  // C ABI 没有版本查询接口，拿不到就显示「—」，不编造。
  const ver = window.NC_APP_VERSION || '';
  if ($('about-ver')) $('about-ver').textContent = ver || '';
  if ($('about-build')) $('about-build').textContent = ver || '—';
  $('acc-phone').textContent = '未绑定';
  if (p.ai_engine_note) $('st-note').textContent = p.ai_engine_note;
}

function applyModels() {
  const st = (M.models && M.models.storage) || {};
  const proxyBytes = st.proxy_bytes || 0;
  const ready = st.proxy_ready || 0;
  $('st-proxy').textContent = proxyBytes ? mb(proxyBytes) : `${ready} 个`;
  if (proxyBytes) $('st-bar').style.width = '28%';
}

async function applyStaticModels() {
  const s = window.NC_STATIC_MODELS;
  if (!s) return;
  const st = s.storage || {};
  $('st-model').textContent = mb(st.model_bytes || 0);
  $('st-proxy').textContent = mb(st.proxy_bytes || 0);
  $('st-draft').textContent = mb(st.draft_bytes || 0);
  $('storage-val').textContent = mb((st.model_bytes || 0) + (st.proxy_bytes || 0) + (st.draft_bytes || 0));
  $('st-bar').style.width = `${Math.min(100, s.used_percent || 6)}%`;
  $('st-note').textContent = s.note || '统计来自本地目录扫描';
}

/* ---------- 手风琴 ---------- */
document.querySelectorAll('[data-open]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const group = btn.closest('.group');
    const opened = group.classList.contains('open');
    document.querySelectorAll('.group.open').forEach((g) => {
      if (g !== group) g.classList.remove('open');
    });
    group.classList.toggle('open', !opened);
  });
});

/* ---------- 事件 ---------- */
$('btn-back').addEventListener('click', () => {
  const q = new URLSearchParams(location.search).get('api');
  location.href = `01-home.html${q ? `?api=${encodeURIComponent(q)}` : ''}`;
});

$('btn-vip').addEventListener('click', () => toast('会员购买页：待接入平台内购', 2000));

/* 绑定/登录：未登录先去登录页 */
$('btn-bind').addEventListener('click', () => {
  const q = new URLSearchParams(location.search).get('api');
  location.href = `03-auth.html${q ? `?api=${encodeURIComponent(q)}` : ''}`;
});

$('btn-logout').addEventListener('click', () => {
  const ok = window.confirm('退出后本地草稿仍保留，确认退出登录？');
  if (!ok) return;
  try {
    localStorage.setItem('nairoclip.user', JSON.stringify({ loggedIn: false }));
  } catch (e) {}
  toast('已退出登录', 1500);
  paintUser();
});

document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => {
    if (t.dataset.tab === 'home') {
      const q = new URLSearchParams(location.search).get('api');
      location.href = `01-home.html${q ? `?api=${encodeURIComponent(q)}` : ''}`;
      return;
    }
    toast('功能开发中', 1500);
  });
});


/* ---------- 登录态 ---------- */
function paintUser() {
  let u = null;
  try { u = JSON.parse(localStorage.getItem('nairoclip.user') || 'null'); } catch (e) {}
  const logged = !!(u && u.loggedIn);
  const nameEl = $('nickname');
  const uidEl = $('uid');
  const avEl = $('avatar');
  const bindEl = $('btn-bind');
  if (nameEl) nameEl.textContent = logged ? (u.nickname || '创作者') : '未登录';
  if (uidEl) uidEl.textContent = logged ? `ID: ${u.uid || '—'}` : 'ID: —';
  if (avEl) avEl.textContent = logged ? (u.nickname || 'N').slice(0, 1) : 'N';
  if (bindEl) {
    bindEl.textContent = logged
      ? `${u.phone || '已绑定'} · 账号与安全`
      : '未绑定手机号 · 去登录';
  }
  const vip = $('vip-state');
  if (vip) vip.textContent = (logged && u.tier > 0) ? '已开通 ›' : '未开通 ›';
}

paintUser();

/* ---------- 启动 ---------- */
(async function boot() {
  await load();
})();

</script>
</body>
