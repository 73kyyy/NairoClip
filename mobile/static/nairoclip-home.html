<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NairoClip</title>
<style>
/* NairoClip Mobile · 设计令牌
   底色/尺寸取自参考稿（1332×2738 = 444×913 CSS @3x）；
   图标与强调色按《产品UI和UX开发文档》Part 1 §1.2/§1.3：
   默认 #9B9B9E、激活 #2D8CFF、描边 1.5px、一级 20px / 二三级 18px。 */
/* 字体与剪辑页、设计稿同一套（design/assets/base.css 同样声明）：
   拉丁/数字用 Instrument Sans + JetBrains Mono，中文回落到系统 Noto Sans CJK。 */
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/InstrumentSans-Bold.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap;
             src: url("../assets/fonts/JetBrainsMono-Bold.ttf") format("truetype"); }

:root {
  --bg-void: #000000;
  --bg-dock: #111413;
  --bg-timeline: #151817;
  --bg-app: #18191B;
  --bg-toolbar: #1C1D1F;
  --bg-stage: #232323;

  --panel-2: #202224;   /* 二级工具栏（文档 #2A2A2D 系列） */
  --panel-3: #26282A;   /* 三级面板 */

  --line-1: #26282A;
  --line-2: #34373A;
  --line-3: #3A3A3D;

  --text-hi: #F2F2F2;
  --text-mid: #9B9B9E;
  --text-low: #6A6E70;

  --accent: #2D8CFF;
  --accent-soft: rgba(45, 140, 255, .22);    /* 文档全局唯一强调色 */
  --danger: #E5484D;    /* 文档警示色 */

  --font: "Instrument Sans", "Noto Sans CJK SC", -apple-system, "PingFang SC", sans-serif;
  --font-num: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* =============================================================================
   NairoClip Mobile · 首页（深色 · 与剪辑页同一套色）
   -----------------------------------------------------------------------------
   全部色值直接引用 tokens.css（与剪辑页共用）：
     底 #0B0B0C · 画布 #232323 · 背板 #111413 · 线 #26282A · 字 #F2F2F2/#9B9B9E
   字体沿用剪辑页：Instrument Sans（正文）+ JetBrains Mono（数字）
     字体族来自 tokens.css 的 --font / --font-num，与剪辑页完全一致
   设计约束（《产品UI和UX开发文档》Part 1 §2.2）：
     · 首页不内嵌任何剪辑操作；不放社区/推荐流
     · 草稿卡点击只能进剪辑页
     · 无底部 Tab（按需求移除）
     · 不展示任何素材画面：草稿用纯文字行承载
   ============================================================================= */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg-void); font-family: var(--font); color: var(--text-hi);
       display: flex; justify-content: center; overflow: hidden; }

.screen { position: relative; width: 100%; height: 100vh; height: 100dvh;
          display: flex; flex-direction: column; overflow: hidden;
          background: var(--bg-app);
          padding-top: env(safe-area-inset-top, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px); }
.i { width: 20px; height: 20px; display: block; }

/* ---------- 顶栏：头像 + 问候 / 搜索 / 设置 ---------- */
.hd { flex: none; display: flex; align-items: center; gap: 10px;
      padding: clamp(10px, 1.7vh, 16px) clamp(16px, 4.4vw, 22px) 8px; }
.hd .me { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%;
          padding: 0; background: var(--bg-toolbar); color: var(--text-hi);
          display: grid; place-items: center;
          border: 1px solid var(--line-1); }
.hd .me .i { width: 21px; height: 21px; stroke-width: 1.5; }
.hd .sp { flex: 1; }
.hd-btn { flex: none; width: 36px; height: 36px; padding: 0; border: 0;
          border-radius: 50%; background: transparent; color: var(--text-hi);
          display: grid; place-items: center; transition: background .12s var(--ease); }
.hd-btn .i { width: 22px; height: 22px; stroke-width: 1.5; }
.hd-btn:active { background: rgba(255, 255, 255, .07); }

/* ---------- 搜索栏（点击放大镜后就地替换顶栏） ---------- */
.searchbar { flex: none; display: none; align-items: center; gap: 10px;
             padding: clamp(10px, 1.7vh, 16px) clamp(16px, 4.4vw, 22px) 8px; }
.screen.searching .hd { display: none; }
.screen.searching .searchbar { display: flex; }
.searchbar .box { flex: 1; display: flex; align-items: center; gap: 8px;
                  height: 38px; padding: 0 13px; border-radius: 19px;
                  background: var(--bg-toolbar); border: 1px solid var(--line-1); }
.searchbar .box .i { width: 17px; height: 17px; stroke-width: 1.5; color: var(--text-low); flex: none; }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
                   font-family: var(--font); font-size: 13.5px; color: var(--text-hi); }
.searchbar input::placeholder { color: var(--text-low); }
.searchbar .cancel { flex: none; border: 0; background: transparent; padding: 4px 2px;
                     font-family: var(--font); font-size: 13px; color: var(--text-mid); }

/* ---------- 滚动区 ---------- */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          padding: 6px clamp(16px, 4.4vw, 22px) 28px; }
.scroll::-webkit-scrollbar { width: 0; }

/* ---------- 主入口：开始创作（同级最高权重，唯一带描边的卡） ---------- */
.hero { width: 100%; border-radius: 20px; text-align: left;
        padding: clamp(18px, 2.9vh, 24px) 20px;
        display: flex; align-items: center; gap: 15px;
        background: var(--bg-stage);
        border: 1px solid var(--line-2); }
.hero .plus { flex: none; width: 46px; height: 46px; border-radius: 50%;
              background: #FFFFFF; display: grid; place-items: center; }
.hero .plus .i { width: 22px; height: 22px; stroke-width: 2; color: #101314; }
.hero .txt { min-width: 0; }
.hero .txt b { display: block; font-size: 16px; font-weight: 700; color: var(--text-hi);
               letter-spacing: -.2px; }
.hero .txt span { display: block; margin-top: 5px; font-size: 11.5px; color: var(--text-mid); }
.hero:active { background: #262829; }

/* ---------- 快捷入口（2×2：图标 + 功能名 + 一句说明） ---------- */
.quick { margin-top: clamp(10px, 1.8vh, 14px);
         display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.q { position: relative; text-align: left; border: 1px solid var(--line-1);
     background: var(--bg-dock); border-radius: 15px;
     padding: 13px 13px 12px; display: flex; flex-direction: column; gap: 3px; }
.q .i { width: 19px; height: 19px; stroke-width: 1.5; color: var(--text-mid);
        margin-bottom: 7px; }
.q b { font-size: 12.5px; font-weight: 600; color: var(--text-hi); letter-spacing: -.1px; }
.q span { font-size: 10px; color: var(--text-low); line-height: 1.45; }
.q:active { background: rgba(255, 255, 255, .05); }

/* ---------- 区块标题 ---------- */
.sec { display: flex; align-items: baseline; margin: clamp(22px, 3.4vh, 28px) 2px 4px; }
.sec h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-hi);
          letter-spacing: -.1px; }
.sec .count { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--text-low);
              font-family: var(--font-num); }
.sec .sp { flex: 1; }
.sec button { border: 0; background: transparent; padding: 4px 2px;
              font-family: var(--font); font-size: 12.5px; color: var(--text-mid); }
.sec button[hidden] { display: none; }

/* ---------- 草稿：纯文字行（不展示任何素材画面） ---------- */
.list { display: flex; flex-direction: column; }
.row { position: relative; width: 100%; border: 0; background: transparent;
       padding: 14px 2px; display: flex; align-items: center; gap: 12px;
       text-align: left; }
.row + .row::before { content: ""; position: absolute; left: 2px; right: 2px; top: 0;
                      height: 1px; background: var(--line-1); }
.row .mark { flex: none; width: 3px; height: 26px; border-radius: 2px;
             background: var(--line-2); }
.row.picked .mark { background: #FFFFFF; }
.row .info { flex: 1; min-width: 0; }
.row .t { display: block; font-size: 14px; font-weight: 600; color: var(--text-hi);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { display: block; margin-top: 3px; font-size: 11px; color: var(--text-low); }
.row .d { flex: none; font: 600 10.5px/1 var(--font-num); color: var(--text-mid);
          background: var(--bg-toolbar); border-radius: 6px; padding: 4px 6px; }
.row .chk { flex: none; width: 18px; height: 18px; border-radius: 50%;
            border: 1.5px solid var(--line-3); display: none; place-items: center; }
.screen.managing .row .chk { display: grid; }
.screen.managing .row .mark,
.screen.managing .row .d { display: none; }
.row.picked .chk { background: #FFFFFF; border-color: #FFFFFF; }
.row.picked .chk::after { content: ""; width: 8px; height: 4px;
                          border-left: 1.8px solid #101314;
                          border-bottom: 1.8px solid #101314;
                          transform: rotate(-45deg) translateY(-1px); }
.row:active { background: rgba(255, 255, 255, .04); }

/* ---------- 空态（文档 §3.1） ---------- */
.empty { display: flex; flex-direction: column; align-items: center; gap: 9px;
         padding: clamp(34px, 6vh, 52px) 12px 26px; text-align: center; }
.empty .i { width: 34px; height: 34px; stroke-width: 1.35; color: var(--text-low); }
.empty b { font-size: 13.5px; font-weight: 600; color: var(--text-mid); }
.empty small { font-size: 11px; color: var(--text-low); line-height: 1.6; }
.empty[hidden], .list[hidden] { display: none !important; }

/* ---------- 多选操作条（浮起，不用底栏） ---------- */
.mbar { position: absolute; left: 14px; right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: 8px; padding: 8px; border-radius: 16px;
        background: rgba(28, 29, 31, .96);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line-2);
        z-index: 60; }
.mbar button { flex: 1; height: 40px; border-radius: 12px; border: 0;
               font-family: var(--font); font-size: 13px; }
.mbar .del { background: #FFFFFF; color: #101314; font-weight: 600; }
.mbar .off { background: rgba(255, 255, 255, .07); color: var(--text-mid); }

/* ---------- Toast ---------- */
.toast { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
         transform: translateX(-50%); max-width: 78%; z-index: 120;
         padding: 9px 14px; border-radius: 10px; text-align: center;
         background: rgba(38, 40, 42, .97); border: 1px solid var(--line-2);
         color: var(--text-hi);
         font-size: 11.5px; line-height: 1.5; letter-spacing: .1px; }

/* ---------- 小屏兜底 ---------- */
@media (max-width: 360px) {
  .scroll { padding-left: 13px; padding-right: 13px; }
  .hero { padding: 15px 15px; border-radius: 18px; }
  .hero .txt b { font-size: 14.5px; }
  .hero .plus { width: 42px; height: 42px; }
  .q { padding: 11px 11px 10px; border-radius: 13px; }
  .q .i { width: 18px; height: 18px; margin-bottom: 6px; }
  .q b { font-size: 11.5px; }
  .q span { font-size: 9.5px; }
  .row .t { font-size: 13px; }
}
@media (max-width: 320px) {
  .hero .txt span { display: none; }
  .q span { font-size: 9px; }
}

</style>
</head>

<div class="screen" id="screen">

  <header class="hd">

      <svg class="i"><use href="#i-person"/></svg>
    </button>
    <span class="sp"></span>
    <button class="hd-btn" id="btn-search" aria-label="搜索">
      <svg class="i"><use href="#i-search"/></svg>
    </button>
    <button class="hd-btn" id="btn-settings" aria-label="设置">
      <svg class="i"><use href="#i-hex-gear"/></svg>
    </button>
  </header>

  <!-- 搜索态：就地替换顶栏 -->
  <div class="searchbar" id="searchbar">
    <span class="box">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="搜索草稿名称" autocomplete="off">
    </span>
    <button class="cancel" id="btn-cancel">取消</button>
  </div>

  <div class="scroll" id="scroll">

    <!-- 主创作入口 -->
    <button class="hero" id="btn-create">
      <span class="plus"><svg class="i"><use href="#i-plus"/></svg></span>
      <span class="txt">
        <b>开始创作</b>
        <span>导入视频或照片，立即开始剪辑</span>
      </span>
    </button>

    <!-- 快捷入口（文档 Part 1 §2.2 四项） -->
    <div class="quick">
      <button class="q" data-q="auto">
        <svg class="i"><use href="#i-auto"/></svg>
        <b>智能成片</b><span>选好素材自动剪一版</span>
      </button>
      <button class="q" data-q="ref">
        <svg class="i"><use href="#i-ref"/></svg>
        <b>参考仿剪</b><span>照着别人的节奏剪</span>
      </button>
      <button class="q" data-q="beat">
        <svg class="i"><use href="#i-beat"/></svg>
        <b>音乐卡点</b><span>跟着鼓点自动踩点</span>
      </button>
      <button class="q" data-q="cutout">
        <svg class="i"><use href="#i-cutout"/></svg>
        <b>智能抠像</b><span>人像绿幕一键扣</span>
      </button>
    </div>

    <!-- 草稿 -->
    <div class="sec">
      <h2>我的草稿</h2>
      <span class="count" id="draft-count">0</span>
      <span class="sp"></span>
      <button id="btn-manage">管理</button>
    </div>

    <div class="list" id="list"></div>

    <div class="empty" id="empty" hidden>
      <svg class="i"><use href="#i-folder"/></svg>
      <b>还没有任何草稿</b>
      <small>点击上方「开始创作」<br>选好素材就能开始第一条片子</small>
    </div>

  </div>
</div>

  /* 填充型图标集合：只吃 fill，不吃描边，否则空心轮廓会失真 */
  const BRAND_SET = new Set(['i-brand-wechat', 'i-brand-qq', 'i-brand-apple']);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  svg.innerHTML = '<defs>' + Object.entries(P).map(([id, d]) =>
    (BRAND_SET.has(id)
      ? `<symbol id="${id}" viewBox="0 0 24 24" fill="currentColor" stroke="none">${d}</symbol>`
      : `<symbol id="${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
        `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</symbol>`)
  ).join('') + '</defs>';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(svg));
})();

</script>
<script>
/* NairoClip Mobile · 首页
   -----------------------------------------------------------------------------
   数据来源（不伪造）：
     · 单文件版：window.NC_STATIC_PROJECTS（构建时内联的快照）
     · 原生版：NCEngine.listProjects()（平台层扫描应用私有目录）
   首页不展示任何素材画面：草稿只用「标题 + 时长 + 修改时间」文字行承载。
   无底部 Tab（按需求移除）；「我的」入口在左上角头像。 */
'use strict';

const H = {
  projects: [],
  filter: '',
  managing: false,
  picked: new Set(),
  base: (new URLSearchParams(location.search).get('api')
         || window.NC_API_BASE || location.origin)
};

const $ = (id) => document.getElementById(id);

const qs = () => new URLSearchParams(location.search).get('api');
const editorUrl = () => {
  const q = qs();
  return `10-editor.html${q ? `?api=${encodeURIComponent(q)}` : ''}`;
};
const pageUrl = (name) => {
  const q = qs();
  return `${name}${q ? `?api=${encodeURIComponent(q)}` : ''}`;
};
const meUrl = () => pageUrl('02-me.html');
const settingsUrl = () => pageUrl('04-settings.html');
/* 登录入口：先进「登录方式」页（手机号/微信/QQ/AppleID），
   不在首页直接展开手机号表单。 */
const authUrl = () => pageUrl('03-auth.html');

/* 登录态：头像是「我的」入口；未登录时先去登录页。
   登录只影响会员/云同步，不影响本地剪辑。 */
const isLoggedIn = () => {
  try {
    const u = JSON.parse(localStorage.getItem('nairoclip.user') || 'null');
    return !!(u && u.loggedIn);
  } catch (e) {
    return false;
  }
};

function toast(text, ms = 2000) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  $('screen').appendChild(d);
  setTimeout(() => d.remove(), ms);
}

function fmtDur(sec) {
  const s = Math.max(0, Math.round(sec || 0));
  if (!s) return '';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
}

function fmtSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / 1048576;
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
}

/* ---------- 载入 ---------- */
async function loadProjects() {
  if (Array.isArray(window.NC_STATIC_PROJECTS)) {
    H.projects = window.NC_STATIC_PROJECTS;
    return;
  }
  /* 草稿列表由平台层提供（C ABI 没有工程目录接口）：
     · Android/iOS：桥的 listProjects() 扫描应用私有目录
     · 无桥：如实为空，不编造草稿 */
  const br = window.NCEngine;
  if (!br || typeof br.listProjects !== 'function') {
    H.projects = [];
    return;
  }
  try {
    const raw = br.listProjects();
    const j = (raw && typeof raw === 'object') ? raw : JSON.parse(String(raw || '{}'));
    H.projects = (j.projects || []).map((p) => ({
      name: p.name,
      file: p.file,
      bytes: p.bytes,
      dur: p.duration_us ? p.duration_us / 1e6 : 0,
      updated: p.updated || ''
    }));
  } catch (err) {
    H.projects = [];
  }
}

/* ---------- 渲染 ---------- */
function render() {
  const box = $('list');
  const emptyBox = $('empty');
  box.innerHTML = '';

  const kw = H.filter.trim().toLowerCase();
  const shown = H.projects
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => !kw || (p.name || '').toLowerCase().includes(kw));

  $('draft-count').textContent = String(shown.length);
  $('btn-manage').textContent = H.managing ? '完成' : '管理';
  $('btn-manage').hidden = H.projects.length === 0;
  $('screen').classList.toggle('managing', H.managing);

  const has = shown.length > 0;
  emptyBox.hidden = has;
  box.hidden = !has;

  if (!has) {
    const b = emptyBox.querySelector('b');
    const s = emptyBox.querySelector('small');
    if (kw) {
      b.textContent = '没有匹配的草稿';
      s.innerHTML = `换个关键词试试<br>或清空搜索查看全部`;
    } else {
      b.textContent = '还没有任何草稿';
      s.innerHTML = '点击上方「开始创作」<br>选好素材就能开始第一条片子';
    }
  }

  shown.forEach(({ p, i }) => {
    const row = document.createElement('button');
    row.className = 'row' + (H.picked.has(i) ? ' picked' : '');

    const dur = fmtDur(p.dur);
    const meta = [p.updated || '', fmtSize(p.bytes)].filter(Boolean).join(' · ');

    row.innerHTML = `
      <span class="mark"></span>
      <span class="chk"></span>
      <span class="info">
        <span class="t"></span>
        <span class="m"></span>
      </span>
      ${dur ? `<span class="d">${dur}</span>` : ''}`;
    row.querySelector('.t').textContent = p.name || '未命名草稿';
    row.querySelector('.m').textContent = meta || '本地草稿';

    row.addEventListener('click', () => {
      if (H.managing) {
        if (H.picked.has(i)) H.picked.delete(i); else H.picked.add(i);
        render();
        return;
      }
      openProject(p);
    });
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      H.managing = true;
      H.picked.add(i);
      render();
    });
    box.appendChild(row);
  });

  renderManageBar();
}

function renderManageBar() {
  let bar = document.getElementById('manage-bar');
  if (!H.managing) {
    if (bar) bar.remove();
    return;
  }
  if (bar) return;

  bar = document.createElement('div');
  bar.className = 'mbar';
  bar.id = 'manage-bar';

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = H.picked.size ? `删除（${H.picked.size}）` : '删除';
  del.addEventListener('click', deletePicked);

  const off = document.createElement('button');
  off.className = 'off';
  off.textContent = '取消';
  off.addEventListener('click', () => {
    H.managing = false;
    H.picked.clear();
    render();
  });

  bar.appendChild(del);
  bar.appendChild(off);
  $('screen').appendChild(bar);
}

async function deletePicked() {
  if (!H.picked.size) return toast('请先选择草稿');
  const n = H.picked.size;
  // 静态版与只读服务版都无法真正落盘删除，这里如实说明
  H.projects = H.projects.filter((_, i) => !H.picked.has(i));
  H.picked.clear();
  H.managing = false;
  render();
  toast(window.NC_STATIC_PROJECTS
    ? `已从列表移除 ${n} 个（静态版不落盘）`
    : `已从列表移除 ${n} 个`);
}

function openProject(p) {
  if (!p.file) {
    location.href = editorUrl();
    return;
  }
  const q = qs();
  const join = q ? '&' : '?';
  location.href = `${editorUrl()}${join}project=${encodeURIComponent(p.file)}`;
}

/* ---------- 搜索 ---------- */
function enterSearch(on) {
  $('screen').classList.toggle('searching', on);
  if (on) {
    $('q').value = H.filter;
    setTimeout(() => $('q').focus(), 30);
  } else {
    $('q').value = '';
    H.filter = '';
    render();
  }
}

/* ---------- 事件 ---------- */
$('btn-create').addEventListener('click', () => { location.href = editorUrl(); });

/* 四个能力入口：均为剪辑页内的真实功能模块，这里先说明再引导进编辑器 */
const CAP = {
  auto:   '智能成片：选中素材后按节奏自动生成一版可继续精修的工程',
  ref:    '参考仿剪：分析参考素材的节奏/转场/调色，用你的素材重剪',
  beat:   '音乐卡点：检测鼓点并自动在节拍处切分镜头',
  cutout: '智能抠像：人像/物品/绿幕分离，用于换背景与叠加'
};
document.querySelectorAll('.q').forEach((b) => {
  b.addEventListener('click', () => {
    const k = b.dataset.q;
    toast(CAP[k] || '功能开发中', 2400);
  });
});

$('btn-manage').addEventListener('click', () => {
  H.managing = !H.managing;
  if (!H.managing) H.picked.clear();
  render();
});

$('btn-search').addEventListener('click', () => enterSearch(true));
$('btn-cancel').addEventListener('click', () => enterSearch(false));
$('q').addEventListener('input', (e) => {
  H.filter = e.target.value;
  render();
});
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') enterSearch(false);
});

$('btn-me').addEventListener('click', () => {
  location.href = isLoggedIn() ? meUrl() : authUrl();
});
$('btn-settings').addEventListener('click', () => { location.href = settingsUrl(); });

/* ---------- 启动 ---------- */
(async function boot() {
  await loadProjects();
  render();
})();

</script>
</body>
</html>
