<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NairoClip · 我的</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/pages.css">
</head>
<body>
<div class="screen" id="screen">

  <header class="hd">
    <button class="hd-btn" id="btn-back" aria-label="返回"><svg class="i"><use href="#i-chevron"/></svg></button>
    <h1>我的</h1>
  </header>

  <div class="scroll">

    <div class="user">
      <div class="avatar" id="avatar">N</div>
      <div class="info">
        <div class="name" id="nickname">未登录</div>
        <div class="id" id="uid">ID: —</div>
        <button class="bind" id="btn-bind">未绑定手机号 · 去绑定</button>
      </div>
    </div>

    <button class="vip" id="btn-vip">
      <svg class="i vip-ico"><use href="#i-crown"/></svg>
      <div class="txt">
        <b>开通会员</b>
        <small>解锁全部特效 / 4K 导出 / 去水印</small>
      </div>
      <span class="go" id="vip-state">未开通 ›</span>
    </button>

    <div class="group">
      <button class="row" data-open="account">
        <svg class="i"><use href="#i-user"/></svg>
        <span>账号与安全</span>
        <svg class="i chev"><use href="#i-chevron-right"/></svg>
      </button>
      <div class="acc-body">
        <div class="line">手机号<span class="val" id="acc-phone">未绑定</span></div>
        <div class="line">微信 / QQ / Apple<span class="val">未绑定</span></div>
        <div class="line">修改密码<span class="val">›</span></div>
        <div class="line" style="color:#E5484D">账号注销<span class="val" style="color:#E5484D">›</span></div>
      </div>
    </div>

    <div class="group">
      <button class="row" data-open="general">
        <svg class="i"><use href="#i-sliders"/></svg>
        <span>剪辑偏好</span>
        <svg class="i chev"><use href="#i-chevron-right"/></svg>
      </button>
      <div class="acc-body">
        <div class="line">预览质量<span class="val" id="set-preview">自动</span></div>
        <div class="line">代理媒体<span class="val" id="set-proxy">关</span></div>
        <div class="line">默认导出<span class="val">1080P · 30fps</span></div>
      </div>
    </div>

    <div class="group" id="grp-storage">
      <button class="row" data-open="storage">
        <svg class="i"><use href="#i-folder"/></svg>
        <span>存储空间</span>
        <span class="val" id="storage-val">—</span>
        <svg class="i chev"><use href="#i-chevron-right"/></svg>
      </button>
      <div class="acc-body">
        <div class="line">AI 模型<span class="val" id="st-model">—</span></div>
        <div class="line">代理视频<span class="val" id="st-proxy">—</span></div>
        <div class="line">草稿工程<span class="val" id="st-draft">—</span></div>
        <div class="bar"><i id="st-bar" style="width:0%"></i></div>
        <div class="line" style="color:#6E7472;font-size:10.5px" id="st-note">读取中…</div>
      </div>
    </div>

    <div class="group">
      <button class="row" data-open="help">
        <svg class="i"><use href="#i-help"/></svg>
        <span>帮助与反馈</span>
        <svg class="i chev"><use href="#i-chevron-right"/></svg>
      </button>
      <div class="acc-body">
        <div class="line">意见反馈<span class="val">›</span></div>
        <div class="line">常见问题<span class="val">›</span></div>
        <!-- 「版权与许可」「AI 标识/模型说明」按用户要求藏在这里
             （2026-11-04：「藏到帮助与反馈里面，藏到最下面，
               不容易发现也就行了，但是可以找到，极深越好」）。
             放在展开区的最后两行，视觉上不显眼但路径可达：
             我的 → 帮助与反馈 → 展开 → 滚到最底 → 点击 -->
        <button class="line muted" data-doc="copyright">版权与许可<span class="val">›</span></button>
        <button class="line muted" data-doc="aiNotice">AI 生成内容标识说明<span class="val">›</span></button>
        <button class="line muted" data-doc="aiModels">AI 功能与模型说明<span class="val">›</span></button>
      </div>
    </div>

    <div class="group">
      <button class="row" data-open="about">
        <svg class="i"><use href="#i-info"/></svg>
        <span>关于 NairoClip</span>
        <span class="val" id="about-ver">—</span>
        <svg class="i chev"><use href="#i-chevron-right"/></svg>
      </button>
      <div class="acc-body">
        <div class="line">版本<span class="val" id="about-build">—</span></div>
        <div class="line">AI 引擎<span class="val" id="about-ai">—</span></div>
        <button class="line" data-doc="terms">用户协议<span class="val">›</span></button>
        <button class="line" data-doc="privacy">隐私政策<span class="val">›</span></button>
      </div>
    </div>

    <button class="logout" id="btn-logout">退出登录</button>
    <div class="copy">© 2026 NairoClip · 纯本地处理，素材不上传</div>
  </div>

  <!-- 底部导航已删除（用户 2026-11-04：「下面就不要导航键了」）。
       理由：首页左上角人像 = 我的，右上角齿轮 = 设置，
       功能都已可达，底部再放一排 Tab 是重复入口。
       原本的「剪辑/模板/消息」三个 Tab 里，只有「剪辑」能用，
       另两个是空的，留着反而暗示有未实现的功能。 -->
</div>

<script src="../assets/icons.js"></script>
<script src="../assets/me.js"></script>
</body>
</html>
