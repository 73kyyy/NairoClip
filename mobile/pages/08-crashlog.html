<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>崩溃日志</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
  .cl-wrap { padding: 0 16px 24px; }
  .cl-meta { font-size: 12px; color: var(--fg-3); margin-bottom: 10px; }
  .cl-body {
    font: 11px/1.6 var(--font-num, monospace);
    background: #0F1211; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; white-space: pre-wrap; word-break: break-all;
    color: #C8CFCC; max-height: 60vh; overflow: auto;
    -webkit-user-select: text; user-select: text;
  }
  .cl-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .cl-actions button {
    flex: 1 1 auto; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-2);
    color: var(--fg-1); font-size: 13px;
  }
  .cl-actions button.primary { background: var(--accent, #1F8A57); border-color: transparent; color: #fff; }
  .cl-empty { text-align: center; color: var(--fg-3); padding: 60px 20px; font-size: 13px; line-height: 1.8; }
  .cl-hint { font-size: 11px; color: var(--fg-3); margin-top: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="screen">
  <header class="hd">
    <button class="hd-btn" id="btn-back" aria-label="返回"><svg class="i"><use href="#i-chevron"/></svg></button>
    <h1 class="hd-title">崩溃日志</h1>
  </header>

  <div class="scroll cl-wrap">
    <div id="cl-content"></div>
  </div>
</div>
<script src="../assets/icons.js"></script>
<script src="../assets/crashlog.js"></script>
</body>
</html>
