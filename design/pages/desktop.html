<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NairoClip · 桌面剪辑台</title>
<link rel="stylesheet" href="/m/assets/tokens.css">
<link rel="stylesheet" href="/m/assets/editor.css">
<link rel="stylesheet" href="/assets/desktop.css">
</head>
<body>

<div class="app-d" id="app">

  <!-- ① 顶栏 -->
  <header class="d-topbar">
    <span class="d-brand">NairoClip</span>
    <button class="d-proj" id="btn-rename">未命名项目</button>
    <span class="d-meta" id="proj-meta">1080×1920 · 30fps</span>
    <div class="d-spacer"></div>
    <div class="d-group">
      <button class="d-ic" id="btn-undo" title="撤销 (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="d-ic" id="btn-redo" title="重做 (Ctrl+Shift+Z)"><svg class="i"><use href="#i-redo"/></svg></button>
    </div>
    <div class="d-sep"></div>
    <div class="d-group">
      <button class="d-ic" id="btn-split" title="在播放头分割 (S)"><svg class="i"><use href="#i-scissors"/></svg></button>
      <button class="d-ic" id="btn-marker" title="添加标记 (M)"><svg class="i"><use href="#i-hash"/></svg></button>
      <button class="d-ic" id="btn-delete" title="删除选中 (Del)"><svg class="i"><use href="#i-trash"/></svg></button>
    </div>
    <div class="d-sep"></div>
    <button class="d-btn" id="btn-save">保存</button>
    <button class="d-btn d-primary" id="btn-export">导出</button>
  </header>

  <!-- ② 三栏主体 -->
  <div class="d-main">

    <!-- 左栏：素材库 + 工具面板（剪映 PC：工具面板占满左栏） -->
    <aside class="d-left" id="d-left">
      <div class="d-pane-head">
        <span id="left-title">素材</span>
        <button class="d-ic d-sm" id="left-back" title="返回素材" hidden><svg class="i"><use href="#i-chevron"/></svg></button>
        <button class="d-ic d-sm" id="btn-import" title="导入素材"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <!-- 素材列表 -->
      <div class="d-assets" id="asset-list"></div>
      <!-- 工具二级面板（点底部一级分类后显示，取代素材列表） -->
      <div class="d-toolpane" id="tool-pane" hidden></div>
    </aside>

    <!-- 中栏：预览 + 走带 + 时间轴 -->
    <section class="d-center">
      <div class="d-stage" id="stage">
        <div class="d-canvas-wrap">
          <div class="d-canvas" id="canvas">
            <img class="d-still" id="still" alt="预览帧">
            <div class="d-empty" id="stage-empty">
              <span>导入素材开始剪辑</span>
            </div>
          </div>
        </div>
      </div>

      <div class="d-transport">
        <button class="d-ic" id="btn-start" title="回到起点 (Home)"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="d-ic" id="btn-prev" title="上一帧 (←)"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="d-ic d-play" id="btn-play" title="播放 (Space)"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="d-ic" id="btn-next" title="下一帧 (→)"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="d-ic" id="btn-end" title="到结尾 (End)"><svg class="i"><use href="#i-next"/></svg></button>
        <span class="d-tc" id="timecode">0:00.00</span>
        <div class="d-spacer"></div>
        <button class="d-ic" id="btn-snap" title="吸附" aria-pressed="true"><svg class="i"><use href="#i-key"/></svg></button>
        <div class="d-zoom">
          <button class="d-ic" id="btn-zoom-out" title="缩小"><svg class="i" style="transform:rotate(180deg)"><use href="#i-expand"/></svg></button>
          <input class="d-slider" id="zoom" type="range" min="20" max="300" value="74">
          <button class="d-ic" id="btn-zoom-in" title="放大"><svg class="i"><use href="#i-expand"/></svg></button>
        </div>
        <span class="d-hint" id="d-hint">长按轨道头空白 / 长按片段可移动整条轨道</span>
      </div>

      <!-- 时间轴：轨道头固定左列（Ae 式） -->
      <div class="d-timeline" id="timeline">
        <div class="d-ruler-row">
          <div class="d-ruler-pad">
            <button class="d-heads-toggle" id="heads-toggle" title="收起/展开轨道图标">
              <svg class="i"><use href="#i-chevron-down"/></svg>
            </button>
            <span class="d-ruler-label">轨道</span>
          </div>
          <div class="d-ruler" id="ruler">
            <canvas class="d-ruler-canvas" id="ruler-canvas"></canvas>
          </div>
        </div>
        <div class="d-tl-body">
          <div class="d-heads" id="track-heads"></div>
          <div class="d-lanes" id="tracks"></div>
        </div>
        <div class="d-playhead" id="playhead"><span class="d-ph-read" id="ph-read">0:00</span></div>
      </div>
    </section>

    <!-- 右栏：检查器 -->
    <aside class="d-right" id="d-right">
      <div class="d-pane-head">
        <span id="insp-title">工程</span>
        <button class="d-ic d-sm" id="btn-insp-close" title="收起"><svg class="i"><use href="#i-close"/></svg></button>
      </div>
      <div class="d-insp" id="inspector"></div>
    </aside>
  </div>

  <!-- ③ 底部：一级工具条（12 个分类，与移动端一致） -->
  <footer class="d-bar" id="bar">
    <div class="d-bar-track" id="bar-track"></div>
  </footer>
</div>

<!-- 素材选择弹层 -->
<div class="d-mask" id="sheet-mask" hidden>
  <div class="d-sheet">
    <div class="d-sheet-head">
      <span>添加素材</span>
      <button class="d-ic d-sm" id="sheet-close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="d-sheet-list" id="sheet-list"></div>
  </div>
</div>

<!-- 三级参数面板（右侧滑出，AE 的 Effect Controls / 剪映的参数面板） -->
<div class="d-mask d-mask-right" id="l3-mask" hidden>
  <div class="d-l3" id="l3">
    <div class="d-l3-head">
      <span id="l3-title">参数</span>
      <button class="d-ic d-sm" id="l3-reset" title="重置"><svg class="i"><use href="#i-reset"/></svg></button>
      <button class="d-ic d-sm" id="l3-close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="d-l3-body" id="l3-body"></div>
  </div>
</div>

<script src="/m/assets/icons.js"></script>
<script src="/assets/desktop.js"></script>
</body>
</html>
